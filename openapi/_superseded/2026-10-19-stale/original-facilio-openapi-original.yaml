  # ════════════════════════════════════════════════════════════════
  # Custom Modules
  # ════════════════════════════════════════════════════════════════

  /{moduleName}:
    get:
      tags: [Custom Modules]
      summary: List custom module records
      description: |
        Returns a paginated list of records from the custom module. Supports filtering, sorting, field selection, and saved views.
        Custom fields are excluded from list responses by default; use `?select=` to include them.
      operationId: listCustomModuleRecords
      parameters:
        - name: moduleName
          in: path
          required: true
          description: "Custom module name (e.g. `custom_employees`). Must be a module returned by `GET /modules` with `isCustom: true`."
          schema: {type: string}
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/view'
        - $ref: '#/components/parameters/changed'
        - name: sortBy
          in: query
          description: "Field to sort by. Sortable fields: `name`, `sysCreatedTime`, `sysModifiedTime`. Custom fields of primitive types (string, number, date) are also sortable."
          schema:
            type: string
            enum: [name, sysCreatedTime, sysModifiedTime]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
              example:
                success: true
                data:
                  - {id: 1, name: "Alice", siteId: {id: 10}, moduleState: {id: 1}, sysCreatedTime: "2026-01-15T10:00:00Z", sysModifiedTime: "2026-03-01T14:30:00Z"}
                  - {id: 2, name: "Bob",   siteId: {id: 10}, moduleState: {id: 1}, sysCreatedTime: "2026-01-16T09:00:00Z", sysModifiedTime: "2026-03-02T11:00:00Z"}
                pagination: {page: 1, pageSize: 50}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Custom Modules]
      summary: Create a custom module record
      description: Creates a new record. Pass field values in `data`; see metadata for required fields and types.
      operationId: createCustomModuleRecord
      parameters:
        - name: moduleName
          in: path
          required: true
          description: Custom module name
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: {type: object, description: "Record field values"}
            example:
              data:
                name: "Alice"
                department_custom_employees: "Engineering"
      responses:
        '201':
          description: Record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /{moduleName}/{id}:
    get:
      tags: [Custom Modules]
      summary: Get a custom module record
      description: Returns a single record by ID. All fields are included in the response, including custom fields.
      operationId: getCustomModuleRecord
      parameters:
        - name: moduleName
          in: path
          required: true
          description: Custom module name
          schema: {type: string}
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
      responses:
        '200':
          description: Record retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
              example:
                success: true
                data: {id: 1, name: "Alice", siteId: {id: 10}, department_custom_employees: "Engineering"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Custom Modules]
      summary: Update a custom module record
      description: Partially updates a record. Only include the fields you want to change. Pass `null` to clear a field.
      operationId: updateCustomModuleRecord
      parameters:
        - name: moduleName
          in: path
          required: true
          description: Custom module name
          schema: {type: string}
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: {type: object}
            example:
              data:
                department_custom_employees: "Finance"
      responses:
        '200':
          description: Record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Custom Modules]
      summary: Delete a custom module record
      description: Permanently deletes a record from the custom module.
      operationId: deleteCustomModuleRecord
      parameters:
        - name: moduleName
          in: path
          required: true
          description: Custom module name
          schema: {type: string}
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Record deleted
          content:
            application/json:
              example: {success: true, message: "Record deleted"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /{moduleName}/metadata:
    get:
      tags: [Custom Modules]
      summary: Get custom module field schema
      description: |
        Returns module identity and field schema (types, required, readOnly, lookup targets). Each field includes `isCustom` and, for text-style fields, the canonical `max_length` (255 / 2000 / 32000).
        Works for any module name returned by `GET /modules`.

        Pass `?includeAllowedValues=true` to add `allowed_values` ([{label, value}]) on every picklist-capable field — `ENUM`, `SYSTEM_ENUM`, `MULTI_ENUM`, `STRING_SYSTEM_ENUM`, and `LOOKUP` fields targeting system picklist modules. Default behavior (no flag) is unchanged.
      operationId: getCustomModuleMetadata
      parameters:
        - name: moduleName
          in: path
          required: true
          description: Module name — any module returned by `GET /modules`
          schema: {type: string}
        - $ref: '#/components/parameters/includeAllowedValues'
      responses:
        '200':
          description: Field schema retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleMetaResponse'
              example:
                success: true
                data:
                  module:
                    name: custom_employees
                    displayName: "Employees"
                    description: "Custom employee records"
                    isCustom: true
                  fields:
                    - name: name
                      displayName: "Name"
                      dataType: STRING
                      required: true
                      readOnly: false
                      isCustom: false
                      max_length: 255
                    - name: siteId
                      displayName: "Site"
                      dataType: LOOKUP
                      lookupModuleName: site
                      required: false
                      readOnly: false
                      isCustom: false
                    - name: externalField
                      displayName: "External Field"
                      dataType: STRING
                      required: false
                      readOnly: false
                      isCustom: false
                      max_length: 255
                    - name: moduleState
                      displayName: "Status"
                      dataType: LOOKUP
                      lookupModuleName: ticketstatus
                      required: false
                      readOnly: false
                      isCustom: false
                      allowed_values:
                        - {label: "Submitted", value: "Submitted"}
                        - {label: "Open",      value: "Open"}
                        - {label: "Closed",    value: "Closed"}
                    - name: sysCreatedTime
                      displayName: "Created Time"
                      dataType: DATE_TIME
                      required: false
                      readOnly: true
                      isCustom: false
                    - name: sysCreatedBy
                      displayName: "Created By"
                      dataType: LOOKUP
                      lookupModuleName: users
                      required: false
                      readOnly: true
                      isCustom: false
                    - name: sysModifiedTime
                      displayName: "Modified Time"
                      dataType: DATE_TIME
                      required: false
                      readOnly: true
                      isCustom: false
                    - name: sysModifiedBy
                      displayName: "Modified By"
                      dataType: LOOKUP
                      lookupModuleName: users
                      required: false
                      readOnly: true
                      isCustom: false
                    - name: department_custom_employees
                      displayName: "Department"
                      dataType: STRING
                      required: false
                      readOnly: false
                      isCustom: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

