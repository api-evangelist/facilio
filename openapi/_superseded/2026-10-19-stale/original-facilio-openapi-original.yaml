      tags: [Client Credits]
      summary: List client credits
      operationId: listClientCredits
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/changed'
        - name: sortBy
          in: query
          schema: {type: string, enum: [id, localId, creditNumber, issueDate, expiryDate, sysCreatedTime, sysModifiedTime]}
        - name: sortOrder
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
      responses:
        '200':
          description: List of client credits
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 1, localId: 1, creditNumber: "1", subject: "CC-01", client: {id: 1}, subTotal: 750.0, totalCost: 750.0, clientCreditNoteStatus: "Awaiting Refund", sysCreatedTime: "2026-03-10T08:26:21Z"}
                pagination: {page: 1, pageSize: 50}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Client Credits]
      summary: Create a client credit
      operationId: createClientCredit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/ClientCredit'
            example:
              data:
                subject: "CC-Refund-01"
                description: "Refund for overpayment"
                client: {id: 1}
                issueDate: "2026-03-10"
                expiryDate: "2026-04-10"
                site: {id: 1}
                lineItems:
                  - {type: "Service", service: {id: 1}, quantity: 3, unitPrice: 200.0, cost: 600.0}
                  - {type: "Others", description: "Miscellaneous credit", quantity: 1, unitPrice: 150.0, cost: 150.0}
      responses:
        '201':
          description: Client credit created
          content:
            application/json:
              example: {success: true, data: {id: 2, localId: 2, subject: "CC-Refund-01"}, message: "Record created"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /clientCredit/{id}:
    get:
      tags: [Client Credits]
      summary: Get a client credit
      description: Returns a single client credit with all fields and line items.
      operationId: getClientCredit
      parameters: [{$ref: '#/components/parameters/recordId'}, {$ref: '#/components/parameters/select'}, {$ref: '#/components/parameters/expand'}]
      responses:
        '200':
          description: Client credit details with line items
          content:
            application/json:
              example:
                success: true
                data:
                  id: 1
                  localId: 1
                  creditNumber: "1"
                  subject: "CC-01"
                  description: "Refund for overpayment"
                  client: {id: 1, name: "Acme Corp"}
                  clientContract: {id: 8}
                  invoices: [{id: 12, subject: "INV-05"}]
                  site: {id: 1, name: "Main Campus"}
                  contact: {id: 5, name: "Jane Smith"}
                  issueDate: "2026-03-10"
                  expiryDate: "2026-04-10"
                  subTotal: 750.0
                  totalCost: 750.0
                  totalTaxAmount: 0.0
                  clientCreditNoteStatus: "Awaiting Refund"
                  revisionNumber: 0
                  notes: "Credit for overpayment on invoice"
                  billToAddress: {street: "456 Oak Ave", city: "Dallas", state: "TX", zip: "75201", country: "US"}
                  sysCreatedByPeople: {id: 1, name: "Alex Johnson", email: "alex@example.com"}
                  sysCreatedTime: "2026-03-10T08:26:21Z"
                  sysModifiedTime: "2026-03-10T08:26:21Z"
                  lineItems:
                    - {id: 1, type: "Service", service: {id: 1}, quantity: 3.0, unitPrice: 200.0, cost: 600.0, taxAmount: 0.0}
                    - {id: 2, type: "Others", description: "Miscellaneous credit", quantity: 1.0, unitPrice: 150.0, cost: 150.0, taxAmount: 0.0}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Client Credits]
      summary: Update a client credit
      description: |
        Updates a client credit. When `lineItems` is included, it represents the full desired state.
        Existing line items not in the array are deleted. Include `id` to update an existing line item.
