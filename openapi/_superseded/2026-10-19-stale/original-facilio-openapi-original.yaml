      summary: Get a receivable
      description: |
        Single receivable with linked PO summary fields. Child **`receipts`** array lists receipt rows for this receivable.
      operationId: getReceivable
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
      responses:
        '200':
          description: Receivable with receipts
          content:
            application/json:
              example:
                success: true
                data:
                  id: 12
                  localId: 12
                  status: "Partially Received"
                  poId: {id: 12, name: "PO-001", storeRoom: {id: 1}}
                  vendor: {id: 1}
                  storeRoom: {id: 1}
                  receipts:
                    - {id: 4, receivableId: 12, lineItem: {id: 69}, quantity: 2.0, status: "Received", receiptTime: "2026-04-13T12:40:25Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /receivable/{id}/addreceipt:
    post:
      tags: [Receivables]
      summary: Add a receipt line
      description: Record how much was received against a purchase order line for this receivable. Send the line item reference and quantity in the body (see examples).
      operationId: receivableAddReceipt
      parameters:
        - $ref: '#/components/parameters/recordId'
        - name: executeWorkflows
          in: query
          schema: {type: boolean, default: true}
          description: When false, configured automations are not run for this request (default true).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/Receipt'
            example:
              data: {lineItem: 75, quantity: 1}
      responses:
        '201':
          description: Receipt created
          content:
            application/json:
              example:
                success: true
                message: "Receipt created"
                data: {id: 7, receivableId: 12, lineItem: {id: 75}, quantity: 1.0, status: "Received", receiptTime: "2026-04-13T15:53:33Z"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /receivable/{id}/stock:
    post:
      tags: [Receivables]
      summary: Stock received PO lines into the storeroom
      description: Update storeroom inventory for item and tool lines that have already been received on this receivable. Send the rows in the request body (see examples). Requires update access on receivables.
      operationId: receivableStock
      parameters:
        - $ref: '#/components/parameters/recordId'
        - name: executeWorkflows
          in: query
          schema: {type: boolean, default: true}
          description: When false, configured automations are not run for this request (default true).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  description: Array of stocking rows in `lineItems`, or the same array under `lineItemsStockQuantity`. At least one must be present and non-empty.
                  properties:
                    lineItems:
                      type: array
                      items: {$ref: '#/components/schemas/POLineItemStock'}
                    lineItemsStockQuantity:
                      type: array
                      items: {$ref: '#/components/schemas/POLineItemStock'}
            example:
              data:
                lineItems:
                  - {lineItem: 77, quantity: 1, receipt: 7, bin: "Receiving-Aisle-1"}
      responses:
        '200':
          description: Stock posted
          content:
            application/json:
              example:
                success: true
                data: {success: true, purchaseOrderId: 16, receivableId: 16}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /receivable/metadata:
    get:
      tags: [Receivables]
      summary: Get receivable field schema
      description: Field schema for the receivable module (system + custom fields).
      operationId: getReceivableMetadata
      parameters:
        - $ref: '#/components/parameters/includeAllowedValues'
      responses:
        '200':
          description: Field schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleMetaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════════════════════════
  # Items (per storeroom) — read + adjustment + bins
  # ════════════════════════════════════════════════════════════════

  /item:
    get:
      tags: [Items]
      summary: List items
      description: Item balances per storeroom (read-only). Standard list filters apply (e.g. by `storeRoom`, `itemType`).
      operationId: listStockedItems
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/changed'
        - name: sortBy
          in: query
          schema: {type: string, enum: [id, quantity, currentQuantity, rate, sysCreatedTime, sysModifiedTime]}
        - name: sortOrder
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
      responses:
        '200':
          description: List of item records
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 1, itemType: {id: 1}, storeRoom: {id: 1}, currentQuantity: 100.0, quantity: 100.0}
                pagination: {page: 1, pageSize: 50}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /item/{id}:
    get:
      tags: [Items]
      summary: Get an item
      operationId: getStockedItem
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
      responses:
        '200':
          description: Item record
          content:
            application/json:
              example:
                success: true
                data: {id: 1, itemType: {id: 1}, storeRoom: {id: 1}, currentQuantity: 100.0, defaultBin: {id: 2}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /item/adjustment:
    post:
      tags: [Items]
      summary: Adjust item quantity (non-rotating types)
      description: |
        Posts an **adjustment increase** or **decrease** via item transactions. **Rotating** item types are rejected.
        If no item row exists for the given **itemType** + **storeRoom**, one may be created as part of the operation.
        Optional **`executeWorkflows`** query. Requires **UPDATE** on the item module.
      operationId: itemAdjustment
      parameters:
        - name: executeWorkflows
          in: query
          schema: {type: boolean, default: true}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/ItemAdjustment'
            example:
              data:
                adjustmentType: increase
                quantity: 5
                itemType: 2
                storeRoom: 1
                bin: "A-1"
                unitCost: 3.5
      responses:
        '200':
          description: Adjustment applied
          content:
            application/json:
              example:
                success: true
                message: "Adjustment posted"
                data: {id: 1, itemType: {id: 2}, storeRoom: {id: 1}, currentQuantity: 105.31}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /item/{id}/bin:
    get:
      tags: [Items]
      summary: List bins and on-hand quantities for an item
      description: Returns bins with quantities for the item id in the path (the same id as `GET /item/{id}`).
      operationId: listItemBins
      parameters:
        - name: id
          in: path
          required: true
          description: Item record id (not item type id).
          schema: {type: integer}
      responses:
        '200':
          description: Bin rows
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 3, name: "Shelf-A", quantity: 0.25, isVirtualBin: false}
                  - {id: 2, name: "Virtual", quantity: 104.06, isVirtualBin: true}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /item/metadata:
    get:
      tags: [Items]
      summary: Get item field schema
      operationId: getStockedItemMetadata
      parameters:
        - $ref: '#/components/parameters/includeAllowedValues'
      responses:
        '200':
          description: Field schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleMetaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════════════════════════
  # Tools (per storeroom) — read + adjustment + bins
  # ════════════════════════════════════════════════════════════════

  /tool:
    get:
      tags: [Tools]
      summary: List tools
      operationId: listStockedTools
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/changed'
        - name: sortBy
          in: query
          schema: {type: string, enum: [id, quantity, currentQuantity, rate, sysCreatedTime, sysModifiedTime]}
        - name: sortOrder
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
      responses:
        '200':
          description: List of tool records
          content:
            application/json:
              example: {success: true, data: [{id: 1, toolType: {id: 1}, storeRoom: {id: 1}, currentQuantity: 10.0}], pagination: {page: 1, pageSize: 50}}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tool/{id}:
    get:
      tags: [Tools]
      summary: Get a tool
      operationId: getStockedTool
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
      responses:
        '200':
          description: Tool record
          content:
            application/json:
              example: {success: true, data: {id: 1, toolType: {id: 1}, storeRoom: {id: 1}, currentQuantity: 10.0}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tool/{id}/bin:
    get:
      tags: [Tools]
      summary: List bins and on-hand quantities for a tool
      description: Returns bins with quantities for the tool id in the path (the same id as `GET /tool/{id}`).
      operationId: listToolBins
      parameters:
        - name: id
          in: path
          required: true
          description: Tool record id (not tool type id).
          schema: {type: integer}
      responses:
        '200':
          description: Bin rows
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 3, name: "Shelf-A", quantity: 2.0, isVirtualBin: false}
                  - {id: 2, name: "Virtual", quantity: 8.0, isVirtualBin: true}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tool/adjustment:
    post:
      tags: [Tools]
      summary: Adjust tool quantity (non-rotating types)
      description: |
        Same pattern as **`POST /item/adjustment`** for tools. **Rotating** tool types are rejected.
        Requires **UPDATE** on the tool module.
      operationId: toolAdjustment
      parameters:
        - name: executeWorkflows
          in: query
          schema: {type: boolean, default: true}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/ToolAdjustment'
            example:
              data:
                adjustmentType: decrease
                quantity: 2
                toolType: 1
                storeRoom: 1
                bin: "A-1"
      responses:
        '200':
          description: Adjustment applied
          content:
            application/json:
              example: {success: true, message: "Adjustment posted", data: {id: 1, currentQuantity: 8.0}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tool/metadata:
    get:
      tags: [Tools]
      summary: Get tool field schema
      operationId: getStockedToolMetadata
      parameters:
        - $ref: '#/components/parameters/includeAllowedValues'
      responses:
        '200':
          description: Field schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleMetaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════════════════════════
  # Inventory Requests
  # ════════════════════════════════════════════════════════════════

  /inventoryrequest:
    get:
      tags: [Inventory Requests]
      summary: List inventory requests
      operationId: listInventoryRequests
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/changed'
        - name: sortBy
          in: query
          schema: {type: string, enum: [id, localId, name, requestedTime, requiredTime, sysCreatedTime, sysModifiedTime]}
        - name: sortOrder
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
      responses:
        '200':
          description: List of inventory requests
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 1, localId: 1, name: "Need 5 items", moduleState: "pending", storeRoom: {id: 1}, workorder: {id: 13}, requestedTime: "2026-03-10", sysCreatedTime: "2026-03-10T09:25:25Z"}
                pagination: {page: 1, pageSize: 50}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Inventory Requests]
      summary: Create an inventory request
      description: Creates a new inventory request. `name`, `storeRoom`, and `workorder` are required.
      operationId: createInventoryRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/InventoryRequest'
            example:
              data:
                name: "IR-HVAC-Parts"
                storeRoom: {id: 1}
                workorder: {id: 13}
                lineItems:
                  - {inventoryType: "Item", itemType: {id: 1}, quantity: 5, storeRoom: {id: 1}}
                  - {inventoryType: "Tool", toolType: {id: 1}, quantity: 2, storeRoom: {id: 1}}
      responses:
        '201':
          description: Inventory request created
          content:
            application/json:
              example: {success: true, data: {id: 2, localId: 2, name: "IR-HVAC-Parts"}, message: "Record created"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /inventoryrequest/{id}:
    get:
      tags: [Inventory Requests]
      summary: Get an inventory request
      description: Returns a single inventory request with all fields and line items.
      operationId: getInventoryRequest
      parameters: [{$ref: '#/components/parameters/recordId'}, {$ref: '#/components/parameters/select'}, {$ref: '#/components/parameters/expand'}]
      responses:
        '200':
          description: Inventory request details with line items
          content:
            application/json:
              example:
                success: true
                data:
                  id: 1
                  localId: 1
                  name: "Need 5 items"
                  moduleState: "fullyreserved"
                  requestedBy: {id: 1, name: "Alex Johnson", email: "alex@example.com"}
                  requestedFor: {id: 1, name: "Alex Johnson", email: "alex@example.com"}
                  storeRoom: {id: 1, name: "Warehouse-1"}
                  workorder: {id: 13, subject: "WO-1"}
                  requestedTime: "2026-03-10"
                  requiredTime: "2026-03-23"
                  sysCreatedBy: {id: 1, name: "Alex Johnson", email: "alex@example.com"}
                  sysCreatedTime: "2026-03-10T09:25:25Z"
                  sysModifiedTime: "2026-03-10T09:27:06Z"
                  lineItems:
                    - {id: 1, inventoryType: "Item", itemType: {id: 1}, quantity: 5.0, storeRoom: {id: 1}, issuedQuantity: 0.0, lineItemStatus: "Reserved"}
                    - {id: 2, inventoryType: "Tool", toolType: {id: 1}, quantity: 2.0, storeRoom: {id: 1}, issuedQuantity: 0.0, lineItemStatus: "Reserved"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Inventory Requests]
      summary: Update an inventory request
      description: |
        Updates an inventory request. When `lineItems` is included, it represents the full desired state.
        Existing line items not in the array are deleted. Include `id` to update an existing line item.
      operationId: updateInventoryRequest
      parameters: [{$ref: '#/components/parameters/recordId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/InventoryRequest'
            example:
              data:
                description: "Urgent request"
                lineItems:
                  - {id: 1, quantity: 10}
                  - {inventoryType: "Item", itemType: {id: 2}, quantity: 3, storeRoom: {id: 1}}
      responses:
        '200':
          description: Inventory request updated
          content:
            application/json:
              example: {success: true, data: {id: 1, localId: 1, name: "Need 5 items"}, message: "Record updated"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Inventory Requests]
      summary: Delete an inventory request
      operationId: deleteInventoryRequest
      parameters: [{$ref: '#/components/parameters/recordId'}]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              example: {success: true, message: "Record deleted"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventoryrequest/metadata:
    get:
      tags: [Inventory Requests]
      summary: Get inventory request field schema
      description: Returns the field schema for the inventoryrequest module, including all declared system fields and any org-specific custom fields with their data type, required/readOnly flags, and lookup targets.
      operationId: getInventoryRequestMetadata
      parameters:
        - $ref: '#/components/parameters/includeAllowedValues'
      responses:
        '200':
          description: Field schema retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleMetaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════════════════════════
  # Vendor Credits
  # ════════════════════════════════════════════════════════════════

  /vendorCredit:
    get:
      tags: [Vendor Credits]
      summary: List vendor credits
      operationId: listVendorCredits
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/changed'
        - name: sortBy
          in: query
          schema: {type: string, enum: [id, localId, creditNumber, issueDate, expiryDate, sysCreatedTime, sysModifiedTime]}
        - name: sortOrder
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
      responses:
        '200':
          description: List of vendor credits
          content:
            application/json:
              example:
