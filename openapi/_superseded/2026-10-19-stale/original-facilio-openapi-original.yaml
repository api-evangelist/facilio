                  sysModifiedTime: "2026-03-10T08:26:21Z"
                  lineItems:
                    - {id: 1, type: "Service", service: {id: 1}, quantity: 2.0, unitPrice: 100.0, cost: 200.0, taxAmount: 0.0}
                    - {id: 2, type: "Others", description: "Adjustment", quantity: 1.0, unitPrice: 50.0, cost: 50.0, taxAmount: 0.0}
        '401':
