      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              example:
                success: true
                data:
                  - id: 103
                    fileName: "invoice.pdf"
                    fileSize: 512000
                    contentType: "application/pdf"
                    createdTime: "2026-02-14T10:30:00Z"
                message: "Attachment(s) added successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workorder/{id}/attachments/{attachmentId}:
    delete:
      tags: [Work Order Attachments]
      summary: Delete work order attachment
      description: Deletes a specific attachment from the work order.
      operationId: deleteWorkOrderAttachment
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/attachmentId'
      responses:
        '200':
          description: Attachment deleted
          content:
            application/json:
              example:
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /workorder/{id}/attachments/{attachmentId}/download:
    get:
      tags: [Work Order Attachments]
      summary: Download work order attachment
      description: Downloads the file content of a specific attachment. Returns the raw file with appropriate Content-Type and Content-Disposition headers.
      operationId: downloadWorkOrderAttachment
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/attachmentId'
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Work Order Comments ──

  /workorder/{id}/comments:
    get:
      tags: [Work Order Comments]
      summary: List work order comments
      description: Returns all comments/notes for the specified work order, sorted by creation time.
      operationId: listWorkOrderComments
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              example:
                success: true
                data:
                  - id: 201
                    body: "Technician dispatched to site"
                    bodyHTML: "<p>Technician dispatched to site</p>"
                    createdTime: "2026-02-12T17:30:00Z"
                    createdBy: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
                  - id: 202
                    body: "Parts ordered, ETA 2 days"
                    bodyHTML: "<p>Parts ordered, ETA 2 days</p>"
                    externalId: "ext-note-001"
                    createdTime: "2026-02-13T10:00:00Z"
                    createdBy: {id: 5, name: "John Smith", email: "john@facilio.com"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Work Order Comments]
      summary: Add work order comment
      description: Adds a comment/note to the work order. Optionally notify the requester.
      operationId: addWorkOrderComment
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/WorkOrderComment'
            example:
              data:
                body: "Work has been completed. Awaiting inspection."
                notifyRequester: true
                externalId: "ext-note-002"
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              example:
                success: true
                data:
                  id: 203
                  body: "Work has been completed. Awaiting inspection."
                  createdTime: "2026-02-14T15:00:00Z"
                  createdBy: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
                message: "Comment added successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workorder/{id}/comments/{commentId}:
    patch:
      tags: [Work Order Comments]
      summary: Update work order comment
      description: Updates the body text of an existing comment.
      operationId: updateWorkOrderComment
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/commentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
