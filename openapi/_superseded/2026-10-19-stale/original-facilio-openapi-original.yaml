        Existing line items not in the array are deleted. Include `id` to update an existing line item.
      operationId: updateVendorCredit
      parameters: [{$ref: '#/components/parameters/recordId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/VendorCredit'
            example:
              data:
                description: "Updated refund details"
                lineItems:
                  - {id: 1, quantity: 3, unitPrice: 100.0, cost: 300.0}
                  - {type: "Others", description: "Late fee credit", quantity: 1, unitPrice: 25.0, cost: 25.0}
      responses:
        '200':
          description: Vendor credit updated
