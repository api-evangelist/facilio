                  - {type: "Others", description: "Additional credit", quantity: 1, unitPrice: 50.0, cost: 50.0}
      responses:
        '200':
          description: Client credit updated
          content:
            application/json:
              example: {success: true, data: {id: 1, localId: 1, subject: "CC-01"}, message: "Record updated"}
