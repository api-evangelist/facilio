        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Work Order Tasks ──

  /workorder/{id}/tasks:
    get:
      tags: [Work Orders]
      summary: List work order tasks
      description: Returns checklist tasks for the work order, with each task including its photos.
      operationId: listWorkOrderTasks
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: List of work order tasks
          content:
            application/json:
              example:
                success: true
                data:
                  - id: 801
                    subject: "Verify compressor pressure"
                    description: "Check suction and discharge pressure"
                    status: "open"
                    photos:
                      - id: 1101
                        fileName: "before.jpg"
                        contentType: "image/jpeg"
                        type: "before"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Work Orders]
      summary: Create work order task
      description: Creates a checklist task under the given work order.
      operationId: createWorkOrderTask
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/WorkOrderTask'
            example:
              data:
                subject: "Inspect condenser coil"
                description: "Capture before/after photos"
      responses:
        '201':
          description: Task created
          content:
            application/json:
              example:
                success: true
                data:
                  id: 802
                  subject: "Inspect condenser coil"
                  status: "open"
                  photos: []
                message: "Task created"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /workorder/{id}/tasks/{taskId}:
    get:
      tags: [Work Orders]
      summary: Get work order task
      description: Returns a single checklist task with photos.
      operationId: getWorkOrderTask
      parameters:
        - $ref: '#/components/parameters/recordId'
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    $ref: '#/components/schemas/WorkOrderTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Work Orders]
      summary: Update or complete work order task
      description: Updates task fields. Set `status=closed` to complete the task and `status=open` to reopen.
      operationId: updateWorkOrderTask
      parameters:
        - $ref: '#/components/parameters/recordId'
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/WorkOrderTask'
            example:
              data:
                status: "closed"
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              example:
                success: true
                message: "Task updated"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Work Orders]
      summary: Delete work order task
      operationId: deleteWorkOrderTask
      parameters:
        - $ref: '#/components/parameters/recordId'
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              example:
                success: true
                message: "Record deleted"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /workorder/{id}/tasks/{taskId}/photos:
    post:
      tags: [Work Orders]
      summary: Upload work order task photo
      description: Uploads a task photo with type `before` or `after`. Only image files are accepted.
      operationId: addWorkOrderTaskPhoto
      parameters:
        - $ref: '#/components/parameters/recordId'
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [attachment, type]
              properties:
                attachment:
                  type: string
                  format: binary
                  description: Image file only (jpeg, png, gif, webp, bmp, tiff, heic/heif)
                type:
                  type: string
                  enum: [before, after]
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkOrderTaskPhoto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

