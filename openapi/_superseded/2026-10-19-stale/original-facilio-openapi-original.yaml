        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Comment & Attachment ──

    # ── Work Order Comment & Attachment ──

    WorkOrderComment:
      type: object
      description: "Work order comment/note."
      required: [body]
      properties:
        id: {type: integer, readOnly: true, description: "Comment ID"}
        body: {type: string, description: "Comment text content (required on create)"}
        bodyHTML: {type: string, readOnly: true, description: "HTML-formatted comment body"}
        externalId: {type: string, description: "Your external reference ID"}
        notifyRequester: {type: boolean, default: false, description: "Send notification to the requester"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp"}
        createdBy: {readOnly: true, description: "User who posted the comment", allOf: [{$ref: '#/components/schemas/User'}]}

    WorkOrderAttachment:
      type: object
      description: "Work order file attachment."
      properties:
        id: {type: integer, readOnly: true, description: "Attachment ID"}
        fileName: {type: string, readOnly: true, description: "Original file name"}
        fileSize: {type: integer, readOnly: true, description: "File size in bytes"}
        contentType: {type: string, readOnly: true, description: "MIME type (e.g. application/pdf, image/jpeg)"}
        externalId: {type: string, description: "Your external reference ID"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Upload timestamp"}
        createdBy: {readOnly: true, description: "User who uploaded the file", allOf: [{$ref: '#/components/schemas/User'}]}

    WorkOrderTaskPhoto:
      type: object
      description: "Task file attachment with before/after type."
      properties:
        id: {type: integer, readOnly: true}
        fileName: {type: string, readOnly: true}
        fileSize: {type: integer, readOnly: true}
        contentType: {type: string, readOnly: true}
        type: {type: string, enum: [before, after], description: "Photo type"}
        createdTime: {type: string, format: date-time, readOnly: true}

    WorkOrderTask:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        subject: {type: string}
        description: {type: string}
        status: {type: string, enum: [open, closed]}
        createdTime: {type: string, format: date-time, readOnly: true}
        modifiedTime: {type: string, format: date-time, readOnly: true}
        photos:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderTaskPhoto'

    # ── Service Request Comment & Attachment ──

    ServiceRequestComment:
      type: object
      description: "Service request comment/note."
      required: [body]
      properties:
        id: {type: integer, readOnly: true, description: "Comment ID"}
        body: {type: string, description: "Comment text content (required on create)"}
        bodyHTML: {type: string, readOnly: true, description: "HTML-formatted comment body"}
        externalId: {type: string, description: "Your external reference ID"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp"}
        createdBy: {readOnly: true, description: "User who posted the comment", allOf: [{$ref: '#/components/schemas/User'}]}

    ServiceRequestAttachment:
      type: object
      description: "Service request file attachment."
      properties:
        id: {type: integer, readOnly: true, description: "Attachment ID"}
        fileName: {type: string, readOnly: true, description: "Original file name"}
        fileSize: {type: integer, readOnly: true, description: "File size in bytes"}
        contentType: {type: string, readOnly: true, description: "MIME type (e.g. application/pdf, image/jpeg)"}
        externalId: {type: string, description: "Your external reference ID"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Upload timestamp"}
        createdBy: {readOnly: true, description: "User who uploaded the file", allOf: [{$ref: '#/components/schemas/User'}]}

    # ── Item Type ──

    ItemType:
      type: object
      description: "Consumable material in inventory."
      required: [name]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, maxLength: 255, description: "Item type name (required, sortable)"}
        description: {type: string, maxLength: 2000, description: "Description"}
        category: {type: integer, description: "Inventory category ID (lookup). Returns {id, name} on GET."}
        quantity: {type: number, format: double, readOnly: true, description: "Total quantity across storerooms"}
        currentQuantity: {type: number, format: double, readOnly: true, description: "Available quantity"}
        minimumQuantity: {type: number, format: double, description: "Reorder threshold"}
        costType: {type: string, enum: [FIFO, LIFO], description: "Costing method"}
        sellingPrice: {type: number, format: double, description: "Selling price per unit"}
        lastPurchasedPrice: {type: number, format: double, readOnly: true, description: "Last purchase price"}
        lastIssuedDate: {type: string, format: date, readOnly: true, description: "Last issued date"}
        lastPurchasedDate: {type: string, format: date, readOnly: true, description: "Last purchased date"}
        isRotating: {type: boolean, description: "Whether individually tracked (serialized)"}
        isApprovalNeeded: {type: boolean, description: "Whether issuance requires approval"}
        isConsumable: {type: boolean, description: "Whether consumed on use"}
        lotType: {type: boolean, description: "Whether tracked by lot"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    # ── Tool Type ──

    ToolType:
      type: object
      description: "Reusable equipment tracked in inventory."
      required: [name]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, maxLength: 255, description: "Tool type name (required, sortable)"}
        description: {type: string, maxLength: 2000, description: "Description"}
        category: {type: integer, description: "Inventory category ID (lookup). Returns {id, name} on GET."}
        quantity: {type: number, format: double, readOnly: true, description: "Total quantity across storerooms"}
        currentQuantity: {type: number, format: double, readOnly: true, description: "Available quantity"}
        minimumQuantity: {type: number, format: double, description: "Reorder threshold"}
        sellingPrice: {type: number, format: double, description: "Rate per unit"}
        lastIssuedDate: {type: string, format: date, readOnly: true, description: "Last issued date"}
        lastPurchasedDate: {type: string, format: date, readOnly: true, description: "Last purchased date"}
        isRotating: {type: boolean, description: "Whether individually tracked (serialized)"}
        isApprovalNeeded: {type: boolean, description: "Whether issuance requires approval"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    # ── Service ──

    Service:
      type: object
      description: "Labor or service offering."
      required: [name]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, maxLength: 255, description: "Service name (required, sortable)"}
        description: {type: string, maxLength: 2000, description: "Description"}
        status: {type: string, description: "Status — pass `status` value or numeric ID. Use `GET /picklist/service/status` for valid values."}
        buyingPrice: {type: number, format: double, description: "Cost price"}
        sellingPrice: {type: number, format: double, description: "Selling price"}
        duration: {type: number, format: double, description: "Duration in hours"}
        paymentType: {type: string, enum: [Fixed, Hourly], description: "Payment type"}
        sysCreatedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    # ── Storeroom ──

    Storeroom:
      type: object
      description: "Warehouse location."
      required: [name, site]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, maxLength: 255, description: "Storeroom name (required, sortable)"}
        description: {type: string, maxLength: 2000, description: "Description"}
        site: {type: integer, description: "Site ID (required). Returns {id, name} on GET."}
        location: {readOnly: true, description: "Address derived from site", allOf: [{$ref: '#/components/schemas/Address'}]}
        servingsites: {type: array, items: {type: object}, description: "Sites served by this storeroom. Pass as [{id: x}]."}
        noOfItemTypes: {type: integer, readOnly: true, description: "Number of item types (sortable)"}
        noOfToolTypes: {type: integer, readOnly: true, description: "Number of tool types (sortable)"}
        itemTotalCost: {type: number, format: double, readOnly: true, description: "Total item cost (sortable)"}
        toolTotalCost: {type: number, format: double, readOnly: true, description: "Total tool cost (sortable)"}
        isApprovalNeeded: {type: boolean, description: "Whether issuance requires approval"}
        isGatePassRequired: {type: boolean, description: "Whether gate pass is required"}
        owner: {type: integer, description: "Owner user ID. Expanded per `users` when returned on GET/create/update."}
        lastPurchasedDate: {type: string, format: date, readOnly: true, description: "Last purchase date"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    # ── Quote ──

    Quote:
      type: object
      description: "Quote with line items."
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        localId: {type: integer, readOnly: true, description: "Sequential quote number (sortable)"}
        subject: {type: string, maxLength: 255, description: "Quote subject (sortable)"}
        description: {type: string, maxLength: 2000, description: "Quote description"}
        moduleState: {type: string, description: "Status — pass `status` value (e.g. 'Draft', 'Sent') or numeric ID. Use `GET /picklist/quote/moduleState` for valid values."}
        customerType: {type: string, enum: [Vendor, Client, Tenant], description: "Customer type"}
        vendor: {type: integer, description: "Vendor ID"}
        client: {type: integer, description: "Client ID"}
        tenant: {type: integer, description: "Tenant ID"}
        contact: {type: integer, description: "Contact ID"}
        billToAddress: {description: "Billing address", allOf: [{$ref: '#/components/schemas/Address'}]}
        shipToAddress: {description: "Shipping address", allOf: [{$ref: '#/components/schemas/Address'}]}
        billDate: {type: string, format: date-time, description: "Bill date (sortable)"}
        expiryDate: {type: string, format: date-time, description: "Expiry date (sortable)"}
        siteId: {type: integer, description: "Site ID"}
        subTotal: {type: number, format: double, readOnly: true, description: "Subtotal before tax"}
        totalCost: {type: number, format: double, readOnly: true, description: "Total cost including tax"}
        totalTaxAmount: {type: number, format: double, readOnly: true, description: "Total tax amount"}
        revisionNumber: {type: integer, readOnly: true, description: "Revision number"}
        workorder: {type: integer, description: "Related work order ID"}
        notes: {type: string, maxLength: 2000, description: "Additional notes"}
        lineItems:
          type: array
          description: "Line items. `type` values: Item Type, Tool Type, Service, Labour, Others."
          items: {$ref: '#/components/schemas/QuoteLineItem'}
        sysCreatedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    QuoteLineItem:
      type: object
      description: "Quote line item."
      properties:
        id: {type: integer, readOnly: true, description: "Line item ID. Include on PATCH to update; omit to create new."}
        type: {type: string, enum: [Item Type, Tool Type, Service, Labour, Others], description: "Line item type"}
        description: {type: string, maxLength: 2000, description: "Line item description"}
        quantity: {type: number, format: double, description: "Quantity"}
        unitPrice: {type: number, format: double, description: "Unit price"}
        cost: {type: number, format: double, description: "Total cost (quantity x unitPrice)"}
        taxAmount: {type: number, format: double, description: "Tax amount"}
        unitOfMeasure: {type: string, maxLength: 255, description: "Unit of measure"}
        itemType: {type: object, description: "{id} — required when type is Item Type"}
        toolType: {type: object, description: "{id} — required when type is Tool Type"}
        service: {type: object, description: "{id} — required when type is Service"}
        labour: {type: object, description: "{id} — required when type is Labour"}
        tax: {type: object, description: "{id} — tax group reference"}

    # ── Invoice ──

    Invoice:
      type: object
      description: "Invoice with line items."
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        localId: {type: integer, readOnly: true, description: "Sequential number (sortable)"}
        invoiceNumber: {type: string, readOnly: true, description: "Invoice number (sortable)"}
        subject: {type: string, maxLength: 255, description: "Invoice subject"}
        description: {type: string, maxLength: 2000, description: "Invoice description"}
        notes: {type: string, maxLength: 2000, description: "Additional notes"}
        quote: {type: integer, description: "Source quote ID"}
        vendor: {type: integer, description: "Vendor ID"}
        client: {type: integer, description: "Client ID"}
        tenant: {type: integer, description: "Tenant ID"}
        workorder: {type: integer, description: "Related work order ID"}
        approvers: {type: array, items: {type: object}, readOnly: true, description: "Approver list"}
        billToAddress: {description: "Billing address", allOf: [{$ref: '#/components/schemas/Address'}]}
        shipToAddress: {description: "Shipping address", allOf: [{$ref: '#/components/schemas/Address'}]}
        billDate: {type: string, format: date, description: "Bill date (sortable)"}
        expiryDate: {type: string, format: date, description: "Expiry date (sortable)"}
        subTotal: {type: number, format: double, readOnly: true, description: "Subtotal before tax"}
        totalCost: {type: number, format: double, readOnly: true, description: "Total cost including tax"}
        totalTaxAmount: {type: number, format: double, readOnly: true, description: "Total tax amount"}
        invoiceType: {type: string, enum: [Vendor, Client, Tenant], description: "Invoice type"}
        invoiceStatus: {type: string, description: "Invoice status — pass display name (e.g. 'Draft', 'Invoice Delivered') or numeric ID. Use `GET /picklist/invoice/invoiceStatus` for valid values."}
        revisionNumber: {type: integer, readOnly: true, description: "Revision number"}
        invoiceVersion: {type: number, readOnly: true, description: "Version number"}
        lineItems:
          type: array
          description: "Line items. `type` values: Item Type, Tool Type, Service, Labour, Others."
          items: {$ref: '#/components/schemas/InvoiceLineItem'}
        sysCreatedByPeople: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedByPeople: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    InvoiceLineItem:
      type: object
      description: "Invoice line item."
      properties:
        id: {type: integer, readOnly: true, description: "Line item ID. Include on PATCH to update; omit to create new."}
        type: {type: string, enum: [Item Type, Tool Type, Service, Labour, Others], description: "Line item type"}
        description: {type: string, maxLength: 2000, description: "Line item description"}
        quantity: {type: number, format: double, description: "Quantity"}
        unitPrice: {type: number, format: double, description: "Unit price"}
        cost: {type: number, format: double, description: "Total cost (quantity x unitPrice)"}
        taxAmount: {type: number, format: double, description: "Tax amount"}
        unitOfMeasure: {type: string, maxLength: 255, description: "Unit of measure"}
        itemType: {type: object, description: "{id} — required when type is Item Type"}
        toolType: {type: object, description: "{id} — required when type is Tool Type"}
        service: {type: object, description: "{id} — required when type is Service"}
        labour: {type: object, description: "{id} — required when type is Labour"}
        tax: {type: object, description: "{id} — tax group reference"}

    # ── Purchase Request ──

    PurchaseRequest:
      type: object
      description: "Purchase request with line items."
      required: [name]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        localId: {type: integer, readOnly: true, description: "Sequential number (sortable)"}
        name: {type: string, maxLength: 255, description: "PR name (required, sortable)"}
        description: {type: string, maxLength: 2000, description: "Description"}
        moduleState: {type: string, description: "Status — pass `status` value (e.g. 'Draft', 'Approved') or numeric ID. Use `GET /picklist/purchaserequest/moduleState` for valid values."}
        vendor: {type: integer, description: "Vendor ID"}
        storeRoom: {type: integer, description: "Storeroom ID"}
        requestedBy: {type: integer, description: "Requester user ID"}
        requestedTime: {type: string, format: date, description: "Request date (sortable)"}
        requiredTime: {type: string, format: date, description: "Required by date (sortable)"}
        subTotal: {type: number, format: double, readOnly: true, description: "Subtotal before tax"}
        totalCost: {type: number, format: double, readOnly: true, description: "Total cost including tax"}
        totalTaxAmount: {type: number, format: double, readOnly: true, description: "Total tax amount"}
        isPoCreated: {type: boolean, readOnly: true, description: "Whether a PO has been created"}
        lineItems:
          type: array
          description: "Line items. `inventoryType` values: Item, Tool, Service, Others."
          items: {$ref: '#/components/schemas/PurchaseRequestLineItem'}
        sysCreatedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    PurchaseRequestLineItem:
      type: object
      description: "Purchase request line item."
      properties:
        id: {type: integer, readOnly: true, description: "Line item ID. Include on PATCH to update; omit to create new."}
        inventoryType: {type: string, enum: [Item, Tool, Service, Others], description: "Inventory type"}
        description: {type: string, maxLength: 2000, description: "Line item description"}
        quantity: {type: number, format: double, description: "Quantity"}
        unitPrice: {type: number, format: double, description: "Unit price"}
        cost: {type: number, format: double, description: "Total cost (quantity x unitPrice)"}
        taxAmount: {type: number, format: double, description: "Tax amount"}
        unitOfMeasure: {type: string, maxLength: 255, description: "Unit of measure"}
        itemType: {type: object, description: "{id} — required when inventoryType is Item"}
        toolType: {type: object, description: "{id} — required when inventoryType is Tool"}
        service: {type: object, description: "{id} — required when inventoryType is Service"}
        tax: {type: object, description: "{id} — tax group reference"}

    # ── Receivable / stocking / adjustments (V5) ──

    Receipt:
      type: object
      description: |
        Receipt line for `POST /receivable/{id}/addreceipt` (sent inside request `data`).
        Responses include read-only fields such as `id`, `receivableId`, `status`, and `receiptTime`.
      required: [lineItem, quantity]
      properties:
        lineItem:
          description: "Purchase order line item id — pass the number directly (object with `id` is also accepted)."
        quantity: {type: number, format: double, minimum: 0}
        bin: {description: "Optional bin id or name object for receipt routing"}
        remarks: {type: string}
        noOfSerialNumbers:
          type: integer
          minimum: 0
          description: "Optional. Use only when the PO line requires serial capture; omit for standard lines."

    POLineItemStock:
      type: object
      description: One line in `POST /receivable/{id}/stock` (`lineItems` or `lineItemsStockQuantity`). Pass line, receipt, and lot as numeric ids where possible; use a string or id/name object for bin.
      properties:
        lineItem: {description: "Purchase order line id — numeric, or object with `id`."}
        quantity: {type: number, format: double}
        receipt: {description: "Receipt record id — numeric, or object with `id`."}
        bin: {description: "Storeroom bin — bin name as a string, or object with `id` and/or `name`."}
        lot: {description: "Lot id when the line is lot-tracked — numeric, or object with `id`."}
        stockedBy: {type: object, description: "Optional user reference, e.g. object with `id`."}

    ItemAdjustment:
      type: object
      required: [adjustmentType, quantity, itemType, storeRoom]
      properties:
        adjustmentType: {type: string, description: "`increase` or `decrease` (case-insensitive)"}
        quantity: {type: number, format: double, exclusiveMinimum: 0}
        itemType: {description: "Item type id — pass the number directly (object with `id` is also accepted)."}
        storeRoom: {description: "Storeroom id — pass the number directly (object with `id` is also accepted)."}
        bin: {description: "Optional bin — pass the bin name as a string, the bin id as a number, or an object with `id` or `name`."}
        unitCost: {type: number, format: double, description: "Increase only — purchased item unit cost"}
        unitPrice: {type: number, format: double, description: "Alias of `unitCost` on increase"}
        purchasedDate: {description: "Epoch ms (number) or ISO date string — `costDate` on purchased item (increase)"}
        remarks: {type: string}

    ToolAdjustment:
      type: object
      required: [adjustmentType, quantity, toolType, storeRoom]
      properties:
        adjustmentType: {type: string, description: "`increase` or `decrease`"}
        quantity: {type: number, format: double, exclusiveMinimum: 0}
        toolType: {description: "Tool type id — pass the number directly (object with `id` is also accepted)."}
        storeRoom: {description: "Storeroom id — pass the number directly (object with `id` is also accepted)."}
        bin: {description: "Optional bin — bin name as a string, bin id as a number, or an object with `id` or `name`."}
        unitPrice: {type: number, format: double, description: "Increase only — purchased tool unit price"}
        purchasedDate: {description: "Epoch ms or ISO string for purchasedTool costDate on increase"}
        remarks: {type: string}

    # ── Purchase Order ──

    PurchaseOrder:
      type: object
      description: "Purchase order with line items."
      required: [name]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        localId: {type: integer, readOnly: true, description: "Sequential number (sortable)"}
        name: {type: string, maxLength: 255, description: "PO name (required, sortable)"}
        description: {type: string, maxLength: 2000, description: "Description"}
        moduleState: {type: string, description: "Status — pass `status` value (e.g. 'Draft', 'Approved') or numeric ID. Use `GET /picklist/purchaseorder/moduleState` for valid values."}
        vendor: {type: integer, description: "Vendor ID"}
        storeRoom: {type: integer, description: "Storeroom ID"}
        requestedBy: {type: integer, description: "Requester user ID"}
        orderedTime: {type: string, format: date, description: "Order date (sortable)"}
        requiredTime: {type: string, format: date, description: "Required by date (sortable)"}
        completedTime: {type: string, format: date, description: "Completion date"}
        subTotal: {type: number, format: double, readOnly: true, description: "Subtotal before tax"}
        totalCost: {type: number, format: double, readOnly: true, description: "Total cost including tax"}
        totalTaxAmount: {type: number, format: double, readOnly: true, description: "Total tax amount"}
        totalQuantity: {type: number, format: double, readOnly: true, description: "Total ordered quantity"}
        quantityReceived: {type: number, format: double, readOnly: true, description: "Total received quantity"}
        receivableStatus: {type: string, readOnly: true, description: "Receiving status (e.g. Yet To Receive, Partially Received)"}
        lineItems:
          type: array
          description: "Line items. `inventoryType` values: Item, Tool, Service, Others."
          items: {$ref: '#/components/schemas/PurchaseOrderLineItem'}
        sysCreatedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    PurchaseOrderLineItem:
      type: object
      description: "Purchase order line item."
      properties:
        id: {type: integer, readOnly: true, description: "Line item ID. Include on PATCH to update; omit to create new."}
