  # ── Work Order Attachments ──

  /workorder/{id}/attachments:
    get:
      tags: [Work Order Attachments]
      summary: List work order attachments
      description: Returns all file attachments for the specified work order.
      operationId: listWorkOrderAttachments
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: List of attachments
          content:
            application/json:
              example:
                success: true
                data:
                  - id: 101
                    fileName: "photo.jpg"
                    fileSize: 204800
                    contentType: "image/jpeg"
                    createdTime: "2026-02-12T17:00:00Z"
                    createdBy: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
                  - id: 102
                    fileName: "report.pdf"
                    fileSize: 1048576
                    contentType: "application/pdf"
                    externalId: "ext-att-001"
                    createdTime: "2026-02-13T09:00:00Z"
                    createdBy: {id: 5, name: "John Smith", email: "john@facilio.com"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Work Order Attachments]
      summary: Add work order attachment
      description: Uploads a file attachment to the specified work order. Use multipart/form-data.
      operationId: addWorkOrderAttachment
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                attachment:
                  type: string
                  format: binary
