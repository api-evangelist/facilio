                  - {id: 2, status: "Approved", displayName: "Approved"}
                  - {id: 3, status: "Ordered", displayName: "Ordered"}
                  - {id: 4, status: "Rejected", displayName: "Rejected"}
              schema:
                $ref: '#/components/schemas/CustomPicklistValues'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /picklist/purchaseorder/moduleState:
    get:
      tags: [Picklists]
      summary: Purchase order statuses
      description: Returns all available status values for purchase orders.
      operationId: getPurchaseOrderStatuses
      parameters: [{$ref: '#/components/parameters/picklistSearch'}]
      responses:
        '200':
          description: List of status values
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 1, status: "Requested", displayName: "Requested"}
                  - {id: 2, status: "Approved", displayName: "Approved"}
                  - {id: 3, status: "Received", displayName: "Received"}
                  - {id: 4, status: "Rejected", displayName: "Rejected"}
              schema:
                $ref: '#/components/schemas/CustomPicklistValues'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /picklist/inventoryrequest/moduleState:
    get:
      tags: [Picklists]
      summary: Inventory request statuses
      description: Returns all available status values for inventory requests.
      operationId: getInventoryRequestStatuses
      parameters: [{$ref: '#/components/parameters/picklistSearch'}]
      responses:
        '200':
          description: List of status values
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 1, status: "pending", displayName: "Pending"}
                  - {id: 2, status: "fullyreserved", displayName: "Fully Reserved"}
                  - {id: 3, status: "partiallyreserved", displayName: "Partially Reserved"}
                  - {id: 4, status: "issued", displayName: "Issued"}
              schema:
                $ref: '#/components/schemas/CustomPicklistValues'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /picklist/vendorCredit/vendorCreditNoteStatus:
    get:
      tags: [Picklists]
      summary: Vendor credit statuses
      description: Returns all available status values for vendor credits.
      operationId: getVendorCreditStatuses
      parameters: [{$ref: '#/components/parameters/picklistSearch'}]
      responses:
        '200':
          description: List of status values
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 1, value: "Awaiting Refund", displayName: "Awaiting Refund"}
                  - {id: 2, value: "Refunded", displayName: "Refunded"}
                  - {id: 3, value: "Credit Note Revised", displayName: "Credit Note Revised"}
              schema:
                $ref: '#/components/schemas/CustomPicklistValues'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /picklist/clientCredit/clientCreditNoteStatus:
    get:
      tags: [Picklists]
      summary: Client credit statuses
      description: Returns all available status values for client credits.
      operationId: getClientCreditStatuses
      parameters: [{$ref: '#/components/parameters/picklistSearch'}]
      responses:
        '200':
          description: List of status values
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 1, value: "Awaiting Refund", displayName: "Awaiting Refund"}
                  - {id: 2, value: "Refunded", displayName: "Refunded"}
                  - {id: 3, value: "Credit Note Revised", displayName: "Credit Note Revised"}
              schema:
                $ref: '#/components/schemas/CustomPicklistValues'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /picklist/{moduleName}/{fieldName}:
    get:
      tags: [Picklists]
      summary: Get picklist values for a custom field
      description: |
        Returns picklist values for custom enum or system picklist fields.
        Only enum-type and system picklist lookup fields are supported.
        For regular lookup fields (site, building, asset), use the module's list API instead.
      operationId: getCustomPicklistValues
      parameters:
        - name: moduleName
          in: path
          required: true
          description: Module name (e.g. `workorder`, `asset`)
          schema: {type: string}
        - name: fieldName
          in: path
          required: true
          description: Field name (e.g. `urgency`, `warranty_type_asset`)
          schema: {type: string}
        - $ref: '#/components/parameters/picklistSearch'
      responses:
        '200':
          description: List of picklist values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomPicklistValues'
              example:
                success: true
                data:
                  - {id: 1, displayName: "Option A"}
                  - {id: 2, displayName: "Option B"}
        '401':
          $ref: '#/components/responses/Unauthorized'

# ══════════════════════════════════════════════════════════════════
# Components
# ══════════════════════════════════════════════════════════════════

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Personal access token
    oauth2:
      type: oauth2
      description: "Supports authorization_code and password grant types"
      flows:
        authorizationCode:
          authorizationUrl: https://us.facilioapis.com/identity/oauth2/authorize
          tokenUrl: https://us.facilioapis.com/identity/oauth2/token
          refreshUrl: https://us.facilioapis.com/identity/oauth2/token
          scopes: {}
        password:
          tokenUrl: https://us.facilioapis.com/identity/oauth2/token
          refreshUrl: https://us.facilioapis.com/identity/oauth2/token
          scopes: {}

  responses:
    BadRequest:
      description: "Validation error — missing required fields, invalid field values, or malformed request body"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {success: false, error: {code: "VALIDATION_ERROR", message: "Required field(s) missing: name"}}
    Unauthorized:
      description: "Missing or invalid authentication credentials"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {success: false, error: {code: "UNAUTHORIZED", message: "Missing or invalid authentication credentials"}}
    NotFound:
      description: "Record or module not found"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {success: false, error: {code: "RECORD_NOT_FOUND", message: "Record with the given ID was not found"}}

  parameters:
    recordId:
      name: id
      in: path
      required: true
      description: Record ID
      schema: {type: integer, format: int64}
    attachmentId:
      name: attachmentId
      in: path
      required: true
      description: Attachment ID
      schema: {type: integer, format: int64}
    commentId:
      name: commentId
      in: path
      required: true
      description: Comment ID
      schema: {type: integer, format: int64}
    page:
      name: page
      in: query
      description: Page number (1-based)
      schema: {type: integer, default: 1}
    pageSize:
      name: pageSize
      in: query
      description: Records per page (max 200)
      schema: {type: integer, default: 50, maximum: 200}
    select:
      name: select
      in: query
      description: Comma-separated field names to include in the response
      schema: {type: string}
    expand:
      name: expand
      in: query
      description: |
        Comma-separated lookup field names to expand on **list** endpoints (max 5).
        Expanded objects follow the same rules as single-record GET (see **Lookup fields in responses** in the API overview).
      schema: {type: string}
    search:
      name: search
      in: query
      description: Free-text search on the primary field (subject, name, etc.)
      schema: {type: string}
    count:
      name: count
      in: query
      description: Include total record count in response
      schema: {type: boolean, default: false}
    view:
      name: view
      in: query
      description: Saved view name
      schema: {type: string}
    changed:
      name: changed
      in: query
      description: "Delta sync: returns records created/modified after this UTC timestamp"
      schema: {type: string, format: date-time}
    picklistSearch:
      name: search
      in: query
      description: Filter picklist values by name
      schema: {type: string}
    includeAllowedValues:
      name: includeAllowedValues
      in: query
      description: |
        When `true`, the metadata response adds `allowed_values` ([{label, value}]) on every picklist-capable field — `ENUM`, `SYSTEM_ENUM`, `MULTI_ENUM`, `STRING_SYSTEM_ENUM`, and `LOOKUP` fields targeting system picklist modules (status, priority, category, type, ...).
        Default `false` keeps the original metadata payload (no enrichment, no extra DB calls).
        Use this to discover acceptable write values without round-tripping `GET /picklist/{moduleName}/{fieldName}` for every picklist field.
      schema: {type: boolean, default: false}

  schemas:
    ListResponse:
      type: object
      properties:
        success: {type: boolean}
        data: {type: array, items: {type: object}}
        pagination:
          type: object
          properties:
            page: {type: integer}
            pageSize: {type: integer}
        count: {type: integer, description: "Total count (only when ?count=true)"}

    SingleResponse:
      type: object
      properties:
        success: {type: boolean}
        data: {type: object}
        message: {type: string}

    Error:
      type: object
      description: "Error response"
      properties:
        success: {type: boolean, example: false}
        error:
          type: object
          properties:
            code: {type: string, description: "Machine-readable error code"}
            message: {type: string, description: "Human-readable error message"}

    # ── Picklist Schemas (one per system picklist) ──

    WorkOrderStatus:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              status: {type: string, description: "Status value (e.g. Submitted, Closed)"}
              displayName: {type: string}

    ServiceRequestStatus:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              status: {type: string, description: "Status value"}
              displayName: {type: string}

    Priority:
      type: object
      description: "Used for work order priority and service request urgency"
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              priority: {type: string, description: "Priority value (e.g. High, Medium, Low)"}
              displayName: {type: string}
              colour: {type: string, description: "Hex color code (e.g. #f00)"}
              sequenceNumber: {type: integer, description: "Sort order"}

    WorkOrderCategory:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string, description: "Category name"}
              displayName: {type: string}

    WorkOrderType:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string, description: "Type name"}
              displayName: {type: string}

    AssetCategory:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string, description: "Category name (e.g. HVAC, Electrical)"}
              displayName: {type: string}

    AssetType:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string, description: "Type name"}
              displayName: {type: string}

    AssetDepartment:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string, description: "Department name"}

    SpaceCategory:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string, description: "Category name (e.g. Office, Conference Room)"}
              displayName: {type: string}

    CustomPicklistValues:
      type: object
      description: "moduleState picklist values — returns {id, status, displayName} for each state"
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              status: {type: string, description: "Status value"}
              displayName: {type: string}

    EnumPicklistValues:
      type: object
      description: "Enum picklist values — returns {id, displayName} for each value"
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              displayName: {type: string}

    # ── Schema Discovery ──

    FacilioModule:
      type: object
      description: "A single entry in the module catalogue returned by GET /modules."
      properties:
        name:
          type: string
          description: "Module name used in all API paths (e.g. `workorder`, `custom_employees`)"
        displayName:
          type: string
          description: "Human-readable module label (e.g. `Work Orders`, `Employees`)"
        description:
          type: string
          description: "Module description as configured in Facilio Setup. Omitted when blank."
        isCustom:
          type: boolean
          description: "`true` for modules created by your organization; `false` for standard Facilio modules"

    FacilioField:
      type: object
      description: "Schema descriptor for a single field within a module."
      properties:
        name:
          type: string
          description: "Field name used in API requests and responses (e.g. `subject`, `po_reference_workorder`)"
        displayName:
          type: string
          description: "Human-readable field label"
        dataType:
          type: string
          description: |
            Field data type. Common values:
            `STRING`, `NUMBER`, `DECIMAL`, `BOOLEAN`,
            `DATE`, `DATE_TIME`,
            `BIG_STRING` (large text, excluded from list responses),
            `LOOKUP` (reference to another record — see `lookupModuleName`),
            `MULTI_LOOKUP` (multi-reference — see `lookupModuleName`),
            `ENUM`, `SYSTEM_ENUM`, `STRING_SYSTEM_ENUM` (picklist types)
          example: STRING
        required:
          type: boolean
          description: "`true` if this field must be provided on record creation"
        readOnly:
          type: boolean
          description: "`true` if this field cannot be set or modified via the API (e.g. auto-generated system fields)"
        isCustom:
          type: boolean
          description: "`true` for fields added by your organization; `false` for standard built-in fields"
        sortable:
          type: boolean
          description: "`true` if this field can be used as a `sortBy` value on the list API"
        lookupModuleName:
          type: string
          description: "Present only on `LOOKUP` and `MULTI_LOOKUP` fields. The name of the target module (e.g. `site`, `users`, `ticketstatus`)."
        max_length:
          type: integer
          description: |
            Maximum number of characters accepted by the V5 write API for text-style fields.
            Present only when the field's `dataType` is one of:
            `STRING` (255), `LARGE_TEXT` (2000), `BIG_STRING` (32000).
            Omitted for all other data types.
          example: 255
        allowed_values:
          type: array
          description: |
            List of acceptable write values for picklist-capable fields. Present **only when the request includes `?includeAllowedValues=true`** AND the field is one of:
            `ENUM`, `SYSTEM_ENUM`, `MULTI_ENUM`, `STRING_SYSTEM_ENUM`, or a `LOOKUP` targeting a system picklist module (e.g. `ticketstatus`, `ticketpriority`, `ticketcategory`, `tickettype`).
            Each entry uses `{label, value}`; the `value` is the canonical form accepted by create/update payloads.
          items:
            type: object
            properties:
              label:
                type: string
                description: "Display label as shown in the UI"
              value:
                type: string
                description: "Canonical value accepted by create/update for this field and filtering"

    ModuleMetaResponse:
      type: object
      description: "Response body for GET /{moduleName}/metadata."
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            module:
              $ref: '#/components/schemas/FacilioModule'
            fields:
              type: array
              description: |
                Ordered list of fields for the module.
                Standard Facilio modules return built-in fields first, followed by any fields your organization added.
                Custom modules return all fields.
              items:
                $ref: '#/components/schemas/FacilioField'

    User:
      type: object
      description: |
        Expanded object for lookups to the `users` module.
        On list API, user lookups return `{id}` only unless `?expand=` includes that field.
        When expanded (single-record GET, create/update responses, or list with `expand`): fixed set `id`, `name`, `email`, `phone` (see **Lookup fields in responses**).
      properties:
        id: {type: integer, format: int64, description: "User ID"}
        name: {type: string, description: "User's full name"}
        email: {type: string, description: "User's email address"}
        phone: {type: string, description: "Phone number when present"}

    Address:
      type: object
      description: "Postal address. Used for site/building locations, storeroom locations, vendor/client/tenant addresses, and quote/invoice billing & shipping addresses."
      properties:
        id: {type: integer, readOnly: true, description: "Address record ID"}
        name: {type: string, maxLength: 255, description: "Location name"}
        street: {type: string, maxLength: 255, description: "Street address"}
        city: {type: string, maxLength: 100, description: "City"}
        state: {type: string, maxLength: 100, description: "State or province"}
        zip: {type: string, maxLength: 20, description: "Postal / ZIP code"}
        country: {type: string, maxLength: 100, description: "Country code (e.g. IN, US)"}
        lat: {type: number, format: double, description: "Latitude"}
        lng: {type: number, format: double, description: "Longitude"}

    Profile:
      type: object
      properties:
        user:
          type: object
          properties:
            id: {type: integer}
            name: {type: string}
            email: {type: string}
            timezone: {type: string}
            role:
              type: object
              properties:
                id: {type: integer}
                name: {type: string}
        org:
          type: object
          properties:
            id: {type: integer}
            name: {type: string}
            domain: {type: string}

    # ── Work Order ──

    WorkOrder:
      type: object
      description: "Work order. Custom fields: `{field_name}_workorder`. On create, `subject` and `siteId` are required. On update, only include fields you want to change. Picklist fields accept display name strings or IDs."
      required: [subject, siteId]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        serialNumber: {type: integer, readOnly: true, description: "Auto-generated sequential number"}
        subject: {type: string, description: "Work order title (required on create, sortable)"}
        description: {type: string, description: "Detailed description of the work"}
        status: {type: string, description: "Status — pass `status` value (e.g. 'Submitted', 'Work in Progress') or numeric ID. Use `GET /picklist/workorder/status` for valid values."}
        priority: {type: string, description: "Priority level — picklist value (e.g. 'High', 'Medium', 'Low') or ID"}
        category: {type: string, description: "Work category — picklist value (e.g. 'Energy', 'HVAC') or ID"}
        type: {type: string, description: "Work type — picklist value (e.g. 'Corrective', 'Preventive') or ID"}
        sourceType: {type: string, readOnly: true, description: "How the work order was created (e.g. Web Work Order, Alarm)"}
        resource: {type: integer, description: "Associated asset or space ID. Returns {id, name} on GET."}
        siteId: {type: integer, description: "Site where the work order is raised — represents a building, campus, or facility in your portfolio (required on create)"}
        assignedTo: {type: integer, description: "Assigned staff user ID. Expanded per `users` module when returned on GET/create/update (see User schema)."}
        assignmentGroup: {type: integer, description: "Assigned team ID"}
        vendor: {type: integer, description: "Vendor ID"}
        client: {type: integer, description: "Client ID"}
        tenant: {type: integer, description: "Tenant ID"}
        requestedBy: {type: integer, description: "Requester user ID"}
        actualWorkDuration: {type: number, description: "Actual work duration in hours (sortable)"}
        actualWorkStart: {type: string, format: date-time, description: "When work actually started (sortable)"}
        actualWorkEnd: {type: string, format: date-time, description: "When work actually ended (sortable)"}
        estimatedWorkDuration: {type: number, description: "Estimated work duration in hours (sortable)"}
        scheduledStart: {type: string, format: date-time, description: "Scheduled start time (sortable)"}
        estimatedEnd: {type: string, format: date-time, description: "Estimated end time (sortable)"}
        responseDueDate: {type: string, format: date-time, description: "Response SLA due date (sortable)"}
        dueDate: {type: string, format: date-time, description: "Work order due date (sortable)"}
        highRisk: {type: boolean, description: "Whether flagged as high risk"}
        noOfAttachments: {type: integer, readOnly: true, description: "Number of file attachments (sortable)"}
        noOfClosedTasks: {type: integer, readOnly: true, description: "Number of completed tasks (sortable)"}
        noOfNotes: {type: integer, readOnly: true, description: "Number of comments (sortable)"}
        noOfTasks: {type: integer, readOnly: true, description: "Total number of tasks (sortable)"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Record creation timestamp (sortable)"}
        createdBy: {readOnly: true, description: "User who created the record", allOf: [{$ref: '#/components/schemas/User'}]}
        modifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modification timestamp (sortable)"}
        modifiedBy: {readOnly: true, description: "User who last modified", allOf: [{$ref: '#/components/schemas/User'}]}
      additionalProperties:
        description: "Custom fields (e.g. po_reference_workorder)"

    # ── Service Request ──

    ServiceRequest:
      type: object
      description: "Service request. Custom fields: `{field_name}_serviceRequest`. On create, `subject` and `site` are required. Send `site` in the body (not `siteId`); responses may still show site under `siteId`."
      required: [subject, site]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        subject: {type: string, description: "Request title (required on create, sortable)"}
        description: {type: string, description: "Detailed description"}
        moduleState: {type: string, description: "Status — pass `status` value (e.g. 'Submitted', 'Assigned') or numeric ID. Use `GET /picklist/servicerequest/moduleState` for valid values."}
        requester: {type: integer, description: "Requester user ID. Expanded per `users` when returned on GET/create/update."}
        urgency: {type: string, description: "Urgency level — display name or ID"}
        site: {description: "Site for this request (required on create). Pass the site id as a number, or an object with `id`."}
        siteId: {readOnly: true, description: "In responses the site is often serialized under this key (lookup expansion). Do not use for create/update; send `site` instead."}
        resource: {type: integer, description: "Asset or space ID"}
        assignedTo: {type: integer, description: "Assigned user ID"}
        assignmentGroup: {type: integer, description: "Assigned team ID"}
        dueDate: {type: string, format: date-time, description: "Due date (sortable)"}
        responseDueDate: {type: string, format: date-time, readOnly: true, description: "Response SLA due date (sortable)"}
        reportedDate: {type: string, format: date-time, description: "Date reported (sortable)"}
        actualStartDate: {type: string, format: date-time, description: "Actual start date (sortable)"}
        actualFinishDate: {type: string, format: date-time, description: "Actual finish date (sortable)"}
        sourceType: {type: string, readOnly: true, description: "How the request was created"}
        requestType: {type: string, description: "Request type"}
        mode: {type: string, description: "Request mode"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysCreatedBy: {readOnly: true, description: "Created by", allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified timestamp (sortable)"}
        sysModifiedBy: {readOnly: true, description: "Modified by", allOf: [{$ref: '#/components/schemas/User'}]}
      additionalProperties:
        description: "Custom fields"

    # ── Asset ──

    Asset:
      type: object
      description: "Asset. Custom fields: `{field_name}_asset`."
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Asset name (sortable)"}
        description: {type: string, description: "Asset description"}
        serialNumber: {type: string, description: "Manufacturer serial number"}
        tagNumber: {type: string, description: "Internal tag number"}
        qrVal: {type: string, description: "QR code value"}
        category: {type: string, description: "Category — picklist value (e.g. 'HVAC') or ID"}
        type: {type: string, description: "Type — picklist value or ID"}
        siteId: {type: integer, description: "Site where the asset is located — represents a building, campus, or facility in your portfolio"}
        space: {type: integer, description: "Space ID where the asset is located"}
        moduleState: {type: string, description: "Status — pass `status` value (e.g. 'Active') or numeric ID. Use `GET /picklist/asset/moduleState` for valid values."}
