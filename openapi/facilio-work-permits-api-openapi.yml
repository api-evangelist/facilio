openapi: 3.2.0
info:
  title: Facilio REST Work Permits API
  version: 5.0.0
  description: 'The Facilio REST API gives you programmatic access to Facilio''s Connected CMMS — the unified platform for managing property operations at portfolio scale. Build integrations that connect Facilio with your ERP, accounting systems, BMS, IoT platforms, and other business tools. Automate work order creation from external triggers, synchronize asset data across systems, push tenant and vendor records from your CRM, or pull maintenance data into your reporting dashboards. **What you can do with this API:**

    - **Work Orders & Service Requests** — Create, assign, track, and close maintenance tasks programmatically

    - **Assets** — Manage your equipment registry, track asset lifecycle, and sync with external asset management systems

    - **Portfolio (Sites, Buildings, Floors, Spaces)** — Maintain your facility hierarchy and space data

    - **People (Tenants, Vendors, Clients)** — Synchronize contacts and stakeholder records

    - **Inventory (Item Types, Tool Types, Items & Tools, Services, Storerooms)** — Master data, per-storeroom item/tool balances (read), per-bin quantities by item or tool record, quantity adjustments, and warehouse locations

    - **Procurement (Quotes, Purchase Requests, Purchase Orders, Receivable receiving, Invoices)** — Procurement with line items; receive against a PO via receivable APIs

    - **Credit Notes (Vendor Credits, Client Credits)** — Manage credit notes for refunds and transaction adjustments with line items

    - **Inventory Requests** — Track material requisitions from work orders to storerooms

    - **Custom Modules** — Manage your organization''s custom modules — record types you define for the data and workflows that are specific to your business

    - **Schema Discovery** — List all accessible modules and inspect field schemas (name, type, required, readOnly, lookup target) via `GET /modules` and `GET /{moduleName}/metadata`

    - **Attachments & Comments** — Attach documents, photos, and notes to work orders and service requests

    - **Picklists** — Discover available values for status, priority, category, and other configurable fields


    The API follows REST conventions with JSON request/response bodies, standard HTTP methods (GET, POST, PATCH, DELETE), and consistent error handling across all endpoints. ## Base URL


    ```

    https://{region}.facilioapis.com/{app_name}/api/v5

    ```


    | Variable | Description | Values |

    |----------|-------------|--------|

    | `region` | Your deployment region | `us`, `au`, `ae`, `uk`, `us-azure`, `sa` |

    | `app_name` | `maintenance` for API Key auth, `developer` for OAuth2 auth | `maintenance`, `developer` |


    ## Authentication


    All API requests must be authenticated using one of the following methods:


    ### API Key (Personal Access Token)

    Generate an API key from your Facilio account settings and pass it in the `x-api-key` header. The key inherits the permissions of the user who created it. ```

    x-api-key: your-api-key-here

    ```


    ### OAuth2

    For developer app integrations. Supports **authorization_code** and **password** grant types. | Endpoint | URL |

    |----------|-----|

    | Authorize | `https://{region}.facilioapis.com/identity/oauth2/authorize` |

    | Token | `https://{region}.facilioapis.com/identity/oauth2/token` |

    | Refresh | `https://{region}.facilioapis.com/identity/oauth2/token` (with `grant_type=refresh_token`) |

    | Revoke | `https://{region}.facilioapis.com/identity/oauth2/revoke` |


    Pass the access token as:

    ```

    Authorization: Bearer oauth2

    ```


    ---


    ## List Operations


    All list endpoints (`GET /{module}`) support these query parameters:


    | Parameter | Type | Default | Description |

    |-----------|------|---------|-------------|

    | `page` | integer | 1 | Page number (1-based) |

    | `pageSize` | integer | 50 | Number of records per page. Maximum is 200. |

    | `select` | string | — | Comma-separated field names to include in the response. If omitted, module default fields are returned. |

    | `expand` | string | — | Comma-separated lookup field names to expand with full details (max 5).'
  contact:
    name: Facilio Support
    url: https://facilio.com
  license:
    name: Proprietary
servers:
- url: https://{region}.facilioapis.com/{app_name}/api/v5
  variables:
    region:
      description: Regional deployment
      default: us
      enum:
      - us
      - au
      - ae
      - uk
      - us-azure
      - sa
    app_name:
      description: '''maintenance'' for API Key, ''developer'' for OAuth2'
      default: maintenance
      enum:
      - maintenance
      - developer
security:
- apiKey: []
- oauth2: []
tags:
- name: Work Permits
  description: Work permits authorize and control high-risk work (hot work, confined space, working at height, and similar). A permit is raised against a permit type, auto-populated with a safety checklist, and advanced through a pre/post-requisite validation lifecycle before and after the work is carried out.
paths:
  /workpermit:
    get:
      tags:
      - Work Permits
      summary: List work permits
      description: 'Returns a paginated list of work permits. Supports filtering, sorting, field selection, and saved views.

        By default returns module-configured fields; use `?select=` to customize. Custom fields can be included

        via `?select=name,{field_name}_workpermit`.'
      operationId: listWorkPermits
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/select'
      - $ref: '#/components/parameters/expand'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/count'
      - $ref: '#/components/parameters/view'
      - $ref: '#/components/parameters/changed'
      - name: sortBy
        in: query
        description: Field to sort by (only sortable fields accepted)
        schema:
          type: string
          enum:
          - id
          - localId
          - name
          - expectedStartTime
          - expectedEndTime
          - sysCreatedTime
          - sysModifiedTime
      - name: sortOrder
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Paginated list of work permits
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/WorkPermit'
              example:
                success: true
                data:
                - id: 300
                  localId: 12
                  name: Hot Work - Roof Plant Room
                  permitStatus: Pre Requisites Filled
                  workPermitType: Hot Work
                  moduleState: Open
                  expectedStartTime: '2026-03-02T08:00:00Z'
                  expectedEndTime: '2026-03-02T17:00:00Z'
                  siteId:
                    id: 10
                    name: Headquarters
                  isRecurring: false
                  noOfAttachments: 1
                  sysCreatedTime: '2026-03-01T09:00:00Z'
                  sysCreatedBy:
                    id: 1
                    name: Alex Johnson
                    email: alex.johnson@example.com
                pagination:
                  page: 1
                  pageSize: 50
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Work Permits
      summary: Create a work permit
      description: 'Creates a new work permit. Requires `name`, `expectedEndTime`, and `siteId`.

        On create the permit''s checklist items are auto-populated from the selected `workPermitType`''s

        templates (split into pre-requisite and post-requisite phases). The lifecycle fields

        (`permitStatus`, `isPreValidationDone`, `isPostValidationDone`) are read-only here and advance

        only through the lifecycle actions below.'
      operationId: createWorkPermit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: '#/components/schemas/WorkPermit'
            example:
              data:
                name: Hot Work - Roof Plant Room
                workPermitType: Hot Work
                expectedStartTime: '2026-03-02T08:00:00Z'
                expectedEndTime: '2026-03-02T17:00:00Z'
                siteId: 10
                vendor: 45
                description: Welding on rooftop condenser bracket
      responses:
        '201':
          description: Work permit created successfully
          content:
            application/json:
              example:
                success: true
                data:
                  id: 301
                  localId: 13
                  name: Hot Work - Roof Plant Room
                  workPermitType: Hot Work
                  permitStatus: New
                  siteId:
                    id: 10
                    name: Headquarters
                  sysCreatedTime: '2026-03-01T10:00:00Z'
                  sysCreatedBy:
                    id: 1
                    name: Alex Johnson
                    email: alex.johnson@example.com
                message: Record created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workpermit/bulk:
    post:
      tags:
      - Work Permits
      summary: Bulk create work permits
      description: 'Creates multiple work permits in a single request. The `data` array holds one object per permit,

        each following the same shape as single create. Returns the created records in order.'
      operationId: bulkCreateWorkPermits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkPermit'
            example:
              data:
              - name: Confined Space - Tank 3
                workPermitType: Confined Space
                expectedEndTime: '2026-03-05T17:00:00Z'
                siteId: 10
              - name: Working at Height - Atrium
                workPermitType: Working at Height
                expectedEndTime: '2026-03-06T17:00:00Z'
                siteId: 10
      responses:
        '201':
          description: Work permits created
          content:
            application/json:
              example:
                success: true
                data:
                - id: 302
                  name: Confined Space - Tank 3
                  permitStatus: New
                - id: 303
                  name: Working at Height - Atrium
                  permitStatus: New
                message: Records created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workpermit/{id}:
    get:
      tags:
      - Work Permits
      summary: Get a work permit
      description: 'Returns a single work permit with all system fields, custom fields, and expanded lookup fields.

        The response also embeds a `checklist` object grouping the permit''s filled items into

        `preRequisites` and `postRequisites` (the same grouped view as `GET /workpermit/{id}/checklist`).'
      operationId: getWorkPermit
      parameters:
      - $ref: '#/components/parameters/recordId'
      - $ref: '#/components/parameters/select'
      - $ref: '#/components/parameters/expand'
      responses:
        '200':
          description: Work permit details
          content:
            application/json:
              example:
                success: true
                data:
                  id: 300
                  localId: 12
                  name: Hot Work - Roof Plant Room
                  description: Welding on rooftop condenser bracket
                  workPermitType: Hot Work
                  permitStatus: Pre Requisites Filled
                  isPreValidationDone: false
                  isPostValidationDone: false
                  moduleState: Open
                  expectedStartTime: '2026-03-02T08:00:00Z'
                  expectedEndTime: '2026-03-02T17:00:00Z'
                  siteId:
                    id: 10
                    name: Headquarters
                  vendor:
                    id: 45
                    name: Acme Contractors
                  isRecurring: false
                  noOfAttachments: 1
                  checklist:
                    preRequisites:
                    - id: 900
                      checklist: Fire extinguisher on site
                      required: true
                      isReviewed: false
                      remarks: 2 units staged
                    postRequisites:
                    - id: 905
                      checklist: Area inspected 60 min after work
                      required: true
                      isReviewed: false
                  sysCreatedTime: '2026-03-01T09:00:00Z'
                  sysCreatedBy:
                    id: 1
                    name: Alex Johnson
                    email: alex.johnson@example.com
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Work Permits
      summary: Update a work permit
      description: 'Updates an existing work permit. Only the fields included in the request body are updated.

        Lifecycle fields (`permitStatus`, `isPreValidationDone`, `isPostValidationDone`) are read-only

        here — use the lifecycle actions to advance them.'
      operationId: updateWorkPermit
      parameters:
      - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: '#/components/schemas/WorkPermit'
            example:
              data:
                description: Welding on rooftop condenser bracket (revised scope)
                expectedEndTime: '2026-03-02T19:00:00Z'
      responses:
        '200':
          description: Work permit updated successfully
          content:
            application/json:
              example:
                success: true
                data:
                  id: 300
                  name: Hot Work - Roof Plant Room
                  expectedEndTime: '2026-03-02T19:00:00Z'
                  sysModifiedTime: '2026-03-01T12:00:00Z'
                message: Record updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Work Permits
      summary: Delete a work permit
      description: Permanently deletes a work permit. This action cannot be undone.
      operationId: deleteWorkPermit
      parameters:
      - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Work permit deleted
          content:
            application/json:
              example:
                success: true
                message: Record deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workpermit/{id}/checklist:
    get:
      tags:
      - Work Permits
      summary: Get a work permit's checklist
      description: 'Returns the permit''s checklist items grouped into `preRequisites` and `postRequisites`.

        Lighter than fetching the full permit; the same grouped structure embedded on the single-record GET.'
      operationId: getWorkPermitChecklist
      parameters:
      - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Grouped checklist
          content:
            application/json:
              example:
                success: true
                data:
                  preRequisites:
                  - id: 900
                    checklist: Fire extinguisher on site
                    required: true
                    isReviewed: false
                    remarks: 2 units staged
                  - id: 901
                    checklist: Gas test completed
                    required: true
                    isReviewed: false
                  postRequisites:
                  - id: 905
                    checklist: Area inspected 60 min after work
                    required: true
                    isReviewed: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workpermit/{id}/submit-prerequisites:
    post:
      tags:
      - Work Permits
      summary: Submit pre-requisites
      description: 'Marks the permit''s pre-requisite checklist as filled and advances `permitStatus` to

        **Pre Requisites Filled**. Fill individual items via `PATCH /workpermitchecklist/{id}` first.'
      operationId: submitWorkPermitPreRequisites
      parameters:
      - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Pre-requisites submitted
          content:
            application/json:
              example:
                success: true
                data:
                  id: 300
                  permitStatus: Pre Requisites Filled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workpermit/{id}/review-prerequisites:
    post:
      tags:
      - Work Permits
      summary: Review pre-requisites
      description: Approves the filled pre-requisites, sets `isPreValidationDone` and advances `permitStatus` to **Pre Validation Done**.
      operationId: reviewWorkPermitPreRequisites
      parameters:
      - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Pre-requisites reviewed
          content:
            application/json:
              example:
                success: true
                data:
                  id: 300
                  permitStatus: Pre Validation Done
                  isPreValidationDone: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workpermit/{id}/submit-postrequisites:
    post:
      tags:
      - Work Permits
      summary: Submit post-requisites
      description: Marks the post-requisite checklist as filled and advances `permitStatus` to **Post Requisites Filled**.
      operationId: submitWorkPermitPostRequisites
      parameters:
      - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Post-requisites submitted
          content:
            application/json:
              example:
                success: true
                data:
                  id: 300
                  permitStatus: Post Requisites Filled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workpermit/{id}/review-postrequisites:
    post:
      tags:
      - Work Permits
      summary: Review post-requisites
      description: Approves the filled post-requisites, sets `isPostValidationDone` and advances `permitStatus` to **Post Validation Done**.
      operationId: reviewWorkPermitPostRequisites
      parameters:
      - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Post-requisites reviewed
          content:
            application/json:
              example:
                success: true
                data:
                  id: 300
                  permitStatus: Post Validation Done
                  isPostValidationDone: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workpermit/{id}/changestatus:
    post:
      tags:
      - Work Permits
      summary: Change work permit status
      description: Transitions the permit's `moduleState` to a new state via the module's configured state flow.
      operationId: changeWorkPermitStatus
      parameters:
      - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - status
                  properties:
                    status:
                      type: string
                      description: Target status name
            example:
              data:
                status: Closed
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              example:
                success: true
                data:
                  id: 300
                  moduleState: Closed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workpermit/{id}/activities:
    get:
      tags:
      - Work Permits
      summary: List work permit activities
      description: 'Returns the permit''s activity timeline (audit feed) — record creation, field changes, status

        changes, comments, and approvals — most recent first. Read-only.'
      operationId: listWorkPermitActivities
      parameters:
      - $ref: '#/components/parameters/recordId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/count'
      responses:
        '200':
          description: Activity timeline
          content:
            application/json:
              example:
                success: true
                data:
                - id: 5002
                  category: STATUS_CHANGE
                  summary: Status changed to Pre Requisites Filled
                  actor:
                    id: 5
                    name: John Smith
                    email: john@facilio.com
                  time: '2026-03-01T10:15:00Z'
                  status: Pre Requisites Filled
                - id: 5001
                  category: RECORD_CREATED
                  summary: Work Permit created
                  actor:
                    id: 1
                    name: Alex Johnson
                    email: alex.johnson@example.com
                  time: '2026-03-01T09:00:00Z'
                pagination:
                  page: 1
                  pageSize: 50
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    recordId:
      name: id
      in: path
      required: true
      description: Record ID
      schema:
        type: integer
        format: int64
    changed:
      name: changed
      in: query
      description: 'Delta sync: returns records created/modified after this UTC timestamp'
      schema:
        type: string
        format: date-time
    select:
      name: select
      in: query
      description: Comma-separated field names to include in the response
      schema:
        type: string
    view:
      name: view
      in: query
      description: Saved view name
      schema:
        type: string
    search:
      name: search
      in: query
      description: Free-text search on the primary field (subject, name, etc.)
      schema:
        type: string
    expand:
      name: expand
      in: query
      description: 'Comma-separated lookup field names to expand on **list** endpoints (max 5).

        Expanded objects follow the same rules as single-record GET (see **Lookup fields in responses** in the API overview).

        '
      schema:
        type: string
    page:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        default: 1
    count:
      name: count
      in: query
      description: Include total record count in response
      schema:
        type: boolean
        default: false
    pageSize:
      name: pageSize
      in: query
      description: Records per page (max 200)
      schema:
        type: integer
        default: 50
        maximum: 200
  responses:
    BadRequest:
      description: Validation error — missing required fields, invalid field values, or malformed request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: 'Required field(s) missing: name'
    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Missing or invalid authentication credentials
    NotFound:
      description: Record or module not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: RECORD_NOT_FOUND
              message: Record with the given ID was not found
  schemas:
    ListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
        count:
          type: integer
          description: Total count (only when ?count=true)
    WorkPermit:
      type: object
      description: 'Work permit. Custom fields: `{field_name}_workpermit`. On create, `name`, `expectedEndTime`, and `siteId` are required. Lifecycle fields (`permitStatus`, `isPreValidationDone`, `isPostValidationDone`) are read-only — advance them via the lifecycle actions. Lookup fields accept an ID (or `{id}`) on write and return `{id, name}` (users return `{id, name, email}`) on GET. Picklist fields accept a display value or an ID.'
      required:
      - name
      - expectedEndTime
      - siteId
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Unique record ID
        localId:
          type: integer
          readOnly: true
          description: Auto-generated per-permit sequential number (sortable)
        name:
          type: string
          description: Permit title (required on create, sortable)
        description:
          type: string
          description: Description of the work to be carried out
        expectedStartTime:
          type: string
          format: date-time
          description: Planned start time (sortable)
        expectedEndTime:
          type: string
          format: date-time
          description: Planned end time (required on create, sortable)
        workType:
          type: string
          description: Work type — picklist value or ID
        permitType:
          type: string
          description: Permit classification — picklist value or ID
        workPermitType:
          type: string
          description: Work permit type — pass the `type` value (e.g. 'Hot Work') or numeric ID. Drives which checklist templates are applied on create. Use `GET /picklist/workpermit/workPermitType` for valid values.
        vendor:
          type: integer
          description: Vendor ID carrying out the work
        vendorContact:
          type: integer
          description: Vendor contact ID
        ticket:
          type: integer
          description: Related work order / ticket ID
        requestedBy:
          type: integer
          description: Requester user ID
        issuedToUser:
          type: integer
          description: User the permit is issued to
        people:
          type: integer
          description: Person reference associated with the permit
        space:
          type: integer
          description: Space ID where the work is performed
        tenant:
          type: integer
          description: Tenant ID
        siteId:
          type: integer
          description: Site where the permit is raised (required on create)
        moduleState:
          type: string
          description: Workflow state — advance via `POST /workpermit/{id}/changestatus`
        approvalStatus:
          type: string
          description: Approval status
        isRecurring:
          type: boolean
          description: Whether this is a recurring permit
        permitStatus:
          type: string
          readOnly: true
          description: Lifecycle status (New → Pre Requisites Filled → Pre Validation Done → Post Requisites Filled → Post Validation Done). Advance via the lifecycle actions, not PATCH.
