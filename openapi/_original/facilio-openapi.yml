  # ════════════════════════════════════════════════════════════════
  # Job Plans
  # ════════════════════════════════════════════════════════════════

  /jobplan:
    get:
      tags: [Job Plans]
      summary: List job plans
      description: |
        Returns a paginated list of job plans. Only the current version of each plan is listed —
        old (Revised) and in-progress (Pending Revision) versions are excluded. Supports filtering,
        sorting, field selection, and saved views. Sections/tasks are not embedded in the list;
        fetch a single plan to get them.
      operationId: listJobPlans
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/view'
        - name: sortBy
          in: query
          description: Field to sort by (only sortable fields accepted)
          schema:
            type: string
            enum: [id, name, jpStatus, jobPlanVersion, sysCreatedTime, sysModifiedTime]
        - name: sortOrder
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
      responses:
        '200':
          description: Paginated list of job plans
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/JobPlan'
              example:
                success: true
                data:
                  - id: 220
                    name: "AHU Monthly PM"
                    jobPlanCategory: "Assets"
                    jpStatus: "Active"
                    jobPlanVersion: 2
                    unitOfMeasure: "Each"
                    sysCreatedTime: "2026-02-01T09:00:00Z"
                    sysCreatedBy: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
                pagination: {page: 1, pageSize: 50}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Job Plans]
      summary: Create a job plan
      description: |
        Creates a job plan together with its task sections and tasks in a single call. Requires `name`
        and `jobPlanCategory`. When `jobPlanCategory` is `Asset Category` or `Space Category`, the
        matching `assetCategory` / `spaceCategory` lookup is also required. Each section must contain
        at least one task. Task `inputType` accepts an enum name (`NONE`, `READING`, `TEXT`, `NUMBER`,
        `RADIO`, `BOOLEAN`); a `RADIO` task's choices are sent as a plain string list under `options`.
        Use `GET /jobplan/taskmetadata` to discover valid task enum values (input types, frequencies,
        criticalities, skill sets, metrics and their units). Lifecycle fields (`jpStatus`,
        `jobPlanVersion`, `group`) are read-only.
      operationId: createJobPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/JobPlan'
            example:
              data:
                name: "AHU Monthly PM"
                jobPlanCategory: "Assets"
                unitOfMeasure: "Each"
                jobplansection:
                  - name: "Filters"
                    sequenceNumber: 1
                    tasks:
                      - name: "Check filter differential pressure"
                        inputType: "NUMBER"
                        metricId: "PRESSURE"
                        unitId: "PASCAL"
                        minSafeLimit: 0
                        maxSafeLimit: 250
                        createWoOnFailure: true
                      - name: "Filter condition"
                        inputType: "RADIO"
                        options: ["Good", "Replace"]
                  - name: "Belts"
                    sequenceNumber: 2
                    tasks:
                      - name: "Inspect belt tension"
                        inputType: "TEXT"
                        remarksRequired: true
      responses:
        '201':
          description: Job plan created
          content:
            application/json:
              example:
                success: true
                data:
                  id: 221
                  name: "AHU Monthly PM"
                  jobPlanCategory: "Assets"
                  jpStatus: "Inactive"
                  jobPlanVersion: 1
                  jobplansection:
                    - id: 900
                      name: "Filters"
                      sequenceNumber: 1
                      tasks:
                        - {id: 4001, name: "Check filter differential pressure", sequenceNumber: 1, inputType: "NUMBER", metricId: 3, unitId: 21, minSafeLimit: 0, maxSafeLimit: 250, createWoOnFailure: true}
                        - {id: 4002, name: "Filter condition", sequenceNumber: 2, inputType: "RADIO", options: ["Good", "Replace"]}
                message: "Record created"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobplan/taskmetadata:
    get:
      tags: [Job Plans]
      summary: Job plan task metadata
      description: |
        Returns the allowed values for the task-level enum fields — `inputType`, `taskFrequency`,
        `taskCriticality`, `skillSet`, and `metrics` (each with its valid `units` nested). Use these
        when building task payloads for create/update.
      operationId: getJobPlanTaskMetadata
      responses:
        '200':
          description: Task enum metadata
          content:
            application/json:
              example:
                success: true
                data:
                  inputType:
                    - {value: "NONE", label: "NONE", id: 1}
                    - {value: "READING", label: "READING", id: 2}
                    - {value: "NUMBER", label: "NUMBER", id: 4}
                    - {value: "RADIO", label: "RADIO", id: 5}
                  taskFrequency:
                    - {value: "DAILY", label: "Daily", id: 1}
                    - {value: "WEEKLY", label: "Weekly", id: 2}
                  taskCriticality:
                    - {value: "LOW", label: "Low", id: 1}
                    - {value: "HIGH", label: "High", id: 3}
                  skillSet:
                    - {value: "ELECTRICAL", label: "Electrical", id: 1}
                  metrics:
                    - {value: "PRESSURE", label: "Pressure", id: 3, units: [{value: "PASCAL", label: "Pascal", id: 21}, {value: "BAR", label: "Bar", id: 22}]}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobplan/bulk:
    post:
      tags: [Job Plans]
      summary: Bulk create job plans
      description: |
        Creates multiple job plans (each with its sections/tasks) in one request. Because each plan is
        created via the full create path, this is **not** single-transaction all-or-nothing — a failure
        on one record does not roll back plans already created earlier in the list. Capped at 200 records.
      operationId: bulkCreateJobPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/JobPlan'
            example:
              data:
                - name: "Pump Weekly Check"
                  jobPlanCategory: "Assets"
                  jobplansection:
                    - name: "General"
                      tasks: [{name: "Visual inspection", inputType: "NONE"}]
      responses:
        '201':
          description: Job plans created
          content:
            application/json:
              example: {success: true, data: [{id: 222, name: "Pump Weekly Check"}], message: "Records created"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobplan/{id}:
    get:
      tags: [Job Plans]
      summary: Get a job plan
      description: Returns a single job plan with its task sections and tasks embedded under `jobplansection`.
      operationId: getJobPlan
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/select'
      responses:
        '200':
          description: Job plan details
          content:
            application/json:
              example:
                success: true
                data:
                  id: 221
                  name: "AHU Monthly PM"
                  jobPlanCategory: "Assets"
                  jpStatus: "Active"
                  jobPlanVersion: 1
                  group: {id: 221}
                  jobplansection:
                    - id: 900
                      name: "Filters"
                      sequenceNumber: 1
                      tasks:
                        - {id: 4001, name: "Check filter differential pressure", sequenceNumber: 1, inputType: "NUMBER", minSafeLimit: 0, maxSafeLimit: 250}
                  sysCreatedTime: "2026-02-01T09:00:00Z"
                  sysCreatedBy: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Job Plans]
      summary: Update a job plan
      description: |
        Updates a job plan. Include only the scalar fields you want to change. To modify sections/tasks,
        send the full desired `jobplansection` array (it is a full replace, not a merge). A **published
        (Active)** plan cannot be edited directly — revise it first (returns 400 with guidance).
      operationId: updateJobPlan
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/JobPlan'
            example:
              data:
                notes: "Updated for Q2 schedule"
      responses:
        '200':
          description: Job plan updated (returns the record with embedded sections/tasks)
          content:
            application/json:
              example: {success: true, data: {id: 221, name: "AHU Monthly PM", notes: "Updated for Q2 schedule"}, message: "Record updated"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Job Plans]
      summary: Delete a job plan
      description: Permanently deletes a job plan. This action cannot be undone.
      operationId: deleteJobPlan
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Job plan deleted
          content:
            application/json:
              example: {success: true, message: "Record deleted"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Job Plan revisioning ──

  /jobplan/{id}/revise:
    post:
      tags: [Job Plans]
      summary: Revise a job plan
      description: |
        Creates a new linked draft revision (status Pending Revision, version incremented, same lineage
        `group`) from a published (Active) plan. Only one open revision may exist per lineage.
      operationId: reviseJobPlan
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Revision created
          content:
            application/json:
              example: {success: true, data: {jobPlanId: 230, groupId: 221, jobPlanVersion: 2}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobplan/{id}/publish:
    post:
      tags: [Job Plans]
      summary: Publish a job plan
      description: Makes a draft revision the Active version; the previously active version in the lineage becomes Revised.
      operationId: publishJobPlan
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Job plan published
          content:
            application/json:
              example: {success: true, data: {jobPlanId: 230, groupId: 221, jobPlanVersion: 2}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobplan/{id}/clone:
    post:
      tags: [Job Plans]
      summary: Clone a job plan
      description: Creates an independent copy (lineage broken, name prefixed "Copy Of", version reset).
      operationId: cloneJobPlan
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '201':
          description: Job plan cloned
          content:
            application/json:
              example: {success: true, data: {jobPlanId: 231, jobPlanVersion: 1}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobplan/{id}/versionHistory:
    get:
      tags: [Job Plans]
      summary: Get job plan version history
      description: Lists all revisions in the same lineage (`group`), newest first.
      operationId: getJobPlanVersionHistory
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Version history
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 230, name: "AHU Monthly PM", jobPlanVersion: 2, jpStatus: "ACTIVE", groupId: 221}
                  - {id: 221, name: "AHU Monthly PM", jobPlanVersion: 1, jpStatus: "REVISED", groupId: 221}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Job Plan Attachments ──

  /jobplan/{id}/attachments:
    get:
      tags: [Job Plan Attachments]
      summary: List job plan attachments
      operationId: listJobPlanAttachments
      parameters: [{$ref: '#/components/parameters/recordId'}]
      responses:
        '200':
          description: List of attachments
