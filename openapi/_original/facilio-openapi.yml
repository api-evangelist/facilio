      operationId: listEmployees
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/view'
        - name: sortBy
          in: query
          description: Field to sort by (only sortable fields accepted)
          schema: {type: string, enum: [id, name, email, sysCreatedTime, sysModifiedTime]}
        - name: sortOrder
          in: query
          schema: {type: string, enum: [asc, desc], default: asc}
      responses:
        '200':
          description: Paginated list of employees
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Employee'
              example:
                success: true
                data:
                  - {id: 800, name: "Priya Nair", email: "priya.nair@example.com", phone: "+91-80-1234-5678", designation: "Facilities Engineer", department: {id: 12, name: "Operations"}, active: true}
                pagination: {page: 1, pageSize: 50}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Employees]
      summary: Create an employee
      description: Creates a new employee. Requires `name` and `email`.
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/Employee'
            example:
              data: {name: "Priya Nair", email: "priya.nair@example.com", phone: "+91-80-1234-5678", designation: "Facilities Engineer", department: 12, active: true}
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              example: {success: true, data: {id: 800, name: "Priya Nair", email: "priya.nair@example.com", active: true}, message: "Record created"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
