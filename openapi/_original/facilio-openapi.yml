    get:
      tags: [Indoor Floor Plans]
      summary: Get floor plan object properties
      description: Returns the properties panel data for a specific marker/zone (`objectId`) placed on the floor plan.
      operationId: getIndoorFloorPlanPropertiesData
      parameters:
        - $ref: '#/components/parameters/recordId'
        - in: query
          name: objectId
          required: true
          schema: {type: integer, format: int64}
        - in: query
          name: viewMode
          schema: {type: string, enum: [ASSIGNMENT, BOOKING]}
        - in: query
          name: startTime
          schema: {type: integer, format: int64}
        - in: query
          name: endTime
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Floor plan object properties
          content:
            application/json:
              example: {success: true, data: {}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

