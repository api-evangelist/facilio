  # ════════════════════════════════════════════════════════════════
  # Work Permits
  # ════════════════════════════════════════════════════════════════

  /workpermit:
    get:
      tags: [Work Permits]
      summary: List work permits
      description: |
        Returns a paginated list of work permits. Supports filtering, sorting, field selection, and saved views.
        By default returns module-configured fields; use `?select=` to customize. Custom fields can be included
        via `?select=name,{field_name}_workpermit`.
      operationId: listWorkPermits
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/view'
        - $ref: '#/components/parameters/changed'
        - name: sortBy
          in: query
          description: Field to sort by (only sortable fields accepted)
          schema:
            type: string
            enum: [id, localId, name, expectedStartTime, expectedEndTime, sysCreatedTime, sysModifiedTime]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated list of work permits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WorkPermit'
              example:
                success: true
                data:
                  - id: 300
                    localId: 12
                    name: "Hot Work - Roof Plant Room"
                    permitStatus: "Pre Requisites Filled"
                    workPermitType: "Hot Work"
                    moduleState: "Open"
                    expectedStartTime: "2026-03-02T08:00:00Z"
                    expectedEndTime: "2026-03-02T17:00:00Z"
                    siteId: {id: 10, name: "Headquarters"}
                    isRecurring: false
                    noOfAttachments: 1
                    sysCreatedTime: "2026-03-01T09:00:00Z"
                    sysCreatedBy: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
                pagination:
                  page: 1
                  pageSize: 50
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Work Permits]
      summary: Create a work permit
      description: |
        Creates a new work permit. Requires `name`, `expectedEndTime`, and `siteId`.
        On create the permit's checklist items are auto-populated from the selected `workPermitType`'s
        templates (split into pre-requisite and post-requisite phases). The lifecycle fields
        (`permitStatus`, `isPreValidationDone`, `isPostValidationDone`) are read-only here and advance
        only through the lifecycle actions below.
      operationId: createWorkPermit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/WorkPermit'
            example:
              data:
                name: "Hot Work - Roof Plant Room"
                workPermitType: "Hot Work"
                expectedStartTime: "2026-03-02T08:00:00Z"
                expectedEndTime: "2026-03-02T17:00:00Z"
                siteId: 10
                vendor: 45
                description: "Welding on rooftop condenser bracket"
      responses:
        '201':
          description: Work permit created successfully
          content:
            application/json:
              example:
                success: true
                data:
                  id: 301
                  localId: 13
                  name: "Hot Work - Roof Plant Room"
                  workPermitType: "Hot Work"
                  permitStatus: "New"
                  siteId: {id: 10, name: "Headquarters"}
                  sysCreatedTime: "2026-03-01T10:00:00Z"
                  sysCreatedBy: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
                message: "Record created"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workpermit/bulk:
    post:
      tags: [Work Permits]
      summary: Bulk create work permits
      description: |
        Creates multiple work permits in a single request. The `data` array holds one object per permit,
        each following the same shape as single create. Returns the created records in order.
      operationId: bulkCreateWorkPermits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkPermit'
            example:
              data:
                - name: "Confined Space - Tank 3"
                  workPermitType: "Confined Space"
                  expectedEndTime: "2026-03-05T17:00:00Z"
                  siteId: 10
                - name: "Working at Height - Atrium"
                  workPermitType: "Working at Height"
                  expectedEndTime: "2026-03-06T17:00:00Z"
                  siteId: 10
      responses:
        '201':
          description: Work permits created
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 302, name: "Confined Space - Tank 3", permitStatus: "New"}
                  - {id: 303, name: "Working at Height - Atrium", permitStatus: "New"}
                message: "Records created"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workpermit/{id}:
    get:
      tags: [Work Permits]
      summary: Get a work permit
      description: |
        Returns a single work permit with all system fields, custom fields, and expanded lookup fields.
        The response also embeds a `checklist` object grouping the permit's filled items into
        `preRequisites` and `postRequisites` (the same grouped view as `GET /workpermit/{id}/checklist`).
      operationId: getWorkPermit
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
      responses:
        '200':
          description: Work permit details
          content:
            application/json:
              example:
                success: true
                data:
                  id: 300
                  localId: 12
                  name: "Hot Work - Roof Plant Room"
                  description: "Welding on rooftop condenser bracket"
                  workPermitType: "Hot Work"
                  permitStatus: "Pre Requisites Filled"
                  isPreValidationDone: false
                  isPostValidationDone: false
                  moduleState: "Open"
                  expectedStartTime: "2026-03-02T08:00:00Z"
                  expectedEndTime: "2026-03-02T17:00:00Z"
                  siteId: {id: 10, name: "Headquarters"}
                  vendor: {id: 45, name: "Acme Contractors"}
                  isRecurring: false
                  noOfAttachments: 1
                  checklist:
                    preRequisites:
                      - {id: 900, checklist: "Fire extinguisher on site", required: true, isReviewed: false, remarks: "2 units staged"}
                    postRequisites:
                      - {id: 905, checklist: "Area inspected 60 min after work", required: true, isReviewed: false}
                  sysCreatedTime: "2026-03-01T09:00:00Z"
                  sysCreatedBy: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Work Permits]
      summary: Update a work permit
      description: |
        Updates an existing work permit. Only the fields included in the request body are updated.
        Lifecycle fields (`permitStatus`, `isPreValidationDone`, `isPostValidationDone`) are read-only
        here — use the lifecycle actions to advance them.
      operationId: updateWorkPermit
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/WorkPermit'
            example:
              data:
                description: "Welding on rooftop condenser bracket (revised scope)"
                expectedEndTime: "2026-03-02T19:00:00Z"
      responses:
        '200':
          description: Work permit updated successfully
          content:
            application/json:
              example:
                success: true
                data:
                  id: 300
                  name: "Hot Work - Roof Plant Room"
                  expectedEndTime: "2026-03-02T19:00:00Z"
                  sysModifiedTime: "2026-03-01T12:00:00Z"
                message: "Record updated"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Work Permits]
      summary: Delete a work permit
      description: Permanently deletes a work permit. This action cannot be undone.
      operationId: deleteWorkPermit
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Work permit deleted
          content:
            application/json:
              example: {success: true, message: "Record deleted"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Work Permit lifecycle ──

  /workpermit/{id}/checklist:
    get:
      tags: [Work Permits]
      summary: Get a work permit's checklist
      description: |
        Returns the permit's checklist items grouped into `preRequisites` and `postRequisites`.
        Lighter than fetching the full permit; the same grouped structure embedded on the single-record GET.
      operationId: getWorkPermitChecklist
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Grouped checklist
          content:
            application/json:
              example:
                success: true
                data:
                  preRequisites:
                    - {id: 900, checklist: "Fire extinguisher on site", required: true, isReviewed: false, remarks: "2 units staged"}
                    - {id: 901, checklist: "Gas test completed", required: true, isReviewed: false}
                  postRequisites:
                    - {id: 905, checklist: "Area inspected 60 min after work", required: true, isReviewed: false}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /workpermit/{id}/submit-prerequisites:
    post:
      tags: [Work Permits]
      summary: Submit pre-requisites
      description: |
        Marks the permit's pre-requisite checklist as filled and advances `permitStatus` to
        **Pre Requisites Filled**. Fill individual items via `PATCH /workpermitchecklist/{id}` first.
      operationId: submitWorkPermitPreRequisites
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Pre-requisites submitted
          content:
            application/json:
              example: {success: true, data: {id: 300, permitStatus: "Pre Requisites Filled"}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /workpermit/{id}/review-prerequisites:
    post:
      tags: [Work Permits]
      summary: Review pre-requisites
      description: Approves the filled pre-requisites, sets `isPreValidationDone` and advances `permitStatus` to **Pre Validation Done**.
      operationId: reviewWorkPermitPreRequisites
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Pre-requisites reviewed
          content:
            application/json:
              example: {success: true, data: {id: 300, permitStatus: "Pre Validation Done", isPreValidationDone: true}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /workpermit/{id}/submit-postrequisites:
    post:
      tags: [Work Permits]
      summary: Submit post-requisites
      description: Marks the post-requisite checklist as filled and advances `permitStatus` to **Post Requisites Filled**.
      operationId: submitWorkPermitPostRequisites
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Post-requisites submitted
          content:
            application/json:
              example: {success: true, data: {id: 300, permitStatus: "Post Requisites Filled"}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /workpermit/{id}/review-postrequisites:
    post:
      tags: [Work Permits]
      summary: Review post-requisites
      description: Approves the filled post-requisites, sets `isPostValidationDone` and advances `permitStatus` to **Post Validation Done**.
      operationId: reviewWorkPermitPostRequisites
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Post-requisites reviewed
          content:
            application/json:
              example: {success: true, data: {id: 300, permitStatus: "Post Validation Done", isPostValidationDone: true}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /workpermit/{id}/changestatus:
    post:
      tags: [Work Permits]
      summary: Change work permit status
      description: Transitions the permit's `moduleState` to a new state via the module's configured state flow.
      operationId: changeWorkPermitStatus
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [status]
                  properties:
                    status: {type: string, description: "Target status name"}
            example:
              data: {status: "Closed"}
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              example: {success: true, data: {id: 300, moduleState: "Closed"}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /workpermit/{id}/activities:
    get:
      tags: [Work Permits]
      summary: List work permit activities
      description: |
        Returns the permit's activity timeline (audit feed) — record creation, field changes, status
        changes, comments, and approvals — most recent first. Read-only.
      operationId: listWorkPermitActivities
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/count'
      responses:
        '200':
          description: Activity timeline
          content:
            application/json:
              example:
                success: true
                data:
                  - id: 5002
                    category: "STATUS_CHANGE"
                    summary: "Status changed to Pre Requisites Filled"
                    actor: {id: 5, name: "John Smith", email: "john@facilio.com"}
                    time: "2026-03-01T10:15:00Z"
                    status: "Pre Requisites Filled"
                  - id: 5001
                    category: "RECORD_CREATED"
                    summary: "Work Permit created"
                    actor: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
                    time: "2026-03-01T09:00:00Z"
                pagination:
                  page: 1
                  pageSize: 50
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Work Permit Attachments ──

  /workpermit/{id}/attachments:
    get:
      tags: [Work Permit Attachments]
      summary: List work permit attachments
      description: Returns all file attachments for the specified work permit.
      operationId: listWorkPermitAttachments
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: List of attachments
          content:
            application/json:
              example:
                success: true
                data:
                  - id: 401
                    fileName: "risk-assessment.pdf"
                    fileSize: 524288
                    contentType: "application/pdf"
                    createdTime: "2026-03-01T09:10:00Z"
                    createdBy: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Work Permit Attachments]
      summary: Add work permit attachment
      description: Uploads a file attachment to the specified work permit. Use multipart/form-data.
      operationId: addWorkPermitAttachment
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                attachment:
                  type: string
                  format: binary
                  description: The file to upload
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              example:
                success: true
                data:
                  - id: 402
                    fileName: "method-statement.pdf"
                    fileSize: 262144
                    contentType: "application/pdf"
                    createdTime: "2026-03-01T09:20:00Z"
                message: "Attachment(s) added successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workpermit/{id}/attachments/{attachmentId}:
    delete:
      tags: [Work Permit Attachments]
      summary: Delete work permit attachment
      description: Deletes a specific attachment from the work permit.
      operationId: deleteWorkPermitAttachment
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/attachmentId'
      responses:
        '200':
          description: Attachment deleted
          content:
            application/json:
              example: {success: true}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /workpermit/{id}/attachments/{attachmentId}/download:
    get:
      tags: [Work Permit Attachments]
      summary: Download work permit attachment
      description: Downloads the file content of a specific attachment. Returns the raw file with appropriate Content-Type and Content-Disposition headers.
      operationId: downloadWorkPermitAttachment
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/attachmentId'
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Work Permit Comments ──

  /workpermit/{id}/comments:
    get:
      tags: [Work Permit Comments]
      summary: List work permit comments
      description: Returns all comments/notes for the specified work permit, sorted by creation time.
      operationId: listWorkPermitComments
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              example:
                success: true
                data:
                  - id: 501
                    body: "Vendor briefed on confined-space entry procedure"
                    bodyHTML: "<p>Vendor briefed on confined-space entry procedure</p>"
                    createdTime: "2026-03-01T09:30:00Z"
                    createdBy: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Work Permit Comments]
      summary: Add work permit comment
      description: Adds a comment/note to the work permit.
      operationId: addWorkPermitComment
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/WorkPermitComment'
            example:
              data:
                body: "Isolation confirmed by facilities before work start."
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              example:
                success: true
                data:
                  id: 502
                  body: "Isolation confirmed by facilities before work start."
                  createdTime: "2026-03-01T09:45:00Z"
                  createdBy: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
                message: "Comment added successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workpermit/{id}/comments/{commentId}:
    patch:
      tags: [Work Permit Comments]
      summary: Update work permit comment
      description: Updates the body text of an existing comment.
      operationId: updateWorkPermitComment
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/commentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [body]
                  properties:
                    body: {type: string}
            example:
              data: {body: "Updated: isolation confirmed and locked off."}
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              example: {success: true, data: {id: 502, body: "Updated: isolation confirmed and locked off."}, message: "Comment updated successfully"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Work Permit Comments]
      summary: Delete work permit comment
      description: Deletes a comment from the work permit.
      operationId: deleteWorkPermitComment
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/commentId'
      responses:
        '200':
          description: Comment deleted
          content:
            application/json:
              example: {success: true}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Work Permit Checklists ──

  /workpermitchecklist:
    get:
      tags: [Work Permit Checklists]
      summary: List work permit checklist items
      description: |
        Returns filled checklist items across permits. Filter to one permit with the standard query-param
        filter, e.g. `?workPermit=300`. Items are auto-created when a permit is created, so this module is
        read + update only (no create/delete).
      operationId: listWorkPermitChecklistItems
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/count'
      responses:
        '200':
          description: List of checklist items
          content:
            application/json:
              example:
                success: true
                data:
                  - id: 900
                    workPermit: {id: 300}
                    checklist: {id: 700, name: "Fire extinguisher on site"}
                    required: true
                    isReviewed: false
                    remarks: "2 units staged"
                    noOfAttachments: 0
                pagination: {page: 1, pageSize: 50}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workpermitchecklist/{id}:
    get:
      tags: [Work Permit Checklists]
      summary: Get a work permit checklist item
      operationId: getWorkPermitChecklistItem
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Checklist item
          content:
            application/json:
              example:
                success: true
                data:
                  id: 900
                  workPermit: {id: 300}
                  checklist: {id: 700, name: "Fire extinguisher on site"}
                  required: true
                  isReviewed: false
                  remarks: "2 units staged"
                  reviewerRemarks: null
                  noOfAttachments: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Work Permit Checklists]
      summary: Fill or review a checklist item
      description: |
        Updates a single checklist item — fill it (`remarks`) or review it (`isReviewed`, `reviewerRemarks`).
        Only the included fields are changed.
      operationId: updateWorkPermitChecklistItem
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/WorkPermitChecklist'
            example:
              data:
                isReviewed: true
                reviewerRemarks: "Verified on site"
      responses:
        '200':
          description: Checklist item updated
          content:
            application/json:
              example:
                success: true
                data: {id: 900, isReviewed: true, reviewerRemarks: "Verified on site"}
                message: "Record updated"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

