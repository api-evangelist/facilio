      parameters:
        - in: query
          name: spaceIds
          schema: {type: string}
          description: Comma-separated space ids
        - in: query
          name: startTime
          schema: {type: integer, format: int64}
          description: Epoch millis
        - in: query
          name: endTime
          schema: {type: integer, format: int64}
          description: Epoch millis
      responses:
        '200':
          description: Facility/booking details
          content:
            application/json:
              example: {success: true, data: {facility: {}, facilityBooking: {}}}
        '401':
          $ref: '#/components/responses/Unauthorized'

