  # ── Delivery Attachments ──

  /deliveries/{id}/attachments:
    get:
      tags: [Deliveries]
      summary: List delivery attachments
      description: Returns all file attachments for the specified delivery (e.g. package photo, signature).
      operationId: listDeliveryAttachments
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: List of attachments
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 301, fileName: "package.jpg", fileSize: 204800, contentType: "image/jpeg", createdTime: "2026-02-14T09:00:00Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Deliveries]
      summary: Add delivery attachment
      description: Uploads a file attachment to the specified delivery. Use multipart/form-data.
      operationId: addDeliveryAttachment
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                attachment: {type: string, format: binary, description: "The file to upload"}
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              example: {success: true, data: [{id: 302, fileName: "package2.jpg", fileSize: 512000, contentType: "image/jpeg"}], message: "Attachment(s) added successfully"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deliveries/{id}/attachments/{attachmentId}:
    delete:
      tags: [Deliveries]
      summary: Delete delivery attachment
      operationId: deleteDeliveryAttachment
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/attachmentId'
      responses:
        '200':
          description: Attachment deleted
          content:
            application/json:
              example: {success: true}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /deliveries/{id}/attachments/{attachmentId}/download:
    get:
      tags: [Deliveries]
      summary: Download delivery attachment
      description: Downloads the file content of a specific attachment.
      operationId: downloadDeliveryAttachment
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/attachmentId'
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

