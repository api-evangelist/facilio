  # ════════════════════════════════════════════════════════════════
  # Facility Bookings
  # ════════════════════════════════════════════════════════════════

  /facilitybooking:
    get:
      tags: [Facility Bookings]
      summary: List facility bookings
      operationId: listFacilityBookings
      parameters: [{$ref: '#/components/parameters/page'}, {$ref: '#/components/parameters/pageSize'}, {$ref: '#/components/parameters/select'}, {$ref: '#/components/parameters/search'}, {$ref: '#/components/parameters/count'}]
      responses:
        '200':
          description: List of facility bookings
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 800, facility: {id: 700}, bookingDate: "2026-02-14T00:00:00Z", noOfAttendees: 4, moduleState: "Active"}
                pagination: {page: 1, pageSize: 50}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Facility Bookings]
      summary: Create a facility booking
      description: |
        Creates a new facility booking. Requires `facility`, `bookingDate`, `noOfAttendees`, `internalAttendees`, and `tenant`.

        Time slots aren't plain start/end fields — reserve one or more pre-generated `slot` ids (see `GET /slot`) by passing them as `slotIds`. The server expands these into the booking's slot links.
      operationId: createFacilityBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  allOf:
                    - $ref: '#/components/schemas/FacilityBooking'
                    - type: object
                      properties:
                        slotIds: {type: array, items: {type: integer, format: int64}, description: "Slot ids to reserve (write-only)"}
            example:
              data: {facility: 700, bookingDate: "2026-02-14T00:00:00Z", noOfAttendees: 4, internalAttendees: [5, 8], tenant: 2, slotIds: [900, 901]}
      responses:
        '201':
          description: Facility booking created
          content:
            application/json:
              example: {success: true, data: {id: 801, facility: {id: 700}}, message: "Record created"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /facilitybooking/{id}:
    get:
      tags: [Facility Bookings]
      summary: Get a facility booking
      operationId: getFacilityBooking
      parameters: [{$ref: '#/components/parameters/recordId'}]
      responses:
        '200':
          description: Facility booking details
          content:
            application/json:
              example: {success: true, data: {id: 800, facility: {id: 700, name: "Conference Room A"}, noOfAttendees: 4, moduleState: "Active"}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Facility Bookings]
      summary: Update a facility booking
      operationId: updateFacilityBooking
      parameters: [{$ref: '#/components/parameters/recordId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/FacilityBooking'
            example:
              data: {noOfAttendees: 6}
      responses:
        '200':
          description: Facility booking updated
          content:
            application/json:
              example: {success: true, message: "Record updated"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
