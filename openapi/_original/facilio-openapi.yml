              displayName: {type: string}

    AssetCategory:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string, description: "Category name (e.g. HVAC, Electrical)"}
              displayName: {type: string}

    AssetType:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string, description: "Type name"}
              displayName: {type: string}

    AssetDepartment:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string, description: "Department name"}

    SpaceCategory:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
