              id: {type: integer}
              displayName: {type: string}

    # ── Schema Discovery ──

    FacilioModule:
      type: object
      description: "A single entry in the module catalogue returned by GET /modules."
      properties:
        name:
          type: string
          description: "Module name used in all API paths (e.g. `workorder`, `custom_employees`)"
        displayName:
          type: string
          description: "Human-readable module label (e.g. `Work Orders`, `Employees`)"
        description:
          type: string
          description: "Module description as configured in Facilio Setup. Omitted when blank."
        isCustom:
          type: boolean
          description: "`true` for modules created by your organization; `false` for standard Facilio modules"

    FacilioField:
      type: object
      description: "Schema descriptor for a single field within a module."
      properties:
        name:
          type: string
          description: "Field name used in API requests and responses (e.g. `subject`, `po_reference_workorder`)"
        displayName:
          type: string
          description: "Human-readable field label"
        dataType:
          type: string
          description: |
            Field data type. Common values:
            `STRING`, `NUMBER`, `DECIMAL`, `BOOLEAN`,
            `DATE`, `DATE_TIME`,
            `BIG_STRING` (large text, excluded from list responses),
            `LOOKUP` (reference to another record — see `lookupModuleName`),
            `MULTI_LOOKUP` (multi-reference — see `lookupModuleName`),
            `ENUM`, `SYSTEM_ENUM`, `STRING_SYSTEM_ENUM` (picklist types)
          example: STRING
        required:
          type: boolean
          description: "`true` if this field must be provided on record creation"
        readOnly:
          type: boolean
          description: "`true` if this field cannot be set or modified via the API (e.g. auto-generated system fields)"
        isCustom:
          type: boolean
          description: "`true` for fields added by your organization; `false` for standard built-in fields"
        sortable:
          type: boolean
          description: "`true` if this field can be used as a `sortBy` value on the list API"
        lookupModuleName:
          type: string
          description: "Present only on `LOOKUP` and `MULTI_LOOKUP` fields. The name of the target module (e.g. `site`, `users`, `ticketstatus`)."
        max_length:
          type: integer
          description: |
            Maximum number of characters accepted by the V5 write API for text-style fields.
            Present only when the field's `dataType` is one of:
            `STRING` (255), `LARGE_TEXT` (2000), `BIG_STRING` (32000).
            Omitted for all other data types.
          example: 255
        allowed_values:
          type: array
          description: |
            List of acceptable write values for picklist-capable fields. Present **only when the request includes `?includeAllowedValues=true`** AND the field is one of:
            `ENUM`, `SYSTEM_ENUM`, `MULTI_ENUM`, `STRING_SYSTEM_ENUM`, or a `LOOKUP` targeting a system picklist module (e.g. `ticketstatus`, `ticketpriority`, `ticketcategory`, `tickettype`).
            Each entry uses `{label, value}`; the `value` is the canonical form accepted by create/update payloads.
          items:
            type: object
            properties:
              label:
                type: string
                description: "Display label as shown in the UI"
              value:
                type: string
                description: "Canonical value accepted by create/update for this field and filtering"

    ModuleMetaResponse:
      type: object
      description: "Response body for GET /{moduleName}/metadata."
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            module:
              $ref: '#/components/schemas/FacilioModule'
            fields:
              type: array
              description: |
                Ordered list of fields for the module.
                Standard Facilio modules return built-in fields first, followed by any fields your organization added.
                Custom modules return all fields.
              items:
                $ref: '#/components/schemas/FacilioField'

    User:
      type: object
      description: |
        Expanded object for lookups to the `users` module.
        On list API, user lookups return `{id}` only unless `?expand=` includes that field.
        When expanded (single-record GET, create/update responses, or list with `expand`): fixed set `id`, `name`, `email`, `phone` (see **Lookup fields in responses**).
      properties:
        id: {type: integer, format: int64, description: "User ID"}
        name: {type: string, description: "User's full name"}
        email: {type: string, description: "User's email address"}
        phone: {type: string, description: "Phone number when present"}

    Address:
      type: object
      description: "Postal address. Used for site/building locations, storeroom locations, vendor/client/tenant addresses, and quote/invoice billing & shipping addresses."
      properties:
        id: {type: integer, readOnly: true, description: "Address record ID"}
        name: {type: string, maxLength: 255, description: "Location name"}
        street: {type: string, maxLength: 255, description: "Street address"}
        city: {type: string, maxLength: 100, description: "City"}
        state: {type: string, maxLength: 100, description: "State or province"}
        zip: {type: string, maxLength: 20, description: "Postal / ZIP code"}
        country: {type: string, maxLength: 100, description: "Country code (e.g. IN, US)"}
        lat: {type: number, format: double, description: "Latitude"}
        lng: {type: number, format: double, description: "Longitude"}

    Profile:
      type: object
      properties:
        user:
          type: object
          properties:
            id: {type: integer}
            name: {type: string}
            email: {type: string}
            timezone: {type: string}
            role:
              type: object
              properties:
                id: {type: integer}
                name: {type: string}
        org:
          type: object
          properties:
            id: {type: integer}
            name: {type: string}
            domain: {type: string}

    # ── Work Order ──

    WorkOrder:
      type: object
      description: "Work order. Custom fields: `{field_name}_workorder`. On create, `subject` and `siteId` are required. On update, only include fields you want to change. Picklist fields accept display name strings or IDs."
      required: [subject, siteId]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        serialNumber: {type: integer, readOnly: true, description: "Auto-generated sequential number"}
        subject: {type: string, description: "Work order title (required on create, sortable)"}
        description: {type: string, description: "Detailed description of the work"}
        status: {type: string, description: "Status — pass `status` value (e.g. 'Submitted', 'Work in Progress') or numeric ID. Use `GET /picklist/workorder/status` for valid values."}
        priority: {type: string, description: "Priority level — picklist value (e.g. 'High', 'Medium', 'Low') or ID"}
        category: {type: string, description: "Work category — picklist value (e.g. 'Energy', 'HVAC') or ID"}
        type: {type: string, description: "Work type — picklist value (e.g. 'Corrective', 'Preventive') or ID"}
        sourceType: {type: string, readOnly: true, description: "How the work order was created (e.g. Web Work Order, Alarm)"}
        resource: {type: integer, description: "Associated asset or space ID. Returns {id, name} on GET."}
        siteId: {type: integer, description: "Site where the work order is raised — represents a building, campus, or facility in your portfolio (required on create)"}
        assignedTo: {type: integer, description: "Assigned staff user ID. Expanded per `users` module when returned on GET/create/update (see User schema)."}
        assignmentGroup: {type: integer, description: "Assigned team ID"}
        vendor: {type: integer, description: "Vendor ID"}
        client: {type: integer, description: "Client ID"}
        tenant: {type: integer, description: "Tenant ID"}
        requestedBy: {type: integer, description: "Requester user ID"}
        actualWorkDuration: {type: number, description: "Actual work duration in hours (sortable)"}
        actualWorkStart: {type: string, format: date-time, description: "When work actually started (sortable)"}
        actualWorkEnd: {type: string, format: date-time, description: "When work actually ended (sortable)"}
        estimatedWorkDuration: {type: number, description: "Estimated work duration in hours (sortable)"}
        scheduledStart: {type: string, format: date-time, description: "Scheduled start time (sortable)"}
        estimatedEnd: {type: string, format: date-time, description: "Estimated end time (sortable)"}
        responseDueDate: {type: string, format: date-time, description: "Response SLA due date (sortable)"}
        dueDate: {type: string, format: date-time, description: "Work order due date (sortable)"}
        highRisk: {type: boolean, description: "Whether flagged as high risk"}
        noOfAttachments: {type: integer, readOnly: true, description: "Number of file attachments (sortable)"}
        noOfClosedTasks: {type: integer, readOnly: true, description: "Number of completed tasks (sortable)"}
        noOfNotes: {type: integer, readOnly: true, description: "Number of comments (sortable)"}
        noOfTasks: {type: integer, readOnly: true, description: "Total number of tasks (sortable)"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Record creation timestamp (sortable)"}
        createdBy: {readOnly: true, description: "User who created the record", allOf: [{$ref: '#/components/schemas/User'}]}
        modifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modification timestamp (sortable)"}
        modifiedBy: {readOnly: true, description: "User who last modified", allOf: [{$ref: '#/components/schemas/User'}]}
      additionalProperties:
        description: "Custom fields (e.g. po_reference_workorder)"

    # ── Service Request ──

    ServiceRequest:
      type: object
      description: "Service request. Custom fields: `{field_name}_serviceRequest`. On create, `subject` and `site` are required. Send `site` in the body (not `siteId`); responses may still show site under `siteId`."
      required: [subject, site]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        subject: {type: string, description: "Request title (required on create, sortable)"}
        description: {type: string, description: "Detailed description"}
        moduleState: {type: string, description: "Status — pass `status` value (e.g. 'Submitted', 'Assigned') or numeric ID. Use `GET /picklist/servicerequest/moduleState` for valid values."}
        requester: {type: integer, description: "Requester user ID. Expanded per `users` when returned on GET/create/update."}
        urgency: {type: string, description: "Urgency level — display name or ID"}
        site: {description: "Site for this request (required on create). Pass the site id as a number, or an object with `id`."}
        siteId: {readOnly: true, description: "In responses the site is often serialized under this key (lookup expansion). Do not use for create/update; send `site` instead."}
        resource: {type: integer, description: "Asset or space ID"}
        assignedTo: {type: integer, description: "Assigned user ID"}
        assignmentGroup: {type: integer, description: "Assigned team ID"}
        dueDate: {type: string, format: date-time, description: "Due date (sortable)"}
        responseDueDate: {type: string, format: date-time, readOnly: true, description: "Response SLA due date (sortable)"}
        reportedDate: {type: string, format: date-time, description: "Date reported (sortable)"}
        actualStartDate: {type: string, format: date-time, description: "Actual start date (sortable)"}
        actualFinishDate: {type: string, format: date-time, description: "Actual finish date (sortable)"}
        sourceType: {type: string, readOnly: true, description: "How the request was created"}
        requestType: {type: string, description: "Request type"}
        mode: {type: string, description: "Request mode"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysCreatedBy: {readOnly: true, description: "Created by", allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified timestamp (sortable)"}
        sysModifiedBy: {readOnly: true, description: "Modified by", allOf: [{$ref: '#/components/schemas/User'}]}
      additionalProperties:
        description: "Custom fields"

    # ── Asset ──

    Asset:
      type: object
      description: "Asset. Custom fields: `{field_name}_asset`."
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Asset name (sortable)"}
        description: {type: string, description: "Asset description"}
        serialNumber: {type: string, description: "Manufacturer serial number"}
        tagNumber: {type: string, description: "Internal tag number"}
        qrVal: {type: string, description: "QR code value"}
        category: {type: string, description: "Category — picklist value (e.g. 'HVAC') or ID"}
        type: {type: string, description: "Type — picklist value or ID"}
        siteId: {type: integer, description: "Site where the asset is located — represents a building, campus, or facility in your portfolio"}
        space: {type: integer, description: "Space ID where the asset is located"}
        moduleState: {type: string, description: "Status — pass `status` value (e.g. 'Active') or numeric ID. Use `GET /picklist/asset/moduleState` for valid values."}
        manufacturer: {type: string, description: "Manufacturer name"}
        model: {type: string, description: "Model name/number"}
        department: {type: string, description: "Department — picklist value or ID"}
        purchasedDate: {type: string, format: date-time, description: "Purchase date"}
        warrantyExpiryDate: {type: string, format: date-time, description: "Warranty expiry date"}
        operationalStatus: {type: string, readOnly: true, description: "Operational status"}
        connected: {type: boolean, readOnly: true, description: "Whether connected to IoT"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}
        sysCreatedBy: {readOnly: true, description: "Created by", allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedBy: {readOnly: true, description: "Modified by", allOf: [{$ref: '#/components/schemas/User'}]}
      additionalProperties:
        description: "Custom fields (e.g. warranty_info_asset)"

    # ── Site ──

    Site:
      type: object
      description: "Site. Custom fields: `{field_name}_site`."
      required: [name]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Site name (required on create, sortable)"}
        description: {type: string, description: "Site description"}
        siteType: {type: string, enum: [Common, Hospital, Residential, Office, Commercial, Compound, University, Retail, "Residential & Commercial"], description: "Site type"}
        area: {type: number, description: "Total area"}
        grossFloorArea: {type: number, description: "Gross floor area"}
        managedBy: {type: integer, description: "Manager user ID"}
        noOfBuildings: {type: integer, readOnly: true, description: "Number of buildings"}
        timeZone: {type: string, description: "Timezone (e.g. America/New_York)"}
        location: {description: "Site address / location", allOf: [{$ref: '#/components/schemas/Address'}]}
        territory: {type: integer, description: "Territory ID (lookup). Use `GET /picklist/site/territory` for valid values."}
        moduleState: {type: string, description: "Status — pass `status` value or numeric ID. Use `GET /picklist/site/moduleState` for valid values."}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}
      additionalProperties:
        description: "Custom fields (e.g. client_type_site)"

    # ── Building ──

    Building:
      type: object
      description: "Building within a site."
      required: [name, site]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Building name (required on create, sortable)"}
        description: {type: string, description: "Building description"}
        site: {type: integer, description: "Parent site ID (required on create)"}
        location: {description: "Building address / location", allOf: [{$ref: '#/components/schemas/Address'}]}
        moduleState: {type: string, description: "Status — pass `status` value or numeric ID. Use `GET /picklist/building/moduleState` for valid values."}
        grossFloorArea: {type: number, description: "Gross floor area"}
        noOfFloors: {type: integer, readOnly: true, description: "Number of floors"}
        area: {type: number, description: "Total area"}
        managedBy: {type: integer, description: "Manager user ID"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Floor ──

    Floor:
      type: object
      description: "Floor within a building."
      required: [name, building, site]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Floor name (required on create, sortable)"}
        description: {type: string, description: "Floor description"}
        building: {type: integer, description: "Parent building ID (required on create)"}
        site: {type: integer, description: "Parent site ID (required on create)"}
        floorlevel: {type: integer, description: "Floor level number (sortable)"}
        area: {type: number, description: "Floor area (sortable)"}
        moduleState: {type: string, description: "Status — pass `status` value or numeric ID. Use `GET /picklist/floor/moduleState` for valid values."}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Space ──

    Space:
      type: object
      description: "Space within a site, building, or floor."
      required: [name, site]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Space name (required on create, sortable)"}
        description: {type: string, description: "Space description"}
        site: {type: integer, description: "Parent site ID (required on create)"}
        building: {type: integer, description: "Building ID"}
        floor: {type: integer, description: "Floor ID"}
        spaceCategory: {type: integer, description: "Space category picklist ID"}
        parentSpace: {type: integer, description: "Parent space ID"}
        area: {type: number, description: "Space area (sortable)"}
        maxOccupancy: {type: integer, description: "Maximum occupancy (sortable)"}
        moduleState: {type: string, description: "Status — pass `status` value or numeric ID. Use `GET /picklist/space/moduleState` for valid values."}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Room ──

    Room:
      type: object
      description: "A meeting room, phone room, or other specialized space, categorized by room type."
      required: [name, site]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Room name (required on create, sortable)"}
        site: {type: integer, description: "Parent site ID (required on create)"}
        building: {type: integer, description: "Building ID"}
        floor: {type: integer, description: "Floor ID"}
        spaceCategory: {type: integer, description: "Space category picklist ID"}
        location: {type: integer, description: "Location picklist ID"}
        area: {type: number, description: "Room area"}
        maxOccupancy: {type: integer, description: "Maximum occupancy"}
        roomType: {type: string, description: "Room type, e.g. \"Meeting Room\", \"Wellness Room\". Use `GET /picklist/rooms/roomType` for valid values."}
        qrVal: {type: string, description: "QR code value"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Desk ──

    Desk:
      type: object
      description: "An individual workstation within a space, assignable to an employee and department."
      required: [name, site]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Desk name (required on create, sortable)"}
        site: {type: integer, description: "Parent site ID (required on create)"}
        building: {type: integer, description: "Building ID"}
        floor: {type: integer, description: "Floor ID"}
        spaceCategory: {type: integer, description: "Space category picklist ID"}
        location: {type: integer, description: "Location picklist ID"}
        area: {type: number, description: "Desk area"}
        maxOccupancy: {type: integer, description: "Maximum occupancy"}
        deskCode: {type: string, description: "Desk code/label"}
        deskType: {type: string, description: "Desk type. Use `GET /picklist/desks/deskType` for valid values (e.g. Assigned, Hotel, Hot)."}
        employee: {type: integer, description: "Employee assigned to the desk"}
        department: {type: integer, description: "Department ID"}
        isActive: {type: boolean, description: "Whether the desk is active"}
        isArchived: {type: boolean, description: "Whether the desk is archived"}
        moduleState: {type: string, readOnly: true, description: "Status (Vacant/Occupied/Inactive) — driven by desk state flow, not directly writable. Use `GET /picklist/desks/moduleState` for valid values."}
        qrVal: {type: string, description: "QR code value"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Locker ──

    Locker:
      type: object
      description: "A storage locker within a space, assignable to an employee."
      required: [name, site]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Locker name (required on create, sortable)"}
        site: {type: integer, description: "Parent site ID (required on create)"}
        building: {type: integer, description: "Building ID"}
        floor: {type: integer, description: "Floor ID"}
        spaceCategory: {type: integer, description: "Space category picklist ID"}
        location: {type: integer, description: "Location picklist ID"}
        area: {type: number, description: "Locker area"}
        maxOccupancy: {type: integer, description: "Maximum occupancy"}
        employee: {type: integer, description: "Employee assigned to the locker"}
        moduleState: {type: string, readOnly: true, description: "Status — driven by locker state flow, not directly writable. Use `GET /picklist/lockers/moduleState` for valid values."}
        qrVal: {type: string, description: "QR code value"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Parking Stall ──

    ParkingStall:
      type: object
      description: "An individual parking space within a site, categorized by parking type and mode."
      required: [name, site]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Parking stall name (required on create, sortable)"}
        site: {type: integer, description: "Parent site ID (required on create)"}
        building: {type: integer, description: "Building ID"}
        floor: {type: integer, description: "Floor ID"}
        spaceCategory: {type: integer, description: "Space category picklist ID"}
        location: {type: integer, description: "Location picklist ID"}
        area: {type: number, description: "Stall area"}
        maxOccupancy: {type: integer, description: "Maximum occupancy"}
        parkingType: {type: string, description: "Parking type. Use `GET /picklist/parkingstall/parkingType` for valid values (e.g. Parking Stall, Handicap, Carpool)."}
        parkingMode: {type: string, description: "Parking mode. Use `GET /picklist/parkingstall/parkingMode` for valid values (e.g. Permanent, HOT, HOTEL)."}
        employee: {type: integer, description: "Employee assigned to the stall"}
        moduleState: {type: string, description: "Status — pass `status` value or numeric ID. Use `GET /picklist/parkingstall/moduleState` for valid values."}
        qrVal: {type: string, description: "QR code value"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Department ──

    Department:
      type: object
      description: "An organizational unit used to group employees and desks."
      required: [name, color]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Department name (required on create, sortable)"}
        color: {type: string, description: "Display color, e.g. a hex code (required on create)"}
        noOfDesks: {type: integer, readOnly: true, description: "Rollup count of desks assigned to this department"}
        noOfEmployee: {type: integer, readOnly: true, description: "Rollup count of employees assigned to this department"}
        moduleState: {type: string, description: "Status — pass `status` value or numeric ID. Use `GET /picklist/department/moduleState` for valid values."}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Delivery Area ──

    DeliveryArea:
      type: object
      description: "A drop-off location that deliveries are received at."
      required: [name]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Delivery area name (required on create, sortable)"}
        location: {type: integer, description: "Site/building/floor/space reference for this area"}
        isActive: {type: boolean, description: "Whether the delivery area is active"}
        moduleState: {type: string, readOnly: true, description: "Status. Use `GET /picklist/deliveryArea/moduleState` for valid values."}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Delivery ──

    Delivery:
      type: object
      description: "A package received on-site for an employee."
      required: [employee, receivedTime, deliveryArea, carrier]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, readOnly: true, description: "Auto-filled from the recipient employee's name"}
        employee: {type: integer, description: "Recipient employee ID (required on create)"}
        receivedTime: {type: string, format: date-time, description: "When the delivery was received (required on create, sortable)"}
        deliveredTime: {type: string, format: date-time, description: "When the delivery was handed off to the recipient"}
        avatar: {type: string, description: "Package photo — see the file field API"}
        signature: {type: string, description: "Recipient signature — see the file field API"}
        trackingNumber: {type: string, description: "Carrier tracking number"}
        deliveryArea: {type: integer, description: "Delivery area ID (required on create)"}
        carrier: {type: string, description: "Carrier name (required on create). Use `GET /picklist/deliveries/carrier` for valid values (e.g. UPS, FedEx, US Postal Service, Amazon, DHL)."}
        moduleState: {type: string, readOnly: true, description: "Status. Use `GET /picklist/deliveries/moduleState` for valid values."}
        approvalStatus: {type: string, readOnly: true, description: "Approval sub-status"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    DeliveryComment:
      type: object
      description: "Delivery comment/note."
      required: [body]
      properties:
        id: {type: integer, readOnly: true, description: "Comment ID"}
        body: {type: string, description: "Comment text content (required on create)"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp"}
        createdBy: {readOnly: true, description: "User who posted the comment", allOf: [{$ref: '#/components/schemas/User'}]}

    # ── Indoor Floor Plan ──

    IndoorFloorPlan:
      type: object
      description: "The visual map of a floor, mapping desks, rooms, and other spaces to on-screen coordinates."
      required: [name, site, building, floor, geometry, properties]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Floor plan name (required on create, sortable)"}
        description: {type: string, description: "Description"}
        site: {type: integer, description: "Site ID (required on create)"}
        building: {type: integer, description: "Building ID (required on create)"}
        floor: {type: integer, description: "Floor ID (required on create)"}
        file: {type: string, description: "Floor plan image/AutoCAD file — see the file field API"}
        floorPlanType: {type: string, description: "Floor plan type, e.g. Workstation, Lockers, Parking"}
        filesource: {type: string, description: "Source file type, e.g. Image, AUTO CAD"}
        width: {type: number, description: "Canvas width"}
        height: {type: number, description: "Canvas height"}
        iconSize: {type: number, description: "Marker icon size"}
        fontSize: {type: number, description: "Label font size"}
        minZoom: {type: number, description: "Minimum zoom level"}
        maxZoom: {type: number, description: "Maximum zoom level"}
        geometry: {type: string, description: "Serialized floor plan geometry (required on create)"}
        properties: {type: string, description: "Serialized floor plan properties (required on create)"}
        customizationJSON: {type: string, description: "Serialized viewer customization JSON"}
        customizationBookingJSON: {type: string, description: "Serialized booking-view customization JSON"}
        startTime: {type: string, format: date-time, description: "Effective start time"}
        endTime: {type: string, format: date-time, description: "Effective end time"}
        isActive: {type: boolean, description: "Whether the floor plan is active"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Space Booking ──

    SpaceBooking:
      type: object
      description: "A reservation of a space, desk, or parking stall for a time window."
      required: [noOfAttendees]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Booking name/subject (sortable)"}
        description: {type: string, description: "Description"}
        bookingStartTime: {type: string, format: date-time, description: "Booking start time (sortable)"}
        bookingEndTime: {type: string, format: date-time, description: "Booking end time (sortable)"}
        space: {type: integer, description: "Space being booked"}
        desk: {type: integer, description: "Desk being booked"}
        parkingStall: {type: integer, description: "Parking stall being booked"}
        host: {type: integer, description: "Hosting employee/person ID"}
        reservedBy: {type: integer, description: "Employee/person who made the reservation"}
        noOfAttendees: {type: integer, description: "Number of attendees (required on create)"}
        internalAttendees: {type: array, items: {type: integer}, description: "Internal attendee employee/person IDs"}
        externalAttendees: {type: array, items: {type: integer}, description: "External attendee IDs"}
        moduleState: {type: string, readOnly: true, description: "Status (pending/booked/checkedIn/checkedOut/cancelled/rejected) — use the `changestatus`, `cancel`, or `extend` actions to transition. Use `GET /picklist/spacebooking/moduleState` for valid values."}
        approvalStatus: {type: string, readOnly: true, description: "Approval sub-status"}
        isCancelled: {type: boolean, readOnly: true, description: "Whether the booking has been cancelled — set via the `cancel` action"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Facility ──

    Facility:
      type: object
      description: "A bookable resource configured for slot-based booking."
      required: [name]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Facility name (required on create, sortable)"}
        description: {type: string, description: "Description"}
        usageGuidance: {type: string, description: "Usage guidance shown to bookers"}
        manager: {type: integer, description: "Person ID managing this facility"}
        location: {type: integer, description: "Site/building/floor/space reference"}
        facilityType: {type: string, description: "Facility type, e.g. Asset, Space, Others"}
        category: {type: integer, description: "Category picklist ID, e.g. Entertainment, Social Gathering, Event, Official"}
        amenities: {type: array, items: {type: integer}, description: "Amenity IDs available at this facility"}
        usageCapacity: {type: integer, description: "Maximum usage capacity"}
        maxAttendeeCountPerBooking: {type: integer, description: "Maximum attendees allowed per booking"}
        isAttendeeListNeeded: {type: boolean, description: "Whether an attendee list is required to book"}
        slotDuration: {type: integer, description: "Slot length in minutes"}
        maxSlotBookingAllowed: {type: integer, description: "Maximum slots a single booking may reserve"}
        isMultiBookingPerSlotAllowed: {type: boolean, description: "Whether multiple bookings can share the same slot"}
        isChargeable: {type: boolean, description: "Whether booking this facility incurs a cost"}
        pricePerSlot: {type: number, description: "Price per slot, when chargeable"}
        securityDeposit: {type: number, description: "Security deposit amount, when chargeable"}
        bookingAdvancePeriodInDays: {type: integer, description: "How many days in advance bookings may be made"}
        allowCancellationBefore: {type: integer, description: "Cancellation window in days before the booking date"}
        slotGeneratedUpto: {type: string, format: date-time, readOnly: true, description: "How far ahead slots have been generated by the scheduled job"}
        moduleState: {type: string, description: "Status. Use `GET /picklist/facility/moduleState` for valid values."}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Amenity ──

    Amenity:
      type: object
      description: "A perk a facility can offer (projector, catering, whiteboard, ...)."
      required: [name]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Amenity name (required on create, sortable)"}
        description: {type: string, description: "Description"}
        category: {type: string, description: "Category, e.g. Utility, Pantry, Housekeeping"}
        amenityLogo: {type: string, description: "Icon/logo identifier"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Facility Weekday Availability ──

    FacilityWeekdayAvailability:
      type: object
      description: "A facility's recurring weekly availability window."
      required: [facility, dayOfWeek, actualStartTime, actualEndTime, startDate, endDate, cost]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        facility: {type: integer, description: "Facility this window applies to (required on create)"}
        dayOfWeek: {type: integer, description: "1=Monday .. 7=Sunday (required on create, sortable)"}
        actualStartTime: {type: integer, description: "Window start, seconds since midnight (required on create)"}
        actualEndTime: {type: integer, description: "Window end, seconds since midnight (required on create)"}
        startDate: {type: string, format: date-time, description: "Date this window becomes effective (required on create, sortable)"}
        endDate: {type: string, format: date-time, description: "Date this window stops applying (required on create)"}
        cost: {type: number, description: "Cost per slot generated from this window (required on create)"}

    # ── Facility Special Availability ──

    FacilitySpecialAvailability:
      type: object
      description: "A date-range override on a facility's normal availability — an extra window or a blackout."
      required: [facility, startDate, endDate, actualStartTime, actualEndTime, cost, remarks]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        facility: {type: integer, description: "Facility this override applies to (required on create)"}
        startDate: {type: string, format: date-time, description: "Override start date (required on create, sortable)"}
        endDate: {type: string, format: date-time, description: "Override end date (required on create)"}
        actualStartTime: {type: integer, description: "Window start, seconds since midnight (required on create)"}
        actualEndTime: {type: integer, description: "Window end, seconds since midnight (required on create)"}
        cost: {type: number, description: "Cost for this override, if different from normal (required on create)"}
        specialType: {type: string, description: "Special Availability (extra window) or Special Unavailability (blackout)"}
        remarks: {type: string, description: "Reason/notes for this override (required on create)"}
        cancelOnCostChange: {type: boolean, default: false, description: "Whether existing bookings should be cancelled if this override changes their cost"}

    # ── Facility Slot ──

    Slot:
      type: object
      description: "A pre-generated bookable time window for a facility. Read-only — produced by a scheduled job."
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        facilityId: {type: integer, readOnly: true, description: "Facility this slot belongs to (sortable)"}
        slotStartTime: {type: string, format: date-time, readOnly: true, description: "Slot start time (sortable)"}
        slotEndTime: {type: string, format: date-time, readOnly: true, description: "Slot end time (sortable)"}
        slotCost: {type: number, readOnly: true, description: "Cost of booking this slot"}
        specialAvailabilityId: {type: integer, readOnly: true, description: "Special-availability rule this slot was generated from, if any"}
        bookingCount: {type: integer, readOnly: true, description: "Number of bookings currently holding this slot"}

    # ── Facility Booking ──

    FacilityBooking:
      type: object
      description: "A slot-based reservation of a facility."
      required: [facility, bookingDate, noOfAttendees, internalAttendees, tenant]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        facility: {type: integer, description: "Facility being booked (required on create)"}
        description: {type: string, description: "Description"}
        bookingtype: {type: string, description: "Booking type, e.g. Permanent, Hotel, Hot"}
        bookingDate: {type: string, format: date-time, description: "Booking date (required on create, sortable)"}
        reservedFor: {type: integer, description: "Person the booking is reserved for"}
        noOfAttendees: {type: integer, description: "Number of attendees (required on create)"}
        internalAttendees: {type: array, items: {type: integer}, description: "Internal attendee person IDs (required on create)"}
        tenant: {type: integer, description: "Tenant ID (required on create)"}
        bookingRequestedBy: {type: integer, description: "User who requested the booking"}
        isCancelled: {type: boolean, readOnly: true, description: "Whether the booking has been cancelled — set via the `cancel` action"}
        canEdit: {type: boolean, readOnly: true, description: "Whether the booking is still editable"}
        bookingAmount: {type: number, readOnly: true, description: "Total cost, computed from the reserved slots"}
        moduleState: {type: string, readOnly: true, description: "Status (Active/Completed/Cancelled/Expired). Use `GET /picklist/facilitybooking/moduleState` for valid values."}
        approvalStatus: {type: string, readOnly: true, description: "Approval sub-status"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Client ──

    Client:
      type: object
      description: "Client organization."
      required: [name, primaryContactEmail]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Client name (required on create, sortable)"}
        description: {type: string, description: "Description"}
        primaryContactName: {type: string, description: "Primary contact name"}
        primaryContactEmail: {type: string, description: "Primary contact email (required on create)"}
        primaryContactPhone: {type: string, description: "Primary contact phone"}
        address: {description: "Client address", allOf: [{$ref: '#/components/schemas/Address'}]}
        moduleState: {type: string, description: "Status — pass `status` value or numeric ID. Use `GET /picklist/client/moduleState` for valid values."}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Client Contact ──

    ClientContact:
      type: object
      description: "Contact person for a client."
      required: [name, client, email]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Contact name (required on create, sortable)"}
        client: {type: integer, description: "Parent client ID (required on create)"}
        email: {type: string, description: "Email address (required on create)"}
        phone: {type: string, description: "Phone number"}
        isPrimaryContact: {type: boolean, description: "Whether this is the primary contact"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Vendor ──

    Vendor:
      type: object
      description: "Vendor or supplier organization."
      required: [name, primaryContactEmail, primaryContactPhone]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Vendor name (required on create, sortable)"}
        description: {type: string, description: "Description"}
        primaryContactName: {type: string, description: "Primary contact name"}
        primaryContactEmail: {type: string, description: "Primary contact email (required on create)"}
        primaryContactPhone: {type: string, description: "Primary contact phone (required on create)"}
        address: {description: "Vendor address", allOf: [{$ref: '#/components/schemas/Address'}]}
        moduleState: {type: string, description: "Status — pass `status` value or numeric ID. Use `GET /picklist/vendors/moduleState` for valid values."}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Vendor Contact ──

    VendorContact:
      type: object
      description: "Contact person for a vendor."
      required: [name, vendor, email]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Contact name (required on create, sortable)"}
        vendor: {type: integer, description: "Parent vendor ID (required on create)"}
        email: {type: string, description: "Email address (required on create)"}
        phone: {type: string, description: "Phone number"}
        isPrimaryContact: {type: boolean, description: "Whether this is the primary contact"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Tenant ──

    Tenant:
      type: object
      description: "Tenant organization."
      required: [name, primaryContactEmail]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Tenant name (required on create, sortable)"}
        description: {type: string, description: "Description"}
        primaryContactName: {type: string, description: "Primary contact name"}
        primaryContactEmail: {type: string, description: "Primary contact email (required on create)"}
        primaryContactPhone: {type: string, description: "Primary contact phone"}
        address: {description: "Tenant address", allOf: [{$ref: '#/components/schemas/Address'}]}
        tenantType: {type: string, description: "Tenant type (e.g. Commercial, Enterprise)"}
        moduleState: {type: string, description: "Status — pass `status` value or numeric ID. Use `GET /picklist/tenant/moduleState` for valid values."}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Tenant Contact ──

    TenantContact:
      type: object
      description: "Contact person for a tenant."
      required: [name, tenant, email]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Contact name (required on create, sortable)"}
        tenant: {type: integer, description: "Parent tenant ID (required on create)"}
        email: {type: string, description: "Email address (required on create)"}
        phone: {type: string, description: "Phone number"}
        isPrimaryContact: {type: boolean, description: "Whether this is the primary contact"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Tenant Unit ──

    TenantUnit:
      type: object
      description: "Physical unit assigned to a tenant. On create, `name` and `site` are required."
      required: [name, site]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Unit name (required on create, sortable)"}
        tenant: {type: integer, description: "Tenant ID"}
        floor: {type: integer, description: "Floor ID"}
        building: {type: integer, description: "Building ID"}
        site: {description: "Site ID (required on create). Pass the id as a number, or an object with `id`."}
        isOccupied: {type: boolean, description: "Whether the unit is occupied"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modified (sortable)"}

    # ── Comment & Attachment ──

    # ── Work Order Comment & Attachment ──

    WorkOrderComment:
      type: object
      description: "Work order comment/note."
      required: [body]
      properties:
        id: {type: integer, readOnly: true, description: "Comment ID"}
        body: {type: string, description: "Comment text content (required on create)"}
        bodyHTML: {type: string, readOnly: true, description: "HTML-formatted comment body"}
        externalId: {type: string, description: "Your external reference ID"}
        notifyRequester: {type: boolean, default: false, description: "Send notification to the requester"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp"}
        createdBy: {readOnly: true, description: "User who posted the comment", allOf: [{$ref: '#/components/schemas/User'}]}

    WorkOrderAttachment:
      type: object
      description: "Work order file attachment."
      properties:
        id: {type: integer, readOnly: true, description: "Attachment ID"}
        fileName: {type: string, readOnly: true, description: "Original file name"}
        fileSize: {type: integer, readOnly: true, description: "File size in bytes"}
        contentType: {type: string, readOnly: true, description: "MIME type (e.g. application/pdf, image/jpeg)"}
        externalId: {type: string, description: "Your external reference ID"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Upload timestamp"}
        createdBy: {readOnly: true, description: "User who uploaded the file", allOf: [{$ref: '#/components/schemas/User'}]}

    WorkOrderTaskPhoto:
      type: object
      description: "Task file attachment with before/after type."
      properties:
        id: {type: integer, readOnly: true}
        fileName: {type: string, readOnly: true}
        fileSize: {type: integer, readOnly: true}
        contentType: {type: string, readOnly: true}
        type: {type: string, enum: [before, after], description: "Photo type"}
        createdTime: {type: string, format: date-time, readOnly: true}

    WorkOrderTask:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        subject: {type: string}
        description: {type: string}
        status: {type: string, enum: [open, closed]}
        createdTime: {type: string, format: date-time, readOnly: true}
        modifiedTime: {type: string, format: date-time, readOnly: true}
        photos:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderTaskPhoto'

    # ── Service Request Comment & Attachment ──

    ServiceRequestComment:
      type: object
      description: "Service request comment/note."
      required: [body]
      properties:
        id: {type: integer, readOnly: true, description: "Comment ID"}
        body: {type: string, description: "Comment text content (required on create)"}
        bodyHTML: {type: string, readOnly: true, description: "HTML-formatted comment body"}
        externalId: {type: string, description: "Your external reference ID"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp"}
        createdBy: {readOnly: true, description: "User who posted the comment", allOf: [{$ref: '#/components/schemas/User'}]}

    ServiceRequestAttachment:
      type: object
      description: "Service request file attachment."
      properties:
        id: {type: integer, readOnly: true, description: "Attachment ID"}
        fileName: {type: string, readOnly: true, description: "Original file name"}
        fileSize: {type: integer, readOnly: true, description: "File size in bytes"}
        contentType: {type: string, readOnly: true, description: "MIME type (e.g. application/pdf, image/jpeg)"}
        externalId: {type: string, description: "Your external reference ID"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Upload timestamp"}
        createdBy: {readOnly: true, description: "User who uploaded the file", allOf: [{$ref: '#/components/schemas/User'}]}

    # ── Item Type ──

    ItemType:
      type: object
