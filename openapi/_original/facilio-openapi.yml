        sellingPrice: {type: number, format: double, description: "Selling price"}
        duration: {type: number, format: double, description: "Duration in hours"}
        paymentType: {type: string, enum: [Fixed, Hourly], description: "Payment type"}
        sysCreatedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    # ── Storeroom ──

    Storeroom:
      type: object
      description: "Warehouse location."
      required: [name, site]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        name: {type: string, maxLength: 255, description: "Storeroom name (required, sortable)"}
        description: {type: string, maxLength: 2000, description: "Description"}
        site: {type: integer, description: "Site ID (required). Returns {id, name} on GET."}
        location: {readOnly: true, description: "Address derived from site", allOf: [{$ref: '#/components/schemas/Address'}]}
        servingsites: {type: array, items: {type: object}, description: "Sites served by this storeroom. Pass as [{id: x}]."}
        noOfItemTypes: {type: integer, readOnly: true, description: "Number of item types (sortable)"}
        noOfToolTypes: {type: integer, readOnly: true, description: "Number of tool types (sortable)"}
        itemTotalCost: {type: number, format: double, readOnly: true, description: "Total item cost (sortable)"}
        toolTotalCost: {type: number, format: double, readOnly: true, description: "Total tool cost (sortable)"}
        isApprovalNeeded: {type: boolean, description: "Whether issuance requires approval"}
        isGatePassRequired: {type: boolean, description: "Whether gate pass is required"}
        owner: {type: integer, description: "Owner user ID. Expanded per `users` when returned on GET/create/update."}
        lastPurchasedDate: {type: string, format: date, readOnly: true, description: "Last purchase date"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    # ── Quote ──

    Quote:
      type: object
      description: "Quote with line items."
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        localId: {type: integer, readOnly: true, description: "Sequential quote number (sortable)"}
        subject: {type: string, maxLength: 255, description: "Quote subject (sortable)"}
        description: {type: string, maxLength: 2000, description: "Quote description"}
        moduleState: {type: string, description: "Status — pass `status` value (e.g. 'Draft', 'Sent') or numeric ID. Use `GET /picklist/quote/moduleState` for valid values."}
        customerType: {type: string, enum: [Vendor, Client, Tenant], description: "Customer type"}
        vendor: {type: integer, description: "Vendor ID"}
        client: {type: integer, description: "Client ID"}
        tenant: {type: integer, description: "Tenant ID"}
        contact: {type: integer, description: "Contact ID"}
        billToAddress: {description: "Billing address", allOf: [{$ref: '#/components/schemas/Address'}]}
        shipToAddress: {description: "Shipping address", allOf: [{$ref: '#/components/schemas/Address'}]}
        billDate: {type: string, format: date-time, description: "Bill date (sortable)"}
        expiryDate: {type: string, format: date-time, description: "Expiry date (sortable)"}
        siteId: {type: integer, description: "Site ID"}
        subTotal: {type: number, format: double, readOnly: true, description: "Subtotal before tax"}
        totalCost: {type: number, format: double, readOnly: true, description: "Total cost including tax"}
        totalTaxAmount: {type: number, format: double, readOnly: true, description: "Total tax amount"}
        revisionNumber: {type: integer, readOnly: true, description: "Revision number"}
        workorder: {type: integer, description: "Related work order ID"}
        notes: {type: string, maxLength: 2000, description: "Additional notes"}
        lineItems:
          type: array
          description: "Line items. `type` values: Item Type, Tool Type, Service, Labour, Others."
          items: {$ref: '#/components/schemas/QuoteLineItem'}
        sysCreatedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    QuoteLineItem:
      type: object
      description: "Quote line item."
      properties:
        id: {type: integer, readOnly: true, description: "Line item ID. Include on PATCH to update; omit to create new."}
        type: {type: string, enum: [Item Type, Tool Type, Service, Labour, Others], description: "Line item type"}
        description: {type: string, maxLength: 2000, description: "Line item description"}
        quantity: {type: number, format: double, description: "Quantity"}
        unitPrice: {type: number, format: double, description: "Unit price"}
        cost: {type: number, format: double, description: "Total cost (quantity x unitPrice)"}
        taxAmount: {type: number, format: double, description: "Tax amount"}
        unitOfMeasure: {type: string, maxLength: 255, description: "Unit of measure"}
        itemType: {type: object, description: "{id} — required when type is Item Type"}
        toolType: {type: object, description: "{id} — required when type is Tool Type"}
        service: {type: object, description: "{id} — required when type is Service"}
        labour: {type: object, description: "{id} — required when type is Labour"}
        tax: {type: object, description: "{id} — tax group reference"}

    # ── Invoice ──

    Invoice:
      type: object
      description: "Invoice with line items."
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        localId: {type: integer, readOnly: true, description: "Sequential number (sortable)"}
        invoiceNumber: {type: string, readOnly: true, description: "Invoice number (sortable)"}
        subject: {type: string, maxLength: 255, description: "Invoice subject"}
        description: {type: string, maxLength: 2000, description: "Invoice description"}
        notes: {type: string, maxLength: 2000, description: "Additional notes"}
        quote: {type: integer, description: "Source quote ID"}
        vendor: {type: integer, description: "Vendor ID"}
        client: {type: integer, description: "Client ID"}
        tenant: {type: integer, description: "Tenant ID"}
        workorder: {type: integer, description: "Related work order ID"}
        approvers: {type: array, items: {type: object}, readOnly: true, description: "Approver list"}
        billToAddress: {description: "Billing address", allOf: [{$ref: '#/components/schemas/Address'}]}
        shipToAddress: {description: "Shipping address", allOf: [{$ref: '#/components/schemas/Address'}]}
        billDate: {type: string, format: date, description: "Bill date (sortable)"}
        expiryDate: {type: string, format: date, description: "Expiry date (sortable)"}
        subTotal: {type: number, format: double, readOnly: true, description: "Subtotal before tax"}
        totalCost: {type: number, format: double, readOnly: true, description: "Total cost including tax"}
        totalTaxAmount: {type: number, format: double, readOnly: true, description: "Total tax amount"}
        invoiceType: {type: string, enum: [Vendor, Client, Tenant], description: "Invoice type"}
        invoiceStatus: {type: string, description: "Invoice status — pass display name (e.g. 'Draft', 'Invoice Delivered') or numeric ID. Use `GET /picklist/invoice/invoiceStatus` for valid values."}
        revisionNumber: {type: integer, readOnly: true, description: "Revision number"}
        invoiceVersion: {type: number, readOnly: true, description: "Version number"}
        lineItems:
          type: array
          description: "Line items. `type` values: Item Type, Tool Type, Service, Labour, Others."
          items: {$ref: '#/components/schemas/InvoiceLineItem'}
        sysCreatedByPeople: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedByPeople: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    InvoiceLineItem:
      type: object
      description: "Invoice line item."
      properties:
        id: {type: integer, readOnly: true, description: "Line item ID. Include on PATCH to update; omit to create new."}
        type: {type: string, enum: [Item Type, Tool Type, Service, Labour, Others], description: "Line item type"}
        description: {type: string, maxLength: 2000, description: "Line item description"}
        quantity: {type: number, format: double, description: "Quantity"}
        unitPrice: {type: number, format: double, description: "Unit price"}
        cost: {type: number, format: double, description: "Total cost (quantity x unitPrice)"}
        taxAmount: {type: number, format: double, description: "Tax amount"}
        unitOfMeasure: {type: string, maxLength: 255, description: "Unit of measure"}
        itemType: {type: object, description: "{id} — required when type is Item Type"}
        toolType: {type: object, description: "{id} — required when type is Tool Type"}
        service: {type: object, description: "{id} — required when type is Service"}
        labour: {type: object, description: "{id} — required when type is Labour"}
        tax: {type: object, description: "{id} — tax group reference"}

    # ── Purchase Request ──

    PurchaseRequest:
      type: object
      description: "Purchase request with line items."
      required: [name]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        localId: {type: integer, readOnly: true, description: "Sequential number (sortable)"}
        name: {type: string, maxLength: 255, description: "PR name (required, sortable)"}
        description: {type: string, maxLength: 2000, description: "Description"}
        moduleState: {type: string, description: "Status — pass `status` value (e.g. 'Draft', 'Approved') or numeric ID. Use `GET /picklist/purchaserequest/moduleState` for valid values."}
        vendor: {type: integer, description: "Vendor ID"}
        storeRoom: {type: integer, description: "Storeroom ID"}
        requestedBy: {type: integer, description: "Requester user ID"}
        requestedTime: {type: string, format: date, description: "Request date (sortable)"}
        requiredTime: {type: string, format: date, description: "Required by date (sortable)"}
        subTotal: {type: number, format: double, readOnly: true, description: "Subtotal before tax"}
        totalCost: {type: number, format: double, readOnly: true, description: "Total cost including tax"}
        totalTaxAmount: {type: number, format: double, readOnly: true, description: "Total tax amount"}
        isPoCreated: {type: boolean, readOnly: true, description: "Whether a PO has been created"}
        lineItems:
          type: array
          description: "Line items. `inventoryType` values: Item, Tool, Service, Others."
          items: {$ref: '#/components/schemas/PurchaseRequestLineItem'}
        sysCreatedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    PurchaseRequestLineItem:
      type: object
      description: "Purchase request line item."
      properties:
        id: {type: integer, readOnly: true, description: "Line item ID. Include on PATCH to update; omit to create new."}
        inventoryType: {type: string, enum: [Item, Tool, Service, Others], description: "Inventory type"}
        description: {type: string, maxLength: 2000, description: "Line item description"}
        quantity: {type: number, format: double, description: "Quantity"}
        unitPrice: {type: number, format: double, description: "Unit price"}
        cost: {type: number, format: double, description: "Total cost (quantity x unitPrice)"}
        taxAmount: {type: number, format: double, description: "Tax amount"}
        unitOfMeasure: {type: string, maxLength: 255, description: "Unit of measure"}
        itemType: {type: object, description: "{id} — required when inventoryType is Item"}
        toolType: {type: object, description: "{id} — required when inventoryType is Tool"}
        service: {type: object, description: "{id} — required when inventoryType is Service"}
        tax: {type: object, description: "{id} — tax group reference"}

    # ── Receivable / stocking / adjustments (V5) ──

    Receipt:
      type: object
      description: |
        Receipt line for `POST /receivable/{id}/addreceipt` (sent inside request `data`).
        Responses include read-only fields such as `id`, `receivableId`, `status`, and `receiptTime`.
      required: [lineItem, quantity]
      properties:
        lineItem:
          description: "Purchase order line item id — pass the number directly (object with `id` is also accepted)."
        quantity: {type: number, format: double, minimum: 0}
        bin: {description: "Optional bin id or name object for receipt routing"}
        remarks: {type: string}
        noOfSerialNumbers:
          type: integer
          minimum: 0
          description: "Optional. Use only when the PO line requires serial capture; omit for standard lines."

    POLineItemStock:
      type: object
      description: One line in `POST /receivable/{id}/stock` (`lineItems` or `lineItemsStockQuantity`). Pass line, receipt, and lot as numeric ids where possible; use a string or id/name object for bin.
      properties:
        lineItem: {description: "Purchase order line id — numeric, or object with `id`."}
        quantity: {type: number, format: double}
        receipt: {description: "Receipt record id — numeric, or object with `id`."}
        bin: {description: "Storeroom bin — bin name as a string, or object with `id` and/or `name`."}
        lot: {description: "Lot id when the line is lot-tracked — numeric, or object with `id`."}
        stockedBy: {type: object, description: "Optional user reference, e.g. object with `id`."}

    ItemAdjustment:
      type: object
      required: [adjustmentType, quantity, itemType, storeRoom]
      properties:
        adjustmentType: {type: string, description: "`increase` or `decrease` (case-insensitive)"}
        quantity: {type: number, format: double, minimum: 0, exclusiveMinimum: true}
        itemType: {description: "Item type id — pass the number directly (object with `id` is also accepted)."}
        storeRoom: {description: "Storeroom id — pass the number directly (object with `id` is also accepted)."}
        bin: {description: "Optional bin — pass the bin name as a string, the bin id as a number, or an object with `id` or `name`."}
        unitCost: {type: number, format: double, description: "Increase only — purchased item unit cost"}
        unitPrice: {type: number, format: double, description: "Alias of `unitCost` on increase"}
        purchasedDate: {description: "Epoch ms (number) or ISO date string — `costDate` on purchased item (increase)"}
        remarks: {type: string}

    ToolAdjustment:
      type: object
      required: [adjustmentType, quantity, toolType, storeRoom]
      properties:
        adjustmentType: {type: string, description: "`increase` or `decrease`"}
        quantity: {type: number, format: double, minimum: 0, exclusiveMinimum: true}
        toolType: {description: "Tool type id — pass the number directly (object with `id` is also accepted)."}
        storeRoom: {description: "Storeroom id — pass the number directly (object with `id` is also accepted)."}
        bin: {description: "Optional bin — bin name as a string, bin id as a number, or an object with `id` or `name`."}
        unitPrice: {type: number, format: double, description: "Increase only — purchased tool unit price"}
        purchasedDate: {description: "Epoch ms or ISO string for purchasedTool costDate on increase"}
        remarks: {type: string}

    # ── Purchase Order ──

    PurchaseOrder:
      type: object
      description: "Purchase order with line items."
      required: [name]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        localId: {type: integer, readOnly: true, description: "Sequential number (sortable)"}
        name: {type: string, maxLength: 255, description: "PO name (required, sortable)"}
        description: {type: string, maxLength: 2000, description: "Description"}
        moduleState: {type: string, description: "Status — pass `status` value (e.g. 'Draft', 'Approved') or numeric ID. Use `GET /picklist/purchaseorder/moduleState` for valid values."}
        vendor: {type: integer, description: "Vendor ID"}
        storeRoom: {type: integer, description: "Storeroom ID"}
        requestedBy: {type: integer, description: "Requester user ID"}
        orderedTime: {type: string, format: date, description: "Order date (sortable)"}
        requiredTime: {type: string, format: date, description: "Required by date (sortable)"}
        completedTime: {type: string, format: date, description: "Completion date"}
        subTotal: {type: number, format: double, readOnly: true, description: "Subtotal before tax"}
        totalCost: {type: number, format: double, readOnly: true, description: "Total cost including tax"}
        totalTaxAmount: {type: number, format: double, readOnly: true, description: "Total tax amount"}
        totalQuantity: {type: number, format: double, readOnly: true, description: "Total ordered quantity"}
        quantityReceived: {type: number, format: double, readOnly: true, description: "Total received quantity"}
        receivableStatus: {type: string, readOnly: true, description: "Receiving status (e.g. Yet To Receive, Partially Received)"}
        lineItems:
          type: array
          description: "Line items. `inventoryType` values: Item, Tool, Service, Others."
          items: {$ref: '#/components/schemas/PurchaseOrderLineItem'}
        sysCreatedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    PurchaseOrderLineItem:
      type: object
      description: "Purchase order line item."
      properties:
        id: {type: integer, readOnly: true, description: "Line item ID. Include on PATCH to update; omit to create new."}
        inventoryType: {type: string, enum: [Item, Tool, Service, Others], description: "Inventory type"}
        description: {type: string, maxLength: 2000, description: "Line item description"}
        quantity: {type: number, format: double, description: "Quantity"}
        quantityReceived: {type: number, format: double, readOnly: true, description: "Quantity received on this line (from receiving / receipts)."}
        quantityStocked: {type: number, format: double, readOnly: true, description: "Quantity posted into storeroom inventory from this line."}
        noOfSerialNumbers: {type: integer, readOnly: true, description: "Serial capture count when the line uses serials."}
        quantityUsed: {type: number, format: double, readOnly: true, description: "Quantity used/consumed when tracked for this line."}
        unitPrice: {type: number, format: double, description: "Unit price"}
        cost: {type: number, format: double, description: "Total cost (quantity x unitPrice)"}
        taxAmount: {type: number, format: double, description: "Tax amount"}
        unitOfMeasure: {type: string, maxLength: 255, description: "Unit of measure"}
        itemType: {type: object, description: "{id} — required when inventoryType is Item"}
        toolType: {type: object, description: "{id} — required when inventoryType is Tool"}
        service: {type: object, description: "{id} — required when inventoryType is Service"}
        tax: {type: object, description: "{id} — tax group reference"}
        referenceId: {type: string, maxLength: 255, description: "Optional client reference for the line (e.g. stable id across PO updates)."}

    # ── Inventory Request ──

    InventoryRequest:
      type: object
      description: "Inventory request with line items."
      required: [name, storeRoom, workorder]
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        localId: {type: integer, readOnly: true, description: "Sequential number (sortable)"}
        name: {type: string, maxLength: 255, description: "IR name (required, sortable)"}
        description: {type: string, maxLength: 2000, description: "Description"}
        moduleState: {type: string, description: "Status — pass `status` value (e.g. 'Pending', 'Fully Reserved') or numeric ID. Use `GET /picklist/inventoryrequest/moduleState` for valid values."}
        requestedBy: {type: integer, description: "Requester user ID"}
        requestedFor: {type: integer, description: "Requested-for user ID"}
        storeRoom: {type: integer, description: "Storeroom ID (required)"}
        workorder: {type: integer, description: "Work order ID (required)"}
        requestedTime: {type: string, format: date, description: "Request date (sortable)"}
        requiredTime: {type: string, format: date, description: "Required by date (sortable)"}
        isIssued: {type: boolean, readOnly: true, description: "Whether items have been issued"}
        lineItems:
          type: array
          description: "Line items. `inventoryType` values: Item, Tool."
          items: {$ref: '#/components/schemas/InventoryRequestLineItem'}
        sysCreatedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedBy: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    InventoryRequestLineItem:
      type: object
      description: "Inventory request line item."
      properties:
        id: {type: integer, readOnly: true, description: "Line item ID. Include on PATCH to update; omit to create new."}
        inventoryType: {type: string, enum: [Item, Tool], description: "Inventory type"}
        quantity: {type: number, format: double, description: "Requested quantity"}
        itemType: {type: object, description: "{id} — required when inventoryType is Item"}
        toolType: {type: object, description: "{id} — required when inventoryType is Tool"}
        storeRoom: {type: object, description: "{id} — storeroom for this line item"}
        issuedQuantity: {type: number, format: double, readOnly: true, description: "Quantity issued"}
        lineItemStatus: {type: string, readOnly: true, description: "Reservation status (e.g. Reserved)"}

    # ── Vendor Credit ──

    VendorCredit:
      type: object
      description: "Vendor credit note with line items."
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        localId: {type: integer, readOnly: true, description: "Sequential number (sortable)"}
        creditNumber: {type: string, readOnly: true, description: "Credit note number (sortable)"}
        subject: {type: string, maxLength: 255, description: "Credit note subject"}
        description: {type: string, maxLength: 2000, description: "Credit note description"}
        notes: {type: string, maxLength: 2000, description: "Customer notes"}
        vendor: {type: object, description: "{id} — Vendor reference"}
        vendorContract: {type: object, description: "{id} — Vendor contract reference"}
        invoices: {type: array, items: {type: object}, description: "Associated invoices — array of {id}"}
        site: {type: object, description: "{id} — Site reference"}
        contact: {type: object, description: "{id} — Contact person reference"}
        billToAddress: {description: "Billing address", allOf: [{$ref: '#/components/schemas/Address'}]}
        issueDate: {type: string, format: date, description: "Issue date (sortable)"}
        expiryDate: {type: string, format: date, description: "Expiry date (sortable)"}
        subTotal: {type: number, format: double, readOnly: true, description: "Subtotal before tax"}
        totalCost: {type: number, format: double, readOnly: true, description: "Total cost including tax"}
        totalTaxAmount: {type: number, format: double, readOnly: true, description: "Total tax amount"}
        discountAmount: {type: number, format: double, description: "Discount amount"}
        discountPercentage: {type: number, format: double, description: "Discount percentage"}
        vendorCreditNoteStatus: {type: string, description: "Status — pass display name (e.g. 'Awaiting Refund', 'Refunded') or numeric ID. Use `GET /picklist/vendorCredit/vendorCreditNoteStatus` for valid values."}
        revisionNumber: {type: integer, readOnly: true, description: "Revision number"}
        lineItems:
          type: array
          description: "Line items. `type` values: Service, Others."
          items: {$ref: '#/components/schemas/CreditNoteLineItem'}
        sysCreatedByPeople: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedByPeople: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    # ── Client Credit ──

    ClientCredit:
      type: object
      description: "Client credit note with line items."
      properties:
        id: {type: integer, readOnly: true, description: "Unique record ID"}
        localId: {type: integer, readOnly: true, description: "Sequential number (sortable)"}
        creditNumber: {type: string, readOnly: true, description: "Credit note number (sortable)"}
        subject: {type: string, maxLength: 255, description: "Credit note subject"}
        description: {type: string, maxLength: 2000, description: "Credit note description"}
        notes: {type: string, maxLength: 2000, description: "Customer notes"}
        client: {type: object, description: "{id} — Client reference"}
        clientContract: {type: object, description: "{id} — Client contract reference"}
        invoices: {type: array, items: {type: object}, description: "Associated invoices — array of {id}"}
        site: {type: object, description: "{id} — Site reference"}
        contact: {type: object, description: "{id} — Contact person reference"}
        billToAddress: {description: "Billing address", allOf: [{$ref: '#/components/schemas/Address'}]}
        issueDate: {type: string, format: date, description: "Issue date (sortable)"}
        expiryDate: {type: string, format: date, description: "Expiry date (sortable)"}
        subTotal: {type: number, format: double, readOnly: true, description: "Subtotal before tax"}
        totalCost: {type: number, format: double, readOnly: true, description: "Total cost including tax"}
        totalTaxAmount: {type: number, format: double, readOnly: true, description: "Total tax amount"}
        discountAmount: {type: number, format: double, description: "Discount amount"}
        discountPercentage: {type: number, format: double, description: "Discount percentage"}
        clientCreditNoteStatus: {type: string, description: "Status — pass display name (e.g. 'Awaiting Refund', 'Refunded') or numeric ID. Use `GET /picklist/clientCredit/clientCreditNoteStatus` for valid values."}
        revisionNumber: {type: integer, readOnly: true, description: "Revision number"}
        lineItems:
          type: array
          description: "Line items. `type` values: Service, Others."
          items: {$ref: '#/components/schemas/CreditNoteLineItem'}
        sysCreatedByPeople: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Created (sortable)"}
        sysModifiedByPeople: {readOnly: true, allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Modified (sortable)"}

    # ── Credit Note Line Item ──

    CreditNoteLineItem:
      type: object
      description: "Credit note line item."
      properties:
        id: {type: integer, readOnly: true, description: "Line item ID. Include on PATCH to update; omit to create new."}
        type: {type: string, enum: [Service, Others], description: "Line item type"}
        description: {type: string, maxLength: 2000, description: "Line item description"}
        quantity: {type: number, format: double, description: "Quantity"}
        unitPrice: {type: number, format: double, description: "Unit price"}
        cost: {type: number, format: double, description: "Total cost (quantity x unitPrice)"}
        taxAmount: {type: number, format: double, description: "Tax amount"}
        unitOfMeasure: {type: string, maxLength: 255, description: "Unit of measure"}
        service: {type: object, description: "{id} — required when type is Service"}
        tax: {type: object, description: "{id} — tax group reference"}
        reason: {type: string, enum: ["Invoice payment received in Advance", "Expected hours/units of service not met", "Service not provided"], description: "Reason for credit"}

    # ── Work Permit ──

    WorkPermit:
      type: object
      description: "Work permit. Custom fields: `{field_name}_workpermit`. On create, `name`, `expectedEndTime`, and `siteId` are required. Lifecycle fields (`permitStatus`, `isPreValidationDone`, `isPostValidationDone`) are read-only — advance them via the lifecycle actions. Lookup fields accept an ID (or `{id}`) on write and return `{id, name}` (users return `{id, name, email}`) on GET. Picklist fields accept a display value or an ID."
      required: [name, expectedEndTime, siteId]
      properties:
        id: {type: integer, format: int64, readOnly: true, description: "Unique record ID"}
        localId: {type: integer, readOnly: true, description: "Auto-generated per-permit sequential number (sortable)"}
        name: {type: string, description: "Permit title (required on create, sortable)"}
        description: {type: string, description: "Description of the work to be carried out"}
        expectedStartTime: {type: string, format: date-time, description: "Planned start time (sortable)"}
        expectedEndTime: {type: string, format: date-time, description: "Planned end time (required on create, sortable)"}
        workType: {type: string, description: "Work type — picklist value or ID"}
        permitType: {type: string, description: "Permit classification — picklist value or ID"}
        workPermitType: {type: string, description: "Work permit type — pass the `type` value (e.g. 'Hot Work') or numeric ID. Drives which checklist templates are applied on create. Use `GET /picklist/workpermit/workPermitType` for valid values."}
        vendor: {type: integer, description: "Vendor ID carrying out the work"}
        vendorContact: {type: integer, description: "Vendor contact ID"}
        ticket: {type: integer, description: "Related work order / ticket ID"}
        requestedBy: {type: integer, description: "Requester user ID"}
        issuedToUser: {type: integer, description: "User the permit is issued to"}
        people: {type: integer, description: "Person reference associated with the permit"}
        space: {type: integer, description: "Space ID where the work is performed"}
        tenant: {type: integer, description: "Tenant ID"}
        siteId: {type: integer, description: "Site where the permit is raised (required on create)"}
        moduleState: {type: string, description: "Workflow state — advance via `POST /workpermit/{id}/changestatus`"}
        approvalStatus: {type: string, description: "Approval status"}
        isRecurring: {type: boolean, description: "Whether this is a recurring permit"}
        permitStatus: {type: string, readOnly: true, description: "Lifecycle status (New → Pre Requisites Filled → Pre Validation Done → Post Requisites Filled → Post Validation Done). Advance via the lifecycle actions, not PATCH."}
        isPreValidationDone: {type: boolean, readOnly: true, description: "Set when pre-requisites are reviewed"}
        isPostValidationDone: {type: boolean, readOnly: true, description: "Set when post-requisites are reviewed"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modification timestamp (sortable)"}
        sysCreatedBy: {readOnly: true, description: "User who created the permit", allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedBy: {readOnly: true, description: "User who last modified the permit", allOf: [{$ref: '#/components/schemas/User'}]}
      additionalProperties:
        description: "Custom fields (e.g. {field_name}_workpermit)"

    WorkPermitComment:
      type: object
      description: "Work permit comment/note."
      required: [body]
      properties:
        id: {type: integer, readOnly: true, description: "Comment ID"}
        body: {type: string, description: "Comment text content (required on create)"}
        bodyHTML: {type: string, readOnly: true, description: "HTML-formatted comment body"}
        externalId: {type: string, description: "Your external reference ID"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp"}
        createdBy: {readOnly: true, description: "User who posted the comment", allOf: [{$ref: '#/components/schemas/User'}]}

    WorkPermitAttachment:
      type: object
      description: "Work permit file attachment."
      properties:
        id: {type: integer, readOnly: true, description: "Attachment ID"}
        fileName: {type: string, readOnly: true, description: "Original file name"}
        fileSize: {type: integer, readOnly: true, description: "File size in bytes"}
        contentType: {type: string, readOnly: true, description: "MIME type (e.g. application/pdf, image/jpeg)"}
        externalId: {type: string, description: "Your external reference ID"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Upload timestamp"}
        createdBy: {readOnly: true, description: "User who uploaded the file", allOf: [{$ref: '#/components/schemas/User'}]}

    WorkPermitChecklist:
      type: object
      description: "A filled checklist item on a permit. Auto-created from the permit type's templates when the permit is created — no create/delete; update to fill (`remarks`) or review (`isReviewed`, `reviewerRemarks`)."
      properties:
        id: {type: integer, readOnly: true, description: "Checklist item ID"}
        workPermit: {readOnly: true, description: "Parent permit — returns {id}"}
        checklist: {readOnly: true, description: "Source template item — returns {id, name}"}
        required: {type: boolean, readOnly: true, description: "Whether this item is mandatory"}
        isReviewed: {type: boolean, description: "Whether the item has been reviewed"}
        remarks: {type: string, description: "Remarks captured while filling the item"}
        reviewerRemarks: {type: string, description: "Remarks captured while reviewing the item"}
        noOfAttachments: {type: integer, readOnly: true, description: "Number of attachments on the item"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modification timestamp (sortable)"}

    WorkPermitTypeChecklist:
      type: object
      description: "Read-only. A checklist item template configured on a permit type."
      properties:
        id: {type: integer, readOnly: true, description: "Template item ID"}
        item: {type: string, readOnly: true, description: "Checklist item text (sortable)"}
        description: {type: string, readOnly: true, description: "Item description"}
        linkName: {type: string, readOnly: true, description: "Stable link name / key (sortable)"}
        workPermitType: {readOnly: true, description: "Permit type this template belongs to — returns {id, name} (sortable)"}
        validationType: {type: string, readOnly: true, description: "Phase the item applies to (e.g. Pre, Post)"}
        category: {readOnly: true, description: "Checklist category — returns {id, name}"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modification timestamp (sortable)"}

    WorkPermitTypeChecklistCategory:
      type: object
      description: "Read-only. Groups permit-type checklist templates, each scoped to a validationType (Pre/Post)."
      properties:
        id: {type: integer, readOnly: true, description: "Category ID"}
        name: {type: string, readOnly: true, description: "Category name (sortable)"}
        description: {type: string, readOnly: true, description: "Category description"}
        linkName: {type: string, readOnly: true, description: "Stable link name / key (sortable)"}
        workPermitType: {readOnly: true, description: "Permit type this category belongs to — returns {id, name} (sortable)"}
        validationType: {type: string, readOnly: true, description: "Phase the category applies to (e.g. Pre, Post)"}

    WorkPermitType:
      type: object
      description: "Picklist response for work permit types (`GET /picklist/workpermit/workPermitType`)."
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              type: {type: string, description: "Permit type name (e.g. Hot Work, Confined Space)"}
              description: {type: string}
              linkName: {type: string}

    # ── Job Plan ──

    JobPlan:
      type: object
      description: "Job plan — a reusable task template. Custom fields: `{field_name}_jobplan`. On create, `name` and `jobPlanCategory` are required; sections/tasks are sent under `jobplansection`. Lifecycle fields (`jpStatus`, `jobPlanVersion`, `group`) are read-only and managed by the revise/publish/clone actions."
      required: [name, jobPlanCategory]
      properties:
        id: {type: integer, format: int64, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Job plan name (required, sortable)"}
        jobPlanCategory: {type: string, enum: [Assets, Spaces, "Asset Category", "Space Category", Buildings, Sites, Floors, General], description: "Scope/assignment type (required). For 'Asset Category' / 'Space Category', also supply the matching assetCategory / spaceCategory."}
        assetCategory: {type: integer, description: "Asset category ID — required when jobPlanCategory is 'Asset Category'. Returns {id, name} on GET."}
        spaceCategory: {type: integer, description: "Space category ID — required when jobPlanCategory is 'Space Category'. Returns {id, name} on GET."}
        unitOfMeasure: {type: string, description: "Unit of measure label"}
        content: {type: string, description: "Rich content / instructions"}
        notes: {type: string, description: "Free-text notes"}
        jobplansection:
          type: array
          description: "Ordered task sections. Sent on create/update (full replace) and embedded on single-record GET. Each section must contain at least one task."
          items:
            $ref: '#/components/schemas/JobPlanSection'
        isSfg: {type: boolean, description: "Whether this plan is sourced from SFG20"}
        sfgType: {type: string, description: "SFG20 type"}
        sfgCode: {type: string, description: "SFG20 schedule code"}
        sfgVersion: {type: string, description: "SFG20 version"}
        sfgLegislations: {type: string, description: "SFG20 legislation references"}
        scheduleId: {type: string, description: "SFG20 schedule identifier"}
        regimeId: {type: string, description: "SFG20 regime identifier"}
        isTaskFrequencyType: {type: boolean, description: "Whether tasks carry their own frequency"}
        jpStatus: {type: string, readOnly: true, description: "Lifecycle status (Inactive, Active, Pending Revision, Revised) — managed by the revise/publish actions (sortable)"}
        jobPlanVersion: {type: integer, readOnly: true, description: "Version number within the lineage (sortable)"}
        group: {readOnly: true, description: "Lineage reference shared across versions — returns {id}"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modification timestamp (sortable)"}
        sysCreatedBy: {readOnly: true, description: "User who created the plan", allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedBy: {readOnly: true, description: "User who last modified the plan", allOf: [{$ref: '#/components/schemas/User'}]}
      additionalProperties:
        description: "Custom fields (e.g. {field_name}_jobplan)"

    JobPlanSection:
      type: object
      description: "A task section within a job plan."
      required: [name, tasks]
      properties:
        id: {type: integer, readOnly: true, description: "Section ID (server-assigned)"}
        name: {type: string, description: "Section name"}
        sequenceNumber: {type: integer, description: "Display order (defaults by array position when omitted)"}
        inputType: {type: string, description: "Optional section-level input type"}
        tasks:
          type: array
          description: "Tasks in the section (at least one required)"
          items:
            $ref: '#/components/schemas/JobPlanTask'

    JobPlanTask:
      type: object
      description: "A task within a job plan section. On write, `id`/`sequenceNumber` are server-managed (tasks are recreated and renumbered per section). Enum fields accept a name or numeric ID — discover valid values via `GET /jobplan/taskmetadata`."
      required: [name]
      properties:
        id: {type: integer, readOnly: true, description: "Task ID (server-assigned)"}
        name: {type: string, description: "Task title (stored as subject)"}
        sequenceNumber: {type: integer, readOnly: true, description: "Display order within the section (server-managed)"}
        inputType: {type: string, enum: [NONE, READING, TEXT, NUMBER, RADIO, BOOLEAN], description: "Task input type"}
        options:
          type: array
          items: {type: string}
          description: "Choices for a RADIO task (plain string list)"
        remarksRequired: {type: boolean, description: "Require remarks when completing the task"}
        attachmentRequired: {type: boolean, description: "Require an attachment when completing the task"}
        defaultValue: {type: string, description: "Default value"}
        failureValue: {type: string, description: "Value that marks the task as failed"}
        validation: {type: boolean, description: "Enable safe-limit validation (NUMBER/READING)"}
        minSafeLimit: {type: number, description: "Minimum safe value (NUMBER/READING)"}
        maxSafeLimit: {type: number, description: "Maximum safe value (NUMBER/READING)"}
        createWoOnFailure: {type: boolean, description: "Raise a work order when the task fails"}
        enableInput: {type: boolean, readOnly: true, description: "Derived from inputType (true for Text/Numeric/Option tasks)"}
        taskFrequency: {type: string, description: "Task frequency — enum name or ID (see taskmetadata)"}
        frequencyInterval: {type: integer, description: "Interval count for the frequency"}
        taskCriticality: {type: string, description: "Criticality — enum name or ID (see taskmetadata)"}
        skillSet: {type: string, description: "Required skill set — enum name, ID, or {id} (see taskmetadata)"}
        metricId: {type: string, description: "Metric — enum name (e.g. PRESSURE) or ID; for READING/NUMBER tasks (see taskmetadata)"}
        unitId: {type: string, description: "Unit — enum name (e.g. PASCAL) or ID; must belong to the chosen metric (see taskmetadata)"}
        notes: {type: string, description: "Task notes"}
        actionContent: {type: string, description: "Action instructions"}

    JobPlanComment:
      type: object
      description: "Job plan comment/note."
      required: [body]
      properties:
        id: {type: integer, readOnly: true, description: "Comment ID"}
        body: {type: string, description: "Comment text content (required on create)"}
        bodyHTML: {type: string, readOnly: true, description: "HTML-formatted comment body"}
        externalId: {type: string, description: "Your external reference ID"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp"}
        createdBy: {readOnly: true, description: "User who posted the comment", allOf: [{$ref: '#/components/schemas/User'}]}

    JobPlanAttachment:
      type: object
      description: "Job plan file attachment."
      properties:
        id: {type: integer, readOnly: true, description: "Attachment ID"}
        fileName: {type: string, readOnly: true, description: "Original file name"}
        fileSize: {type: integer, readOnly: true, description: "File size in bytes"}
        contentType: {type: string, readOnly: true, description: "MIME type"}
        externalId: {type: string, description: "Your external reference ID"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Upload timestamp"}
        createdBy: {readOnly: true, description: "User who uploaded the file", allOf: [{$ref: '#/components/schemas/User'}]}

    # ── Employee ──

    Employee:
      type: object
      description: "Employee (People-extended module). Custom fields: `{field_name}_employees`. On create, `name` and `email` are required."
      required: [name, email]
      properties:
        id: {type: integer, format: int64, readOnly: true, description: "Unique record ID"}
        name: {type: string, description: "Full name (required, sortable)"}
        email: {type: string, description: "Email address (required, sortable)"}
        phone: {type: string, description: "Phone number"}
        mobile: {type: string, description: "Mobile number"}
        designation: {type: string, description: "Job title / designation"}
        department: {type: integer, description: "Department ID — returns {id, name} on GET"}
        active: {type: boolean, description: "Whether the employee is active"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modification timestamp (sortable)"}
        sysCreatedBy: {readOnly: true, description: "User who created the record", allOf: [{$ref: '#/components/schemas/User'}]}
        sysModifiedBy: {readOnly: true, description: "User who last modified the record", allOf: [{$ref: '#/components/schemas/User'}]}
      additionalProperties:
        description: "Custom fields (e.g. {field_name}_employees)"

    EmployeeComment:
      type: object
      description: "Employee comment/note."
      required: [body]
      properties:
        id: {type: integer, readOnly: true, description: "Comment ID"}
        body: {type: string, description: "Comment text content (required on create)"}
        bodyHTML: {type: string, readOnly: true, description: "HTML-formatted comment body"}
        externalId: {type: string, description: "Your external reference ID"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp"}
        createdBy: {readOnly: true, description: "User who posted the comment", allOf: [{$ref: '#/components/schemas/User'}]}

    EmployeeAttachment:
      type: object
      description: "Employee file attachment."
      properties:
        id: {type: integer, readOnly: true, description: "Attachment ID"}
        fileName: {type: string, readOnly: true, description: "Original file name"}
        fileSize: {type: integer, readOnly: true, description: "File size in bytes"}
        contentType: {type: string, readOnly: true, description: "MIME type"}
        externalId: {type: string, description: "Your external reference ID"}
        createdTime: {type: string, format: date-time, readOnly: true, description: "Upload timestamp"}
        createdBy: {readOnly: true, description: "User who uploaded the file", allOf: [{$ref: '#/components/schemas/User'}]}

    # ── Purchased Item ──

    PurchasedItem:
      type: object
      description: "Read-only. One purchase batch of an inventory item, with quantity, remaining stock, unit cost, and serial/lot tracking. Created via the inventory receipt / purchase-order flows, not through this API."
      properties:
        id: {type: integer, format: int64, readOnly: true, description: "Unique record ID (sortable)"}
        item: {readOnly: true, description: "Inventory item — returns {id, name}"}
        itemType: {readOnly: true, description: "Item type — returns {id, name}"}
        bin: {readOnly: true, description: "Storeroom bin — returns {id, name}"}
        lot: {readOnly: true, description: "Lot (when lot-tracked) — returns {id, name}"}
        quantity: {type: number, format: double, readOnly: true, description: "Quantity purchased in this batch (sortable)"}
        currentQuantity: {type: number, format: double, readOnly: true, description: "Quantity remaining from this batch (sortable)"}
        unitcost: {type: number, format: double, readOnly: true, description: "Unit cost for this batch (sortable)"}
        costDate: {type: string, format: date-time, readOnly: true, description: "Cost/purchase date (sortable)"}
        serialNumber: {type: string, readOnly: true, description: "Serial number when serial-tracked (sortable)"}
        isUsed: {type: boolean, readOnly: true, description: "Whether the batch has been consumed"}
        sysCreatedTime: {type: string, format: date-time, readOnly: true, description: "Creation timestamp (sortable)"}
        sysModifiedTime: {type: string, format: date-time, readOnly: true, description: "Last modification timestamp (sortable)"}
