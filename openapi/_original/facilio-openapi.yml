    get:
      tags: [Indoor Floor Plans]
      summary: Get facility/booking details for a set of spaces
      description: Module-level (no record id) — returns facility and facility-booking data for the given `spaceIds` over a time range. Used by the floor plan booking viewer to show which mapped spaces are already booked.
