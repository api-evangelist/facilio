          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleMetaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /indoorfloorplan/{id}/viewdata:
    get:
      tags: [Indoor Floor Plans]
      summary: Get floor plan viewer data
      description: Returns the markers, zones, and mapped module objects for the floor plan viewer or booking UI. `viewMode` selects `ASSIGNMENT` (default) or `BOOKING`; `objectIds` is a comma-separated list of marker/zone ids to filter to.
      operationId: getIndoorFloorPlanViewData
      parameters:
        - $ref: '#/components/parameters/recordId'
        - in: query
          name: viewMode
          schema: {type: string, enum: [ASSIGNMENT, BOOKING]}
        - in: query
          name: objectIds
          schema: {type: string}
          description: Comma-separated marker/zone ids
        - in: query
          name: startTime
          schema: {type: integer, format: int64}
          description: Epoch millis — required when viewMode=BOOKING
        - in: query
          name: endTime
          schema: {type: integer, format: int64}
          description: Epoch millis — required when viewMode=BOOKING
      responses:
        '200':
          description: Floor plan viewer data
          content:
            application/json:
              example:
                success: true
                data: {marker: {}, spaceZone: {}, indoorFloorPlan: {id: 500}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

