  # ════════════════════════════════════════════════════════════════
  # Assets
  # ════════════════════════════════════════════════════════════════

  /asset:
    get:
      tags: [Assets]
      summary: List assets
      description: Returns a paginated list of assets. Supports filtering by any field (e.g. `?category=HVAC&site(is)=10`).
      operationId: listAssets
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/view'
        - $ref: '#/components/parameters/changed'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, name, sysCreatedTime, sysModifiedTime]
        - name: sortOrder
          in: query
          schema: {type: string, enum: [asc, desc], default: asc}
      responses:
        '200':
          description: List of assets
          content:
            application/json:
              example:
                success: true
                data:
                  - {id: 14, name: "AHU-01", category: "HVAC", type: "Air Handling Unit", siteId: {id: 10}, moduleState: "Active", sysCreatedTime: "2026-01-15T10:00:00Z"}
                  - {id: 15, name: "AHU-02", category: "HVAC", type: "Air Handling Unit", siteId: {id: 10}, moduleState: "Active", sysCreatedTime: "2026-01-15T10:05:00Z"}
                pagination: {page: 1, pageSize: 50}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Assets]
      summary: Create an asset
      description: Creates a new asset. Category and type accept picklist display names or IDs.
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/Asset'
            example:
              data:
                name: "AHU-03"
                category: "HVAC"
                type: "Air Handling Unit"
                siteId: 10
                manufacturer: "Carrier"
                model: "39M"
                serialNumber: "SN-2026-003"
                warranty_info_asset: "2 year full warranty"
      responses:
        '201':
          description: Asset created
          content:
            application/json:
              example:
                success: true
                data: {id: 16, name: "AHU-03", category: "HVAC", siteId: {id: 10, name: "Headquarters"}, sysCreatedTime: "2026-02-14T10:00:00Z"}
                message: "Record created"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /asset/{id}:
    get:
      tags: [Assets]
      summary: Get an asset
      description: Returns a single asset with all system and custom fields.
      operationId: getAsset
      parameters: [{$ref: '#/components/parameters/recordId'}, {$ref: '#/components/parameters/select'}, {$ref: '#/components/parameters/expand'}]
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              example:
                success: true
                data:
                  id: 14
                  name: "AHU-01"
                  description: "Air Handling Unit in Building A"
                  serialNumber: "SN-2026-001"
                  category: "HVAC"
                  type: "Air Handling Unit"
                  siteId: {id: 10, name: "Headquarters"}
                  space: {id: 20, name: "Mechanical Room"}
                  moduleState: "Active"
                  manufacturer: "Carrier"
                  model: "39M"
                  department: "Facilities"
                  sysCreatedTime: "2026-01-15T10:00:00Z"
                  sysCreatedBy: {id: 1, name: "Alex Johnson", email: "alex.johnson@example.com"}
                  warranty_info_asset: "2 year full warranty"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Assets]
      summary: Update an asset
      description: Updates an existing asset. Only included fields are changed.
      operationId: updateAsset
      parameters: [{$ref: '#/components/parameters/recordId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/Asset'
            example:
              data: {name: "AHU-01 (Updated)", model: "39M-R2"}
      responses:
        '200':
          description: Asset updated
          content:
            application/json:
              example: {success: true, data: {id: 14, name: "AHU-01 (Updated)"}, message: "Record updated"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Assets]
      summary: Delete an asset
      description: Permanently deletes an asset.
      operationId: deleteAsset
      parameters: [{$ref: '#/components/parameters/recordId'}]
      responses:
        '200':
          description: Asset deleted
          content:
            application/json:
              example: {success: true, message: "Record deleted"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /asset/metadata:
    get:
      tags: [Assets]
      summary: Get asset field schema
      description: Returns the field schema for the asset module, including all declared system fields and any org-specific custom fields with their data type, required/readOnly flags, and lookup targets.
      operationId: getAssetMetadata
      parameters:
