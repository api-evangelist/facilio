aid: facilio
name: Facilio
description: >-
  Facilio is a connected operations platform for facility, property, and asset
  management, built around an AI-powered CMMS (Computerized Maintenance
  Management System). It unifies maintenance teams, vendors, tenants, and
  building systems so operators can run work orders, service requests, assets,
  inventory, purchasing, and portfolio data across multi-site real estate at
  scale. The platform spans Connected CMMS, the Atom AI suite, Connected
  Buildings (energy and sustainability), and Connected Refrigeration (IoT
  monitoring). Facilio exposes a versioned REST API (v5), a FOQL SQL-like query
  language, embeddable Connected Apps, and a hosted Model Context Protocol (MCP)
  server so ERP, accounting, BMS, IoT, CRM, and reporting systems — and AI
  agents — can query and act on operational data using the caller's existing
  Facilio permissions. Facilio serves retail chains, healthcare, commercial real
  estate portfolios, FM service providers, and education across US, EU, UK, AU,
  AE, and SA regions.
