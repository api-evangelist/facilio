notes: >-
  Two auth models. API-key requests use the 'maintenance' app on the regional
  host (x-api-key header). OAuth2 requests use the 'developer' app. Host template
  is https://{region}.facilioapis.com/{app_name}/api/v5 with region in
  [us, au, ae, uk, us-azure, sa]. OAuth2 identity endpoints are region-scoped
  (e.g. https://us.facilioapis.com/identity/oauth2/...). The hosted MCP server
  (mcp.facilio.com) is a separate OAuth 2.0 authorization server with granular
  scopes — see scopes/facilio-scopes.yml.
